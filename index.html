a landscape recognized by UNESCO for its cultural significance. A river cruise or scenic train ride offers the classic way to see the valley's dramatic terracing. Small quintas, or wine estates, throughout the region offer tastings directly from the source."}, {"name": "Óbidos", "wiki": "Óbidos", "desc": "A small, whitewashed medieval town enclosed within intact fortress walls, once given as a wedding gift from Portuguese kings to their queens. Ginjinha, a sour cherry liqueur, is traditionally served in small chocolate cups from stalls along its single main street. Walking the full loop of the town walls offers views over the surrounding countryside."}], "itineraryDays": 8, "itinerary": [{"label": "Days 1–3", "title": "Lisbon & Sintra", "desc": "The old neighborhoods, a tram ride, and a day trip to Sintra's palaces."}, {"label": "Days 4–5", "title": "Porto & the Douro Valley", "desc": "Port wine cellars and a boat trip up the Douro's terraced vineyards."}, {"label": "Days 6–8", "title": "Algarve", "desc": "Base in Lagos or Faro for beaches and coastal boat trips."}]}, {"id": "san-marino", "name": "San Marino", "flag": "🇸🇲", "capital": "City of San Marino", "population": "34,000", "language": "Italian", "currency": "Euro", "bestTime": "April–June, September–October", "blurb": "Perched on Mount Titano and surrounded entirely by Italy, San Marino claims to be the world's oldest surviving republic, its medieval towers reachable as an easy day trip from the Adriatic coast.", "attractions": [{"name": "Three Towers of San Marino", "wiki": "Towers_of_San_Marino", "desc": "Three medieval fortresses, Guaita, Cesta, and Montale, sit along the ridge of Mount Titano, each built at a different point to defend the republic and offering increasingly dramatic views as visitors move between them. Guaita, the oldest and most visited, dates to the 11th century and remains partly used for ceremonial purposes. On a clear day, the view extends across the Adriatic coastline below."}, {"name": "Basilica di San Marino", "wiki": "Basilica_di_San_Marino", "desc": "A neoclassical basilica built in the 19th century on the site of an earlier church, said to house the remains of Saint Marinus, the stonemason credited with founding the republic in the 4th century. Its columned facade and central position in the old town make it a natural stop on any walk through the capital. The interior is more restrained than the exterior might suggest."}, {"name": "Palazzo Pubblico", "wiki": "Palazzo_Pubblico_(San_Marino)", "desc": "San Marino's town hall and seat of government, its crenellated tower and clock face overlooking the main square. A changing of the guard ceremony takes place several times a day, drawing small crowds of visitors. The building's neo-Gothic style, rebuilt in the late 19th century, deliberately evokes the republic's medieval origins."}, {"name": "State Museum of San Marino", "wiki": "Museo_di_Stato_(San_Marino)", "desc": "Housed in a former convent, this museum traces the republic's long history through archaeological finds, paintings, and artifacts spanning from prehistory to the modern era. It offers useful context for a country whose independence dates back further than most European nations. The collection is compact enough to see in under an hour."}, {"name": "Cable car to Borgo Maggiore", "wiki": "Borgo_Maggiore", "desc": "A short cable car connects the hilltop capital to Borgo Maggiore below, a market town with its own more relaxed pace and a large Thursday market. The ride itself offers sweeping views over the surrounding Italian countryside. It's a straightforward way to see more of the country beyond the walled capital."}, {"name": "City walls and gates", "wiki": "City_of_San_Marino", "desc": "The old capital remains largely enclosed by its original medieval walls, entered through a series of stone gates that have changed little in appearance for centuries. Walking the perimeter offers a strong sense of the city's defensive layout and its commanding position atop Mount Titano. The narrow lanes inside are largely pedestrian and easy to explore on foot."}], "itineraryDays": 2, "itinerary": [{"label": "Day 1", "title": "The Three Towers", "desc": "Walk the ridge of Mount Titano between Guaita, Cesta, and Montale for coastal views."}, {"label": "Day 2", "title": "Old town & Borgo Maggiore", "desc": "The Basilica, Palazzo Pubblico, and a cable car ride down to the market town below."}]}, {"id": "serbia", "name": "Serbia", "flag": "🇷🇸", "capital": "Belgrade", "population": "6.6 million", "language": "Serbian", "currency": "Serbian dinar", "bestTime": "April–June, September–October", "blurb": "Belgrade's fortress overlooking two rivers and a famously loud nightlife scene anchor a country still relatively new to most travelers' itineraries, with monasteries and canyons further south.", "attractions": [{"name": "Belgrade Fortress & Kalemegdan Park", "wiki": "Belgrade_Fortress", "desc": "A fortress dating back to Roman times, sitting at the confluence of the Sava and Danube rivers, its layered ruins reflecting centuries of Ottoman, Austrian, and Serbian control. The surrounding Kalemegdan Park is one of the city's most popular gathering spots, especially at sunset over the river junction below. A military museum within the fortress walls covers the region's long military history."}, {"name": "Skadarlija, Belgrade", "wiki": "Skadarlija", "desc": "A cobbled bohemian quarter modeled loosely on Montmartre, lined with traditional restaurants serving Serbian cuisine alongside live folk music most evenings. It was once home to many of Belgrade's writers and artists in the early 20th century. It remains one of the liveliest areas of the city after dark."}, {"name": "Studenica Monastery", "wiki": "Studenica_monastery", "desc": "A UNESCO-listed medieval monastery founded in the 12th century, its white marble churches containing some of the best-preserved Byzantine fresco painting in the Balkans. It remains an active monastic community set in a quiet forested valley in central Serbia. The site holds deep significance in Serbian Orthodox religious and national identity."}, {"name": "Đavolja Varoš (Devil's Town)", "wiki": "Đavolja_Varoš", "desc": "A cluster of over 200 unusual earth pyramids, formed by erosion, each capped with a boulder that protects the softer soil beneath from washing away. Local legend attributes the eerie formations to petrified wedding guests cursed by the devil. The site is one of Serbia's more unusual natural attractions, tucked into the country's south."}, {"name": "Novi Sad & Petrovaradin Fortress", "wiki": "Petrovaradin_Fortress", "desc": "An 18th-century Austro-Hungarian fortress overlooking the Danube in Novi Sad, Serbia's second city, its clock tower famously showing the hour and minute hands reversed in size. The fortress hosts the EXIT music festival each summer, drawing large international crowds. The old town below retains a distinctly Central European feel compared to Belgrade."}, {"name": "Uvac Canyon", "wiki": "Uvac_Special_Nature_Reserve", "desc": "A dramatically winding river canyon in southwestern Serbia, its tight meanders best appreciated from a series of clifftop viewpoints. It's also an important refuge for the griffon vulture, one of Europe's largest birds of prey. Boat trips through the canyon are available for a closer view of the winding gorge."}], "itineraryDays": 6, "itinerary": [{"label": "Days 1–2", "title": "Belgrade", "desc": "The fortress, Kalemegdan Park, and an evening in the Skadarlija quarter."}, {"label": "Day 3", "title": "Novi Sad", "desc": "Petrovaradin Fortress and the more Central European old town."}, {"label": "Day 4", "title": "Uvac Canyon", "desc": "Clifftop viewpoints over the winding river gorge."}, {"label": "Days 5–6", "title": "Studenica & the south", "desc": "The medieval monastery and, time permitting, Devil's Town's earth pyramids."}]}, {"id": "slovakia", "name": "Slovakia", "flag": "🇸🇰", "capital": "Bratislava", "population": "5.4 million", "language": "Slovak", "currency": "Euro", "bestTime": "May–September", "blurb": "Slovakia pairs an easy, walkable capital on the Danube with the dramatic High Tatras mountains and a dense concentration of medieval castles further inland.", "attractions": [{"name": "Bratislava Castle", "wiki": "Bratislava_Castle", "desc": "A large white castle overlooking the Danube and the city below, its current form largely a 20th-century reconstruction after a long period as a ruin following an 18th-century fire. Its hilltop terrace offers views across the river into neighboring Austria on clear days. The compact old town beneath it is easily explored on foot in half a day."}, {"name": "High Tatras", "wiki": "Tatra_Mountains", "desc": "Slovakia's highest mountain range, its jagged granite peaks and glacial lakes offering some of the most dramatic alpine scenery in Central Europe within a relatively compact area. The resort town of Štrbské Pleso serves as a base for hiking trails ranging from easy lakeside walks to demanding high-altitude routes. Cable cars provide access to high viewpoints for those not hiking the full routes."}, {"name": "Spiš Castle", "wiki": "Spiš_Castle", "desc": "One of the largest castle complexes in Central Europe, its ruined but extensive walls sprawling across a hilltop visible for miles around. Though partly destroyed by fire in the 18th century, enough remains to give a strong sense of its former scale and defensive importance. It's a UNESCO World Heritage Site and a common stop between Bratislava and the High Tatras."}, {"name": "Slovak Paradise National Park", "wiki": "Slovak_Paradise_National_Park", "desc": "A national park known for narrow gorges fitted with ladders, chains, and walkways that let hikers climb directly alongside waterfalls and through tight rock passages. It's a more adventurous style of hiking than typical mountain trails, requiring a reasonable level of fitness and comfort with heights. The park's dense forest and numerous cascades reward the effort."}, {"name": "Devín Castle", "wiki": "Devín_Castle", "desc": "Ruins of a castle perched where the Danube and Morava rivers meet, marking the border between Slovakia and Austria. Its strategic position made it a significant fortress for over a thousand years, though it was largely destroyed by Napoleon's troops in the early 19th century. It's an easy day trip from Bratislava, reachable by bus or boat along the river."}, {"name": "Bardejov's Old Town", "wiki": "Bardejov", "desc": "A remarkably well-preserved medieval town square in eastern Slovakia, its Gothic town hall and surrounding merchant houses earning it UNESCO World Heritage status. The nearby open-air museum of wooden folk architecture adds a rural counterpoint to the town's more formal square. It sees far fewer visitors than Bratislava or the Tatras, offering a quieter pace."}], "itineraryDays": 8, "itinerary": [{"label": "Days 1–2", "title": "Bratislava", "desc": "Bratislava Castle, the old town, and a day trip to Devín Castle."}, {"label": "Day 3", "title": "Spiš Castle", "desc": "A stop at one of Central Europe's largest castle complexes en route east."}, {"label": "Days 4–6", "title": "High Tatras", "desc": "Hiking among glacial lakes and granite peaks based out of Štrbské Pleso."}, {"label": "Days 7–8", "title": "Slovak Paradise", "desc": "Gorge hiking with ladders and chains through the national park's waterfalls."}]}, {"id": "spain", "name": "Spain", "flag": "🇪🇸", "capital": "Madrid", "population": "48 million", "language": "Spanish", "currency": "Euro", "bestTime": "April–June, September–October", "blurb": "Spain's regions feel distinct enough to be different countries: Madrid's grand boulevards, Andalusia's Moorish palaces, and Barcelona's unmistakable Gaudí architecture all sit within a single well-connected rail network.", "attractions": [{"name": "Sagrada Família, Barcelona", "wiki": "Sagrada_Família", "desc": "Antoni Gaudí's still-unfinished basilica has been under construction since 1882, its facades combining organic, nature-inspired forms with dense religious symbolism. Inside, columns branch like trees to support a ceiling filled with color from stained glass windows. Completion is now targeted for the coming years, making a visit feel genuinely part of an ongoing story."}, {"name": "Alhambra, Granada", "wiki": "Alhambra", "desc": "A Moorish palace and fortress complex overlooking Granada, its intricate stucco work, tiled courtyards, and reflecting pools represent the high point of Islamic architecture in Spain. The Generalife gardens beside it add terraced fountains and manicured hedges. Tickets sell out well in advance and should be booked long before arrival."}, {"name": "Park Güell, Barcelona", "wiki": "Park_Güell", "desc": "Another Gaudí creation, this public park combines mosaic-tiled benches, whimsical gingerbread-style gatehouses, and a terrace offering panoramic views over Barcelona to the sea. It was originally designed as a failed housing development before being converted into a park. The main monumental area requires a timed ticket, though much of the surrounding park is free to enter."}, {"name": "Plaza Mayor & the Royal Palace, Madrid", "wiki": "Royal_Palace_of_Madrid", "desc": "Madrid's grand central square dates to the 17th century and remains a hub for cafes and street performers, while the nearby Royal Palace, Europe's largest by floor area, still hosts state ceremonies despite the royal family living elsewhere. Its opulent throne room and armory collection are highlights of a visit. The Prado Museum, one of the world's great art collections, sits within easy walking distance."}, {"name": "Mezquita of Córdoba", "wiki": "Mosque–Cathedral_of_Córdoba", "desc": "A former mosque, its forest of over 850 red-and-white striped arches among the most distinctive interiors in Islamic architecture, later converted into a Catholic cathedral with a Renaissance nave inserted directly into its center. The building's layered history, spanning Roman, Visigothic, Islamic, and Christian periods, is visible in its very structure. It anchors Córdoba's well-preserved old Jewish quarter."}, {"name": "Camino de Santiago", "wiki": "Camino_de_Santiago", "desc": "A network of ancient pilgrimage routes across northern Spain, all converging on the cathedral of Santiago de Compostela, where tradition holds the remains of the apostle James are buried. Walking even a short final stretch, common among modern pilgrims, offers a slower way to see rural Galicia. The cathedral's Botafumeiro incense burner, swung dramatically during certain masses, is a memorable sight for those who catch it."}], "itineraryDays": 12, "itinerary": [{"label": "Days 1–4", "title": "Barcelona", "desc": "The Sagrada Família, Park Güell, and the Gothic Quarter's old lanes."}, {"label": "Days 5–7", "title": "Madrid", "desc": "The Royal Palace, Plaza Mayor, and the Prado's collection."}, {"label": "Days 8–9", "title": "Córdoba", "desc": "The Mezquita's striped arches and the old Jewish quarter."}, {"label": "Days 10–12", "title": "Granada & the Alhambra", "desc": "The Moorish palace complex and the Albaicín's winding streets before departure."}]}, {"id": "sweden", "name": "Sweden", "flag": "🇸🇪", "capital": "Stockholm", "population": "10.5 million", "language": "Swedish", "currency": "Swedish krona", "bestTime": "May–August", "blurb": "Stockholm's spread across fourteen islands gives it one of the most attractive waterfront settings of any European capital, with easy access further north to Lapland's wilderness.", "attractions": [{"name": "Gamla Stan, Stockholm", "wiki": "Gamla_stan", "desc": "Stockholm's medieval old town, its narrow cobbled lanes and colorful buildings sitting on a small island at the city's historic core. The Royal Palace, still used for official functions, anchors one end, while cafes and craft shops fill the streets radiating outward. It's compact enough to explore thoroughly on foot in a day."}, {"name": "Vasa Museum", "wiki": "Vasa_Museum", "desc": "Home to a nearly fully intact 17th-century warship that sank on its maiden voyage in Stockholm harbor and was recovered largely intact after 333 years underwater. The scale of the preserved ship, viewable from several levels, is genuinely striking in person. It remains one of the most visited museums in Scandinavia."}, {"name": "Stockholm Archipelago", "wiki": "Stockholm_archipelago", "desc": "Around 30,000 islands and skerries spread east of the city into the Baltic Sea, ranging from developed towns to bare rock outcrops. Ferries make it easy to island-hop for a day or stay overnight in a lakeside-style cabin. It's a defining part of Stockholm life for locals looking to escape the city in summer."}, {"name": "Icehotel, Jukkasjärvi", "wiki": "Icehotel", "desc": "Rebuilt each winter from ice and snow harvested from the nearby Torne River, this hotel above the Arctic Circle features rooms carved by different artists each season, no two ever quite the same. Guests can sleep on ice beds under reindeer skins, or opt for a warmer room nearby. It's often combined with a chance at seeing the northern lights."}, {"name": "ABBA Museum, Stockholm", "wiki": "ABBA_The_Museum", "desc": "An interactive museum dedicated to Sweden's most famous pop export, letting visitors sing along on a virtual stage or try on stage costumes from the band's height. It leans firmly into fun rather than formal history, with genuine artifacts alongside more playful exhibits. It's a lighter counterpoint to the city's more historical museums."}, {"name": "Kiruna & the Northern Lights", "wiki": "Kiruna", "desc": "Sweden's northernmost town, built around an enormous underground iron mine that has required the gradual relocation of parts of the town itself. Its location well above the Arctic Circle makes it one of the more reliable places in the country to see the aurora borealis on clear winter nights. Dog sledding and snowmobile tours are common ways to explore the surrounding wilderness."}], "itineraryDays": 8, "itinerary": [{"label": "Days 1–3", "title": "Stockholm", "desc": "Gamla Stan, the Vasa Museum, and the ABBA Museum."}, {"label": "Day 4", "title": "Stockholm Archipelago", "desc": "A ferry day trip out among the thousands of islands east of the city."}, {"label": "Days 5–6", "title": "Kiruna", "desc": "Fly north for a chance at the northern lights and Arctic wilderness activities."}, {"label": "Days 7–8", "title": "Icehotel", "desc": "A night at the seasonal ice hotel before returning south for departure."}]}, {"id": "switzerland", "name": "Switzerland", "flag": "🇨🇭", "capital": "Bern", "population": "8.9 million", "language": "German, French, Italian, Romansh", "currency": "Swiss franc", "bestTime": "June–September, December–March for skiing", "blurb": "Switzerland's train network makes it one of the easiest countries in the world to see by public transport, linking glacier peaks, lakeside cities, and mountain villages without ever needing a car.", "attractions": [{"name": "Matterhorn & Zermatt", "wiki": "Matterhorn", "desc": "One of the most recognizable mountains in the world, its near-perfect pyramid shape rising above the car-free village of Zermatt. Cable cars and cogwheel trains climb to viewpoints like Gornergrat for close-up views without technical climbing. In winter it anchors one of the Alps' best-known ski areas."}, {"name": "Jungfraujoch", "wiki": "Jungfraujoch", "desc": "Known as the 'Top of Europe', this is the highest railway station on the continent, reached by a scenic train that tunnels through the Eiger and Mönch mountains. An observation deck and ice palace sit at over 3,400 meters, with views over the Aletsch Glacier, the largest in the Alps. The journey up is as much the attraction as the summit itself."}, {"name": "Lake Lucerne & Mount Pilatus", "wiki": "Lake_Lucerne", "desc": "A lake ringed by mountains and old towns, with Lucerne's wooden Chapel Bridge as its best-known landmark. A steep cogwheel railway climbs nearby Mount Pilatus, the world's steepest, to a summit with panoramic Alpine views. Boat cruises across the lake connect several charming villages along its shores."}, {"name": "Rhine Falls", "wiki": "Rhine_Falls", "desc": "The largest waterfall in Europe by volume, formed where the Rhine drops over a wide limestone ledge near the town of Schaffhausen. Boat trips can take visitors right up to the rock in the middle of the falls, or even to a viewing platform on top of it. It's an easy day trip from Zurich."}, {"name": "Lavaux vineyard terraces", "wiki": "Lavaux", "desc": "UNESCO-listed terraced vineyards climbing steeply above Lake Geneva, cultivated since medieval times and still producing wine today. Walking trails wind between the stone-walled terraces, with views across the lake to the French Alps beyond. Small villages along the route offer wine tastings directly from the producers."}, {"name": "Bern's Old Town", "wiki": "Old_City_of_Bern", "desc": "Switzerland's capital preserves one of Europe's best-kept medieval town centers, its arcaded sandstone streets earning it UNESCO World Heritage status. A famous astronomical clock tower and a bear park along the river add character beyond the architecture. It's compact enough to explore fully in a day."}], "itineraryDays": 9, "itinerary": [{"label": "Days 1–2", "title": "Zurich & Rhine Falls", "desc": "Settle in the largest city, with a day trip to Europe's biggest waterfall."}, {"label": "Days 3–4", "title": "Lucerne & Mount Pilatus", "desc": "Lake cruises and the world's steepest cogwheel railway to a mountain summit."}, {"label": "Days 5–7", "title": "Zermatt & the Matterhorn", "desc": "Cable car viewpoints of the iconic peak and a scenic train to Jungfraujoch."}, {"label": "Days 8–9", "title": "Lake Geneva & Lavaux", "desc": "Terraced vineyards above the lake and a stop in Bern's medieval old town on the way."}]}, {"id": "turkey", "name": "Turkey", "flag": "🇹🇷", "capital": "Ankara", "population": "85 million", "language": "Turkish", "currency": "Turkish lira", "bestTime": "April–May, September–October", "blurb": "Turkey bridges Europe and Asia both geographically and culturally, with Istanbul's layered empires, Cappadocia's surreal landscape, and the Aegean coast covering very different sides of the country.", "attractions": [{"name": "Hagia Sophia, Istanbul", "wiki": "Hagia_Sophia", "desc": "Built as a Byzantine cathedral in the 6th century, later converted to a mosque, then a museum, and again a mosque, its massive dome and shifting religious history make it one of the most significant buildings in the world. Faded Christian mosaics still sit alongside Islamic calligraphy inside. It anchors Istanbul's historic Sultanahmet district."}, {"name": "Cappadocia's fairy chimneys", "wiki": "Cappadocia", "desc": "A landscape of cone-shaped rock formations carved by erosion, riddled with ancient cave dwellings and underground cities once used for shelter. Hot air balloon flights at dawn, drifting silently over the valleys as the sun rises, have become one of Turkey's most iconic experiences. Many hotels here are built directly into the rock formations themselves."}, {"name": "Pamukkale's travertine terraces", "wiki": "Pamukkale", "desc": "Bright white calcium terraces cascade down a hillside, formed by mineral-rich hot springs that have been used for bathing since Roman times. The ruins of the ancient spa city of Hierapolis sit directly above the terraces, including a well-preserved theater. Walking barefoot across the terraces, as required to protect them, adds a distinctly tactile experience."}, {"name": "Blue Mosque, Istanbul", "wiki": "Sultan_Ahmed_Mosque", "desc": "Named for the blue İznik tiles lining its interior, this active mosque sits directly across a plaza from the Hagia Sophia, allowing an easy comparison between Byzantine and Ottoman architectural approaches. Its six minarets were, at the time of construction, a bold and controversial choice matching Mecca's Grand Mosque. It remains open to visitors outside prayer times."}, {"name": "Ephesus", "wiki": "Ephesus", "desc": "One of the best-preserved ancient cities in the Mediterranean, its marble-paved streets leading to the towering facade of the Library of Celsus and a large amphitheater still used for events today. It was once a major Roman port city before the harbor silted up and the sea receded. A visit here gives an unusually complete sense of daily Roman urban life."}, {"name": "Grand Bazaar, Istanbul", "wiki": "Grand_Bazaar,_Istanbul", "desc": "One of the largest and oldest covered markets in the world, its 4,000-plus shops spread across 61 covered streets selling carpets, ceramics, jewelry, and spices. It has operated continuously since the 15th century, making it a living link to the city's Ottoman trading past. Getting pleasantly lost in its lanes is part of the experience."}], "itineraryDays": 10, "itinerary": [{"label": "Days 1–4", "title": "Istanbul", "desc": "The Hagia Sophia, Blue Mosque, and the Grand Bazaar's covered lanes."}, {"label": "Days 5–6", "title": "Cappadocia", "desc": "A sunrise hot air balloon flight and exploring the region's cave dwellings and valleys."}, {"label": "Days 7–8", "title": "Pamukkale & Ephesus", "desc": "The white travertine terraces and one of the best-preserved ancient cities in the Mediterranean."}, {"label": "Days 9–10", "title": "Return to Istanbul", "desc": "A final day for anything missed before departure."}]}, {"id": "uk", "name": "United Kingdom", "flag": "🇬🇧", "capital": "London", "population": "68 million", "language": "English", "currency": "Pound sterling", "bestTime": "May–September", "blurb": "The UK's mix of world cities, castles, and dramatic coastline means most first trips focus on London before branching out to Edinburgh or the countryside for a fuller picture.", "attractions": [{"name": "Tower of London", "wiki": "Tower_of_London", "desc": "A nearly thousand-year-old fortress on the Thames that has served as a royal palace, prison, and treasury, now home to the Crown Jewels. Yeoman Warders, known as Beefeaters, lead tours covering centuries of executions, escapes, and royal history within its walls. Its ravens, protected by legend and tradition, are as much a fixture as the stonework."}, {"name": "Stonehenge", "wiki": "Stonehenge", "desc": "A prehistoric circle of massive standing stones on Salisbury Plain, erected in stages over thousands of years for purposes still debated by archaeologists. Its alignment with the summer and winter solstices suggests some astronomical or ceremonial function, though certainty remains elusive. A visitor center and surrounding barrows add context to the stones themselves."}, {"name": "Edinburgh Castle", "wiki": "Edinburgh_Castle", "desc": "Perched on an extinct volcanic crag above Edinburgh's old town, this castle has anchored Scottish history for centuries, housing the Scottish crown jewels and the Stone of Destiny used in royal coronations. A cannon still fires each day at one o'clock, a tradition dating back to give ships an accurate time signal. The Royal Mile leads directly from its gates through the heart of the old city."}, {"name": "British Museum, London", "wiki": "British_Museum", "desc": "A vast, free museum holding artifacts spanning human history from nearly every continent, including the Rosetta Stone and the Parthenon Marbles. Its glass-roofed Great Court, one of the largest covered public squares in Europe, sits at the heart of the building. A single visit can only meaningfully cover a small selection of its eight million objects."}, {"name": "Lake District", "wiki": "Lake_District", "desc": "A national park of glacial lakes and fell walking trails in northwest England, home to England's highest peak, Scafell Pike, and long associated with the Romantic poets, including William Wordsworth. Small stone villages like Ambleside and Grasmere serve as bases for hiking and lakeside walks. It's a favorite for a slower, greener contrast to the country's cities."}, {"name": "Giant's Causeway", "wiki": "Giant%27s_Causeway", "desc": "Around 40,000 interlocking hexagonal basalt columns line the coast of Northern Ireland, formed by an ancient volcanic eruption but wrapped in local legend involving a giant named Finn McCool. A coastal path leads directly among the columns, with dramatic cliff scenery along the wider Causeway Coast. It's a UNESCO World Heritage Site and Northern Ireland's most visited natural attraction."}], "itineraryDays": 11, "itinerary": [{"label": "Days 1–4", "title": "London", "desc": "The Tower of London, the British Museum, and a day trip to Stonehenge."}, {"label": "Days 5–6", "title": "Lake District", "desc": "Fell walking and lakeside villages in England's northwest."}, {"label": "Days 7–8", "title": "Edinburgh", "desc": "Edinburgh Castle and the Royal Mile through Scotland's old town."}, {"label": "Days 9–11", "title": "Northern Ireland", "desc": "The Giant's Causeway and the Causeway Coast before departure."}]}, {"id": "vatican", "name": "Vatican City", "flag": "🇻🇦", "capital": "Vatican City", "population": "800", "language": "Italian, Latin", "currency": "Euro", "bestTime": "April–May, September–October", "blurb": "The world's smallest sovereign state sits entirely within Rome, its dense concentration of Renaissance art and the seat of the Catholic Church drawing visitors on a scale wildly out of proportion to its size.", "attractions": [{"name": "St. Peter's Basilica", "wiki": "St._Peter%27s_Basilica", "desc": "The largest church in the world by interior volume, built over what is believed to be the burial site of St. Peter, with Michelangelo's dome dominating Rome's skyline from miles away. Bernini's massive bronze baldachin sits directly beneath the dome, marking the high altar. Climbing to the top of the dome, partly by stairs and partly by elevator, offers one of the best views over Rome."}, {"name": "Sistine Chapel", "wiki": "Sistine_Chapel", "desc": "The chapel where papal conclaves elect new popes, its ceiling covered by Michelangelo's famous frescoes, including the Creation of Adam, painted over four years while lying on scaffolding. The Last Judgment covers the entire altar wall, added by the artist decades later. Strict silence is enforced inside despite the often considerable crowds."}, {"name": "Vatican Museums", "wiki": "Vatican_Museums", "desc": "A vast museum complex housing centuries of papal art collections, including classical sculpture, Raphael's frescoed rooms, and an Egyptian collection, all leading eventually to the Sistine Chapel. The sheer scale means most visitors follow a set route rather than attempting to see everything. Booking tickets online in advance significantly reduces wait times."}, {"name": "St. Peter's Square", "wiki": "St._Peter%27s_Square", "desc": "Bernini's grand elliptical plaza, framed by colonnades of over 280 columns, designed to embrace visitors arriving to the basilica. The Pope delivers a blessing from a window overlooking the square most Sundays, and larger audiences are held here on Wednesdays. An Egyptian obelisk, brought to Rome in antiquity, stands at its center."}, {"name": "Vatican Gardens", "wiki": "Vatican_Gardens", "desc": "Formal and wooded gardens covering roughly half of Vatican City's small territory, accessible only by guided tour booked in advance. Fountains, grottoes, and a replica of the Lourdes shrine sit among manicured lawns rarely seen by the general public. The tour offers a quieter, greener contrast to the crowded museums and basilica."}, {"name": "Vatican Necropolis", "wiki": "Vatican_Necropolis", "desc": "An excavated ancient Roman burial ground beneath St. Peter's Basilica, believed to include the tomb of St. Peter himself. Access requires a separate, limited-capacity guided tour booked well in advance due to the site's fragility and confined spaces. It offers a rare, direct link to the earliest history of the Christian church on this site."}], "itineraryDays": 1, "itinerary": [{"label": "Morning", "title": "Vatican Museums & Sistine Chapel", "desc": "An early, pre-booked entry to move through the museums ahead of the busiest crowds."}, {"label": "Midday", "title": "St. Peter's Basilica", "desc": "The basilica's interior and, for those willing to climb, the dome's rooftop views."}, {"label": "Afternoon", "title": "St. Peter's Square", "desc": "A slower walk through Bernini's colonnaded square before returning into Rome."}]}]}, {"id": "north-america", "name": "North America", "tagline": "National parks, road trips, and coasts on both sides", "color": "#445C8C", "countries": [{"id": "belize", "name": "Belize", "flag": "🇧🇿", "capital": "Belmopan", "population": "410,000", "language": "English", "currency": "Belize dollar", "bestTime": "December–April", "blurb": "Belize's barrier reef, the second largest in the world, and its Maya ruins tucked into jungle make it an easy country to split between diving and inland exploring.", "attractions": [{"name": "Great Blue Hole", "wiki": "Great_Blue_Hole", "desc": "A massive marine sinkhole nearly 300 meters across and over 124 meters deep, its perfectly circular shape visible clearly from the air and famously explored by Jacques Cousteau in the 1970s. Divers descend past ancient stalactites formed when the cave system was above sea level. It sits within Lighthouse Reef, reachable by boat from the mainland or the cayes."}, {"name": "Belize Barrier Reef", "wiki": "Belize_Barrier_Reef", "desc": "The largest barrier reef in the Western Hemisphere, stretching along nearly the entire coast and supporting an exceptional diversity of coral, fish, and marine life. Snorkeling and diving trips from Caye Caulker or Ambergris Caye offer close encounters with nurse sharks and stingrays at well-known sites like Shark Ray Alley. Its UNESCO World Heritage status reflects its ecological importance."}, {"name": "Caracol", "wiki": "Caracol", "desc": "The largest known Maya archaeological site in Belize, once home to a population estimated to have rivaled that of contemporary Tikal across the border in Guatemala. Its central pyramid, Caana or 'sky place', remains the tallest man-made structure in the country. The site's remote jungle setting, deep within the Chiquibul Forest, keeps visitor numbers relatively low."}, {"name": "Actun Tunichil Muknal cave", "wiki": "Actun_Tunichil_Muknal", "desc": "A cave system requiring a river crossing and a swim to enter, leading to chambers containing ancient Maya ceremonial artifacts and skeletal remains left largely undisturbed since they were placed there over a thousand years ago. The most striking find, a fully calcified skeleton nicknamed the 'Crystal Maiden', remains in its original position. It's considered one of the most significant and atmospheric cave sites in Central America."}, {"name": "Caye Caulker", "wiki": "Caye_Caulker", "desc": "A small, car-free island known for its relaxed 'go slow' motto, golf carts and bicycles the main modes of transport along its sandy streets. It serves as a quieter, more budget-friendly base for reef trips than the more developed Ambergris Caye nearby. The Split, a narrow channel through the island, is a popular swimming spot."}, {"name": "Xunantunich", "wiki": "Xunantunich", "desc": "A Maya ceremonial site reached by a small hand-cranked ferry across the Mopan River, its main pyramid, El Castillo, offering views into neighboring Guatemala from the summit. Unlike more remote sites, it's easily combined with a day trip from San Ignacio in western Belize. Distinct stucco friezes remain visible on parts of the structure."}], "itineraryDays": 7, "itinerary": [{"label": "Days 1–3", "title": "Caye Caulker or Ambergris Caye", "desc": "Reef snorkeling, a boat trip to the Great Blue Hole, and island time."}, {"label": "Days 4–5", "title": "San Ignacio & Xunantunich", "desc": "A short river crossing to a Maya ceremonial site with views into Guatemala."}, {"label": "Day 6", "title": "Actun Tunichil Muknal", "desc": "A river and cave adventure to see ancient Maya ceremonial remains."}, {"label": "Day 7", "title": "Caracol", "desc": "A longer trip into the Chiquibul Forest to Belize's largest Maya site."}]}, {"id": "canada", "name": "Canada", "flag": "🇨🇦", "capital": "Ottawa", "population": "40 million", "language": "English, French", "currency": "Canadian dollar", "bestTime": "June–September", "blurb": "Canada's coast-to-coast distances mean most trips pick a region; a Vancouver-to-Banff loop covers mountains, lakes, and one major city well.", "attractions": [{"name": "Banff & Lake Louise", "wiki": "Banff_National_Park", "desc": "Turquoise glacial lakes set against the Canadian Rockies, their striking color caused by fine rock flour suspended in the meltwater. Canoeing on Lake Louise or Moraine Lake in early morning, before winds create ripples, offers the classic mirror-like photograph. Extensive hiking trails climb from both lakes into higher alpine terrain with fewer crowds."}, {"name": "Niagara Falls", "wiki": "Niagara_Falls", "desc": "Best seen from the Canadian side, which offers a more direct, panoramic view of both the Horseshoe and American Falls than the U.S. side across the border. A boat tour up to the base of the falls, or a walk through tunnels behind the cascading water, offers a closer, wetter perspective. Nighttime illumination and seasonal fireworks add another dimension after dark."}, {"name": "Old Québec", "wiki": "Old_Quebec", "desc": "A walled city with a distinctly European feel unusual in North America, its cobblestone streets and Château Frontenac hotel dominating views from the St. Lawrence River below. It's the only fortified city north of Mexico with walls still standing. Winter Carnival and a lively food scene keep the old town active well beyond the summer tourist season."}, {"name": "Stanley Park & Whistler", "wiki": "Stanley_Park", "desc": "Vancouver's waterfront park offers a seawall path circling dense rainforest within the city limits, popular for walking and cycling with mountain and ocean views. Whistler, under two hours away, adds one of North America's largest ski resorts, with mountain biking and hiking taking over the slopes in summer. Together they capture much of the province's outdoor culture in a compact area."}, {"name": "Icefields Parkway", "wiki": "Icefields_Parkway", "desc": "A scenic highway connecting Banff and Jasper National Parks, widely considered one of the most spectacular drives in the world, passing glaciers, waterfalls, and turquoise lakes at nearly every turn. The Athabasca Glacier allows visitors to walk onto the ice itself via a specialized vehicle tour. Wildlife including bears, elk, and bighorn sheep are commonly spotted along the route."}, {"name": "CN Tower, Toronto", "wiki": "CN_Tower", "desc": "Once the tallest freestanding structure in the world, this tower offers a glass floor observation deck and, for the more daring, an EdgeWalk allowing visitors to walk around the tower's outer rim harnessed at over 350 meters. Views extend across Lake Ontario and, on clear days, into the United States. It remains one of Toronto's most recognizable landmarks."}], "itineraryDays": 10, "itinerary": [{"label": "Days 1–3", "title": "Vancouver & Whistler", "desc": "Stanley Park and Granville Island, then a drive up the Sea-to-Sky Highway."}, {"label": "Days 4–6", "title": "Banff & Lake Louise", "desc": "Hiking and canoeing around the Rockies' best-known lakes."}, {"label": "Days 7–8", "title": "Toronto & Niagara Falls", "desc": "City time followed by a day trip to the falls."}, {"label": "Days 9–10", "title": "Québec City", "desc": "The old walled town, closing the trip on its oldest streets."}]}, {"id": "costa-rica", "name": "Costa Rica", "flag": "🇨🇷", "capital": "San José", "population": "5.2 million", "language": "Spanish", "currency": "Costa Rican colón", "bestTime": "December–April", "blurb": "Costa Rica packs volcanoes, cloud forest, and two coastlines into a country small enough to cross by car in a day.", "attractions": [{"name": "Arenal Volcano", "wiki": "Arenal_Volcano", "desc": "A near-perfect volcanic cone that was actively erupting for decades until activity quieted around 2010, though it remains one of Costa Rica's most recognizable landmarks. Natural hot springs heated by the volcano's activity dot the surrounding area, some developed into resorts and others free and undeveloped. Hanging bridge trails through the surrounding rainforest offer canopy-level views of the volcano and forest below."}, {"name": "Monteverde Cloud Forest", "wiki": "Monteverde_Cloud_Forest_Reserve", "desc": "A misty, high-altitude reserve where clouds regularly settle into the forest canopy, supporting an extraordinary density of plant and animal species including the resplendent quetzal. Suspension bridges strung between towering trees let visitors walk at canopy level rather than only from the forest floor. Zip lines through the reserve offer a faster, more adrenaline-driven way to experience the same terrain."}, {"name": "Manuel Antonio National Park", "wiki": "Manuel_Antonio_National_Park", "desc": "One of Costa Rica's smallest national parks but among its most biodiverse, combining pristine beaches with rainforest trails where sloths, monkeys, and iguanas are routinely spotted close to the paths. A visitor limit helps keep crowds manageable despite its popularity. Its combination of easy beach access and reliable wildlife sightings makes it a favorite even for visitors on a short trip."}, {"name": "Tortuguero", "wiki": "Tortuguero_National_Park", "desc": "A remote national park on the Caribbean coast, reachable only by boat or small plane through a network of jungle canals sometimes called Costa Rica's 'Amazon'. It's one of the most important nesting sites in the Western Hemisphere for green sea turtles, with guided night walks during nesting season a major draw. Wildlife-spotting by boat along the canals rivals the park's turtle nesting as a highlight."}, {"name": "Corcovado National Park", "wiki": "Corcovado_National_Park", "desc": "Described by National Geographic as one of the most biologically intense places on Earth, this remote park on the Osa Peninsula protects one of the last significant stretches of Pacific rainforest in Central America. Tapirs, scarlet macaws, and all four of Costa Rica's monkey species can be found here, along with a healthy population of big cats rarely seen elsewhere. Access requires a licensed guide and considerable logistical planning given its remoteness."}, {"name": "Poás Volcano", "wiki": "Poás_Volcano", "desc": "An active volcano with one of the largest crater lakes in the world, its turquoise, highly acidic water occasionally producing geyser-like eruptions. A short, paved path from the visitor center leads to a viewing platform overlooking the crater, making it one of the more accessible volcanoes in the country. Visits are sometimes restricted due to volcanic gas activity, so checking conditions ahead helps."}], "itineraryDays": 8, "itinerary": [{"label": "Days 1–2", "title": "Arenal", "desc": "Hot springs and a hike around the volcano's base."}, {"label": "Days 3–4", "title": "Monteverde", "desc": "Cloud forest walks and canopy zip lines."}, {"label": "Days 5–6", "title": "Manuel Antonio", "desc": "Beach time combined with wildlife-spotting on the park trails."}, {"label": "Days 7–8", "title": "Tortuguero", "desc": "A boat-in stay to close the trip in the canals, with turtle nesting in season."}]}, {"id": "mexico", "name": "Mexico", "flag": "🇲🇽", "capital": "Mexico City", "population": "128 million", "language": "Spanish", "currency": "Mexican peso", "bestTime": "November–April", "blurb": "Mexico City's museums and food scene pair naturally with a second stop in the Yucatán, where ruins sit a short drive from cenotes and beaches.", "attractions": [{"name": "Chichén Itzá", "wiki": "Chichen_Itza", "desc": "The best-known Maya ruin, its stepped pyramid, El Castillo, aligned so that during the spring and autumn equinoxes, shadows create the illusion of a serpent descending its staircase. The site also includes the largest ball court in ancient Mesoamerica and an observatory used for tracking celestial events. It's one of the New Seven Wonders of the World and among the most visited archaeological sites in the Americas."}, {"name": "Tulum", "wiki": "Tulum,_Quintana_Roo", "desc": "Clifftop Maya ruins overlooking the Caribbean, unusual among major sites for their direct coastal setting, once serving as a fortified trading port. The beach below the ruins remains one of the most photographed in Mexico. Numerous cenotes, natural limestone sinkholes filled with clear freshwater, dot the surrounding jungle for swimming and diving."}, {"name": "Historic center, Mexico City", "wiki": "Historic_center_of_Mexico_City", "desc": "The Zócalo, one of the largest public squares in the world, is flanked by the Metropolitan Cathedral and the National Palace, home to Diego Rivera's sweeping murals depicting Mexican history. Frida Kahlo's Casa Azul in nearby Coyoacán preserves her home much as she left it. The historic center sits atop the ruins of the Aztec capital Tenochtitlan, parts of which remain excavated and visible."}, {"name": "Oaxaca", "wiki": "Oaxaca_City", "desc": "Markets, mezcal producers, and some of the country's strongest regional cooking define this southern city, considered by many to be Mexico's culinary capital. Its well-preserved colonial architecture earned it UNESCO World Heritage status alongside the nearby archaeological site of Monte Albán. The region's Day of the Dead celebrations are among the most elaborate and widely photographed in the country."}, {"name": "Copper Canyon", "wiki": "Copper_Canyon", "desc": "A network of canyons in northern Mexico larger and, in places, deeper than the Grand Canyon, home to the indigenous Rarámuri people known for their long-distance running traditions. The Chepe railway crosses the region via dramatic bridges and tunnels, offering views inaccessible by road. It remains one of Mexico's least-visited major natural attractions despite its scale."}, {"name": "Guanajuato", "wiki": "Guanajuato_City", "desc": "A colorful colonial mining city built into a steep ravine, its brightly painted houses stacked along narrow alleyways too tight for cars, including the famously narrow Callejón del Beso. Underground tunnels, originally built for flood control, now carry much of the city's traffic beneath the surface streets. Its historic center and nearby mines together form a UNESCO World Heritage Site."}], "itineraryDays": 9, "itinerary": [{"label": "Days 1–3", "title": "Mexico City & Teotihuacan", "desc": "The historic center, Coyoacán, and a day trip to the pyramids."}, {"label": "Days 4–5", "title": "Oaxaca", "desc": "Markets, mezcal tastings, and nearby archaeological sites."}, {"label": "Days 6–9", "title": "Yucatán", "desc": "Tulum, Chichén Itzá, and cenote swimming based out of Tulum or Valladolid."}]}, {"id": "panama", "name": "Panama", "flag": "🇵🇦", "capital": "Panama City", "population": "4.4 million", "language": "Spanish", "currency": "US dollar, Panamanian balboa", "bestTime": "December–April", "blurb": "Panama's canal remains its defining feature, but the country also offers colonial old towns, cloud forest, and two very different coastlines within a compact area.", "attractions": [{"name": "Panama Canal", "wiki": "Panama_Canal", "desc": "One of the most significant engineering achievements of the 20th century, this canal cuts across the isthmus to connect the Atlantic and Pacific Oceans, saving ships weeks of travel around South America. The Miraflores Locks visitor center allows visitors to watch massive container ships rise and fall through the lock system up close. Its ongoing expansion has kept it central to global shipping well into the present day."}, {"name": "Casco Viejo, Panama City", "wiki": "Casco_Viejo,_Panama", "desc": "Panama City's restored colonial old quarter, its Spanish and French colonial buildings now housing boutique hotels, rooftop bars, and restaurants alongside older churches and plazas. The contrast with the modern skyscraper skyline visible just across the bay is one of the city's most striking views. It's a UNESCO World Heritage Site and the natural base for exploring the capital."}, {"name": "San Blas Islands", "wiki": "Guna_Yala", "desc": "An archipelago of over 350 small islands in the Guna Yala comarca, governed autonomously by the indigenous Guna people who maintain strict control over tourism development. Many islands are little more than a strip of white sand and a few palm trees, offering an unspoiled contrast to more developed Caribbean destinations. Visits typically require staying in simple, community-run accommodations rather than resorts."}, {"name": "Boquete", "wiki": "Boquete", "desc": "A cool mountain town in Panama's highlands, known for coffee farms producing some of the world's most expensive beans, geisha varietals grown at high altitude. Hiking trails here include the Quetzal Trail, named for the elusive, brightly colored bird sometimes spotted in the cloud forest. Its cooler climate offers a welcome break from the tropical heat of the coasts."}, {"name": "Bocas del Toro", "wiki": "Bocas_del_Toro_Province", "desc": "A Caribbean archipelago known for surf breaks, mangrove channels, and a laid-back, slightly bohemian island culture distinct from the rest of the country. Water taxis connect the main town to quieter islands with beaches and snorkeling spots. It's a common stop for travelers continuing overland toward Costa Rica."}, {"name": "Embera indigenous villages", "wiki": "Emberá_people", "desc": "River communities in Panama's rainforest interior that welcome visitors for cultural visits involving traditional dance, craft demonstrations, and a dugout canoe journey to reach the village itself. It offers a direct, community-led way to learn about one of Panama's indigenous groups. Visits are usually arranged as a guided day trip from Panama City."}], "itineraryDays": 9, "itinerary": [{"label": "Days 1–3", "title": "Panama City", "desc": "The Panama Canal locks, Casco Viejo's old town, and an Embera village visit."}, {"label": "Days 4–5", "title": "Boquete", "desc": "Coffee farm tours and hiking in the cool highland cloud forest."}, {"label": "Days 6–9", "title": "Bocas del Toro or San Blas", "desc": "Either Caribbean island time in Bocas or a more remote trip to the San Blas Islands."}]}, {"id": "usa", "name": "United States", "flag": "🇺🇸", "capital": "Washington, D.C.", "population": "335 million", "language": "English", "currency": "US dollar", "bestTime": "April–June, September–October", "blurb": "The Southwest's national parks make one of the country's most rewarding road trips, with red rock, canyons, and small desert towns along the way.", "attractions": [{"name": "Grand Canyon", "wiki": "Grand_Canyon", "desc": "Carved by the Colorado River over roughly six million years, this canyon stretches 277 miles long and up to a mile deep, its layered rock walls exposing nearly two billion years of geological history. The South Rim offers the most developed visitor infrastructure and is accessible year-round, while the North Rim stays higher, cooler, and far less crowded. Sunrise and sunset both dramatically shift the canyon's colors."}, {"name": "Zion & Bryce Canyon", "wiki": "Zion_National_Park", "desc": "Zion's narrow slot canyons, including the famous Narrows hike through the Virgin River itself, contrast sharply with Bryce Canyon's amphitheater of thousands of orange hoodoo spires. Angels Landing, a strenuous chained climb to a narrow ridge, offers one of the park's most rewarding but exposed viewpoints. Both parks sit within a few hours' drive of each other in southern Utah."}, {"name": "Sedona", "wiki": "Sedona,_Arizona", "desc": "Red rock formations rise dramatically around this small Arizona town, with hiking trails leading to famous viewpoints like Cathedral Rock and Bell Rock. The area has also developed a reputation for supposed energy vortexes, drawing a mix of hikers and spiritual seekers alike. Jeep tours offer an easier way to access some of the more rugged backcountry areas."}, {"name": "Las Vegas Strip", "wiki": "Las_Vegas_Strip", "desc": "A stretch of casino resorts, elaborate themed architecture, and round-the-clock entertainment that has become the classic starting or ending point for a Southwest road trip. Beyond the casinos, several resorts host world-class shows, from magic to acrobatics to residencies by major musical artists. It's also the closest major airport hub for reaching the region's national parks."}, {"name": "Antelope Canyon", "wiki": "Antelope_Canyon", "desc": "A narrow slot canyon on Navajo land near Page, Arizona, its smoothly sculpted sandstone walls and shafts of light creating some of the most photographed natural formations in the American Southwest. Access requires a guided tour led by Navajo guides, both for safety and to support the local community. The Upper and Lower sections offer distinctly different experiences of light and passage width."}, {"name": "Monument Valley", "wiki": "Monument_Valley", "desc": "Towering sandstone buttes rise from the flat desert floor on Navajo Nation land straddling the Arizona-Utah border, a landscape made iconic by decades of Western films. A scenic loop drive, doable independently or with a Navajo-guided tour, passes the valley's most recognizable formations. Sunrise and sunset light dramatically deepen the red tones of the rock."}], "itineraryDays": 8, "itinerary": [{"label": "Days 1–2", "title": "Las Vegas", "desc": "Arrive and adjust, with an optional day trip to Hoover Dam."}, {"label": "Days 3–4", "title": "Grand Canyon", "desc": "Drive to the South Rim for sunset and sunrise viewpoints."}, {"label": "Days 5–6", "title": "Zion & Bryce Canyon", "desc": "Hike Angels Landing or the Narrows, then continue to Bryce's amphitheater."}, {"label": "Days 7–8", "title": "Sedona & Phoenix", "desc": "Red rock hikes before flying out of Phoenix."}]}]}, {"id": "south-america", "name": "South America", "tagline": "Andes peaks, rainforest, and cities built on both", "color": "#5B6B47", "countries": [{"id": "argentina", "name": "Argentina", "flag": "🇦🇷", "capital": "Buenos Aires", "population": "46 million", "language": "Spanish", "currency": "Argentine peso", "bestTime": "September–November, March–May", "blurb": "Argentina's length means most trips choose a slice: Buenos Aires and Mendoza's wine country pair well with a flight south to Patagonia.", "attractions": [{"name": "La Boca & tango, Buenos Aires", "wiki": "La_Boca", "desc": "The colorful port neighborhood's corrugated metal houses, painted in bright leftover ship paint by immigrant dock workers, now house tango dancers performing for tips along the pedestrian Caminito street. San Telmo's more traditional tango halls and Sunday antique market offer a less touristy counterpoint nearby. An evening tango show, whether staged or in a more informal milonga, remains an essential Buenos Aires experience."}, {"name": "Perito Moreno Glacier", "wiki": "Perito_Moreno_Glacier", "desc": "A glacier near El Calafate that's one of the few in the world still advancing rather than retreating, its face regularly calving massive chunks of ice into the lake below with a thunderous crack. Extensive viewing walkways allow visitors to watch from a safe distance without a boat tour, unusual for a glacier of this scale. Ice trekking directly on the glacier's surface is also available for a more immersive experience."}, {"name": "Iguazu Falls, Argentine side", "wiki": "Iguazu_Falls", "desc": "Closer walkways than the Brazilian side allow visitors to approach individual cascades directly, including a path leading right to the edge of the thunderous Devil's Throat. A small train connects the different walking circuits within the Argentine national park. The surrounding subtropical rainforest adds coatis, toucans, and butterflies to the waterfall spectacle."}, {"name": "Mendoza wine country", "wiki": "Mendoza,_Argentina", "desc": "Malbec vineyards spread across the high desert at the foot of the Andes, their altitude and dry climate producing some of Argentina's most acclaimed wines. Many wineries offer tastings paired with views of Aconcagua, the tallest peak in the Americas, on clear days. Bike tours between wineries are a popular and relaxed way to sample several in a single day."}, {"name": "Ushuaia & Tierra del Fuego", "wiki": "Ushuaia", "desc": "The southernmost city in the world, often called the 'End of the World', serves as the main departure point for Antarctic cruises as well as hikes through Tierra del Fuego National Park's subantarctic forest. A historic narrow-gauge railway, once used to transport prisoners and timber, now carries tourists through the park. Its remote, dramatic setting at the tip of South America draws travelers well beyond those continuing to Antarctica."}, {"name": "Recoleta Cemetery, Buenos Aires", "wiki": "La_Recoleta_Cemetery", "desc": "An elaborate cemetery of ornate mausoleums built like miniature buildings, home to the tomb of Eva Perón among numerous other notable Argentine figures. Its labyrinth of narrow lanes between family crypts, some centuries old, gives it a monumental, almost city-like atmosphere. Guided tours help make sense of the cemetery's dense history and notable residents."}], "itineraryDays": 10, "itinerary": [{"label": "Days 1–3", "title": "Buenos Aires", "desc": "La Boca, Recoleta, and an evening tango show."}, {"label": "Days 4–5", "title": "Mendoza", "desc": "Vineyard tours in the shadow of the Andes."}, {"label": "Days 6–8", "title": "Patagonia", "desc": "El Calafate and the Perito Moreno Glacier's viewing platforms."}, {"label": "Days 9–10", "title": "Iguazu Falls", "desc": "Close the trip with the falls' Argentine-side walkways."}]}, {"id": "bolivia", "name": "Bolivia", "flag": "🇧🇴", "capital": "Sucre", "population": "12.4 million", "language": "Spanish, Quechua, Aymara", "currency": "Bolivian boliviano", "bestTime": "May–October (dry season)", "blurb": "Bolivia's altitude defines much of the trip, from La Paz's position as the world's highest administrative capital to the otherworldly salt flats that dominate the country's southwest.", "attractions": [{"name": "Salar de Uyuni", "wiki": "Salar_de_Uyuni", "desc": "The world's largest salt flat, its blindingly white surface stretching over 10,000 square kilometers, so flat and reflective after rain that it creates a mirror effect blurring the line between sky and ground. Multi-day 4x4 tours cross the flats to visit cactus-covered islands, colored lagoons, and geysers in the surrounding altiplano. Photographs using forced perspective on the flat, featureless surface have become a signature activity here."}, {"name": "La Paz & the cable car network", "wiki": "Mi_Teleférico", "desc": "The world's highest capital sits in a dramatic bowl-shaped valley, its extensive urban cable car system, built specifically to navigate the steep terrain, offering some of the best city views available anywhere. The Witches' Market nearby sells traditional Andean remedies and ritual items, including dried llama fetuses used in offerings. The altitude, over 3,600 meters, makes a gradual first day essential for most visitors."}, {"name": "Lake Titicaca", "wiki": "Lake_Titicaca", "desc": "The highest navigable lake in the world, shared between Bolivia and Peru, its deep blue water held sacred in Inca mythology as the birthplace of the sun. Isla del Sol, on the Bolivian side, offers Inca ruins and terraced hillsides reachable only by boat. Traditional reed boats and floating communities add further cultural interest along the shore."}, {"name": "Death Road (Yungas Road)", "wiki": "Yungas_Road", "desc": "Once notorious as one of the most dangerous roads in the world, this narrow mountain route has since been bypassed by a safer modern highway, leaving the old road largely to cyclists. A downhill mountain bike descent drops from over 4,600 meters to tropical lowlands, passing sheer cliff edges along the way. Guided tours are strongly recommended given the route's history and terrain."}, {"name": "Tiwanaku", "wiki": "Tiwanaku", "desc": "The ruins of a pre-Inca civilization that once dominated the region around Lake Titicaca, its Gate of the Sun carved from a single block of stone and covered in detailed symbolic reliefs. Much of the site's original scale remains only partially excavated, with ongoing archaeological work continuing to reveal more. It's an easy day trip from La Paz."}, {"name": "Sucre's colonial architecture", "wiki": "Sucre", "desc": "Bolivia's constitutional capital, known for its well-preserved whitewashed colonial buildings that have earned it UNESCO World Heritage status. It's a noticeably calmer, more relaxed city than La Paz, with a milder climate at lower altitude. The nearby Cal Orck'o site preserves an extensive collection of dinosaur footprints on a vertical rock face."}], "itineraryDays": 10, "itinerary": [{"label": "Days 1–2", "title": "La Paz", "desc": "The cable car network, Witches' Market, and acclimatizing to the altitude."}, {"label": "Day 3", "title": "Death Road", "desc": "A guided downhill mountain bike descent from the altiplano to the lowlands."}, {"label": "Days 4–5", "title": "Lake Titicaca", "desc": "A boat trip to Isla del Sol and its Inca-era terraces and ruins."}, {"label": "Days 6–8", "title": "Salar de Uyuni", "desc": "A multi-day 4x4 tour across the salt flats and surrounding colored lagoons."}, {"label": "Days 9–10", "title": "Sucre", "desc": "The colonial old town and the dinosaur footprints at Cal Orck'o before departure."}]}, {"id": "brazil", "name": "Brazil", "flag": "🇧🇷", "capital": "Brasília", "population": "216 million", "language": "Portuguese", "currency": "Brazilian real", "bestTime": "September–November, March–May", "blurb": "Rio's beaches and mountains sit at one end of Brazil; Iguazu's waterfalls and the Amazon show how different the rest of the country can feel.", "attractions": [{"name": "Christ the Redeemer & Sugarloaf", "wiki": "Christ_the_Redeemer_(statue)", "desc": "Rio's two signature viewpoints offer different perspectives on the same sprawling city: Christ the Redeemer's outstretched arms atop Corcovado Mountain, and Sugarloaf's cable car ascent over the harbor. Both are best done on separate, clear days given how weather-dependent the views are. The statue, completed in 1931, remains one of the most recognized monuments in the world."}, {"name": "Iguazu Falls", "wiki": "Iguazu_Falls", "desc": "A wider, arguably more dramatic set of falls than Niagara, spanning nearly three kilometers along the Brazil–Argentina border with roughly 275 individual cascades. The Brazilian side offers panoramic views of the full falls system, while the Argentine side allows closer approaches to individual cascades. A boat tour to the base of the Devil's Throat, the falls' most powerful section, offers a soaking, adrenaline-filled perspective."}, {"name": "Amazon lodges near Manaus", "wiki": "Manaus", "desc": "River cruises and jungle walks from lodges reachable only by boat give access to the world's largest rainforest, with night canoe trips revealing caimans and other nocturnal wildlife. The 'meeting of waters', where the dark Rio Negro and sandy-colored Amazon River flow side by side without mixing for several kilometers, is a striking natural phenomenon near the city. Manaus itself, once wealthy from the rubber boom, retains grand period architecture including an ornate opera house."}, {"name": "Pelourinho, Salvador", "wiki": "Pelourinho", "desc": "Colonial architecture and Afro-Brazilian culture define Brazil's former capital, its cobbled squares once the site of a slave market and now a UNESCO World Heritage Site celebrating Afro-Brazilian heritage. Capoeira demonstrations and live percussion are common sights in its plazas. Salvador's cuisine, particularly dishes rooted in West African tradition, reflects the city's deep cultural connections across the Atlantic."}, {"name": "Copacabana & Ipanema beaches", "wiki": "Copacabana,_Rio_de_Janeiro", "desc": "Rio's two most famous beaches stretch along a dense urban coastline, their promenades a hub for football, volleyball, and people-watching throughout the day. The iconic wave-patterned sidewalk mosaic along Copacabana was designed by landscape architect Roberto Burle Marx. Sunset at Ipanema's Arpoador rock is a popular local tradition, often met with spontaneous applause from the crowd."}, {"name": "Pantanal wetlands", "wiki": "Pantanal", "desc": "The world's largest tropical wetland, offering wildlife viewing that many consider even more reliable than the denser Amazon rainforest, since animals are easier to spot in the open terrain. Jaguar sightings, rare and difficult elsewhere, are relatively common here during the dry season. Boat and jeep safaris reveal capybaras, caimans, and an enormous diversity of birdlife across the flooded plains."}], "itineraryDays": 10, "itinerary": [{"label": "Days 1–4", "title": "Rio de Janeiro", "desc": "Christ the Redeemer, Sugarloaf, and beach time at Ipanema and Copacabana."}, {"label": "Days 5–6", "title": "Iguazu Falls", "desc": "Walkways on the Brazilian side and a boat ride to the base of the falls."}, {"label": "Days 7–10", "title": "Amazon or Salvador", "desc": "Either a lodge stay near Manaus or an extension to Salvador's old town."}]}, {"id": "chile", "name": "Chile", "flag": "🇨🇱", "capital": "Santiago", "population": "19.6 million", "language": "Spanish", "currency": "Chilean peso", "bestTime": "October–April, varies by region", "blurb": "Chile's length covers desert, glacier, and Pacific island in one country, though its size means a trip usually flies between regions.", "attractions": [{"name": "Valle de la Luna, Atacama", "wiki": "Valle_de_la_Luna_(Chile)", "desc": "Salt-crusted desert formations named for their resemblance to the moon's surface, their eroded ridges and dunes glowing pink and orange at sunset in the driest non-polar desert on Earth. NASA has used the valley's terrain to test equipment intended for actual lunar and Martian missions. Stargazing here ranks among the best in the world thanks to minimal light pollution and consistently clear skies."}, {"name": "Torres del Paine", "wiki": "Torres_del_Paine_National_Park", "desc": "Granite towers and turquoise glacial lakes form Patagonia's best-known trekking circuit, with the multi-day W Trek and full O Circuit both drawing hikers from around the world. Guanacos, a wild relative of the llama, and occasionally pumas can be spotted across the park's open steppe. Weather here changes rapidly and dramatically, so layered clothing and flexibility are essential."}, {"name": "Valparaíso", "wiki": "Valparaíso", "desc": "A hillside port city known for its dense street art scene and a network of century-old funicular railways, called ascensores, that climb between the steep hillside neighborhoods. Its labyrinthine, brightly painted streets earned it UNESCO World Heritage status despite, or perhaps because of, its slightly worn, bohemian character. It sits just over an hour from Santiago, making it an easy day trip or overnight stay."}, {"name": "Easter Island", "wiki": "Easter_Island", "desc": "Isolated more than 3,500 kilometers from mainland Chile in the Pacific, this island is home to nearly 900 moai statues carved by the Rapa Nui people between roughly 1250 and 1500 AD. The statues' original purpose, honoring ancestors, and the logistics of their transport across the island remain subjects of ongoing archaeological study. Its remoteness requires a dedicated flight, but the payoff is one of the most singular cultural landscapes on Earth."}, {"name": "Santiago's Cerro San Cristóbal", "wiki": "San_Cristóbal_Hill", "desc": "A hill rising above Santiago, reachable by funicular, cable car, or a hiking trail, topped by a large statue of the Virgin Mary overlooking the city. On clear days, views extend to the snow-capped Andes forming a dramatic backdrop to the capital. The surrounding park includes a zoo and botanical gardens for those wanting a longer visit."}, {"name": "Chiloé Island", "wiki": "Chiloé_Island", "desc": "An archipelago known for distinctive stilted wooden houses called palafitos and a collection of UNESCO-listed wooden churches built without a single nail, reflecting a unique blend of indigenous and Jesuit missionary influence. Local mythology here, rich with sea creatures and witches, remains a genuine part of island culture. Its foggy, slower pace offers a marked contrast to mainland Chile."}], "itineraryDays": 11, "itinerary": [{"label": "Days 1–2", "title": "Santiago & Valparaíso", "desc": "The capital's museums and a day trip to the coastal port city."}, {"label": "Days 3–5", "title": "Atacama Desert", "desc": "Valle de la Luna, geysers, and salt flats around San Pedro de Atacama."}, {"label": "Days 6–9", "title": "Torres del Paine", "desc": "Trekking in Patagonia's granite towers, based out of Puerto Natales."}, {"label": "Days 10–11", "title": "Easter Island", "desc": "A flight out to see the moai before closing the trip."}]}, {"id": "colombia", "name": "Colombia", "flag": "🇨🇴", "capital": "Bogotá", "population": "52 million", "language": "Spanish", "currency": "Colombian peso", "bestTime": "December–March, July–August", "blurb": "Colombia's dramatic turnaround from its difficult past shows up clearly in Cartagena's colorful old town, Medellín's transformation, and a coffee region that pairs mountain scenery with genuinely great coffee.", "attractions": [{"name": "Cartagena's Old Town", "wiki": "Cartagena,_Colombia", "desc": "A walled colonial city on the Caribbean coast, its brightly colored balconied houses, plazas, and horse-drawn carriages giving it a distinctly romantic, well-preserved character. Massive stone fortifications, built to defend against pirate attacks, still ring much of the old city. Evenings here are especially lively, with street music and restaurants filling the plazas."}, {"name": "Coffee Triangle (Eje Cafetero)", "wiki": "Colombian_coffee_growing_axis", "desc": "A mountainous region of small farms producing much of Colombia's famous coffee, its steep hillsides covered in neat rows of coffee plants beneath a canopy of banana and plantain trees. Farm tours here typically include a full walk-through of the process, from picking to roasting to tasting. The nearby Cocora Valley adds towering wax palms, Colombia's national tree, to the scenery."}, {"name": "Ciudad Perdida (Lost City)", "wiki": "Ciudad_Perdida", "desc": "An ancient terraced city built by the Tairona civilization, predating Machu Picchu by several centuries, reachable only by a multi-day trek through dense Sierra Nevada jungle. Unlike more accessible ruins, reaching it requires genuine physical effort, river crossings, and several nights of camping along the trail. The relative difficulty of access has helped keep the site far less crowded than comparable ruins elsewhere in South America."}, {"name": "Medellín & Comuna 13", "wiki": "Comuna_13", "desc": "Once one of the most dangerous neighborhoods in the world during Medellín's violent past, Comuna 13 has been transformed through outdoor escalators, colorful street art, and community-led tourism into a symbol of the city's broader recovery. Guided tours, often led by local residents, explain both the difficult history and the changes since. The city's famously mild, spring-like climate has also earned it the nickname 'City of Eternal Spring'."}, {"name": "Salt Cathedral of Zipaquirá", "wiki": "Zipaquirá_Salt_Cathedral", "desc": "An underground Catholic church built within the tunnels of a still-active salt mine, its naves, crosses, and stations of the cross all carved directly from the salt rock itself. It sits about an hour outside Bogotá and remains an active place of worship as well as a major attraction. The combination of religious space and industrial mine gives it a genuinely unusual atmosphere."}, {"name": "Tayrona National Park", "wiki": "Tayrona_National_Natural_Park", "desc": "A coastal park where the Sierra Nevada mountains meet the Caribbean Sea, its beaches framed by dense jungle and large granite boulders. Hiking trails connect several beaches, some suitable for swimming and others too rough with currents to enter the water safely. Simple hammock and cabin accommodations within the park allow for an overnight stay."}], "itineraryDays": 11, "itinerary": [{"label": "Days 1–3", "title": "Bogotá", "desc": "The historic La Candelaria district and a day trip to the Salt Cathedral of Zipaquirá."}, {"label": "Days 4–5", "title": "Coffee Triangle", "desc": "Farm tours and the Cocora Valley's towering wax palms."}, {"label": "Days 6–7", "title": "Medellín", "desc": "Comuna 13's transformation and the city's mild, spring-like climate."}, {"label": "Days 8–11", "title": "Cartagena & Tayrona", "desc": "The walled old city and beach time in Tayrona National Park."}]}, {"id": "ecuador", "name": "Ecuador", "flag": "🇪🇨", "capital": "Quito", "population": "18 million", "language": "Spanish", "currency": "US dollar", "bestTime": "June–September, December–January", "blurb": "Ecuador packs an unusual amount of variety into a small country: a colonial capital high in the Andes, cloud forest, and the wildlife-dense Galápagos Islands all within a short flight of each other.", "attractions": [{"name": "Galápagos Islands", "wiki": "Galápagos_Islands", "desc": "An isolated volcanic archipelago that helped shape Charles Darwin's theory of evolution, its wildlife, giant tortoises, marine iguanas, and blue-footed boobies among them, famously unafraid of humans due to a lack of natural predators. Strict conservation rules limit visitor numbers and require licensed guides on most islands. A cruise or island-hopping itinerary is the standard way to see multiple islands' distinct ecosystems."}, {"name": "Quito's Old Town", "wiki": "Historic_Centre_of_Quito", "desc": "One of the largest and best-preserved historic centers in Latin America, its colonial churches and plazas earning it recognition as one of UNESCO's first World Heritage Sites. The interior of the Compañía de Jesús church, covered almost entirely in gold leaf, is a particular highlight. Quito's high altitude, over 2,800 meters, gives it a notably cool climate despite sitting almost exactly on the equator."}, {"name": "Mitad del Mundo (Middle of the World)", "wiki": "Ciudad_Mitad_del_Mundo", "desc": "A monument marking the equator just outside Quito, where visitors can stand with one foot in each hemisphere, though GPS measurements have since shown the true equatorial line sits slightly north of the original marker. A nearby museum, built at the more accurately measured location, offers science demonstrations related to the equator's effects. It remains a popular, if slightly kitschy, half-day trip from the capital."}, {"name": "Cotopaxi National Park", "wiki": "Cotopaxi_National_Park", "desc": "Home to one of the world's highest active volcanoes, its near-symmetrical snow-capped cone visible from Quito on clear days. A refuge partway up the mountain is reachable by a moderate hike, offering close views of the glacier above, while a full summit attempt requires technical climbing gear and a guide. The surrounding páramo grassland is also home to wild horses and Andean condors."}, {"name": "Baños de Agua Santa", "wiki": "Baños,_Ecuador", "desc": "A small town at the edge of the Amazon basin, its name referring to thermal baths fed by volcanic hot springs beneath the nearby Tungurahua volcano. It's built into something of an adventure sports hub, with waterfall routes, canyoning, and a well-known swing hung from a viewing platform overlooking a deep valley. The Pailón del Diablo waterfall nearby is among the most powerful in the country."}, {"name": "Amazon rainforest (Cuyabeno or Yasuní)", "wiki": "Yasuní_National_Park", "desc": "Ecuador's Amazon region, reached from either Quito or Coca, offers some of the most accessible rainforest lodges in South America, often just a short flight and boat ride from the capital. Guided walks and night canoe trips reveal caimans, monkeys, and an extraordinary diversity of bird life. Indigenous-led tours in some areas add cultural context alongside the wildlife viewing."}], "itineraryDays": 11, "itinerary": [{"label": "Days 1–2", "title": "Quito", "desc": "The old town's colonial churches and a stop at the equator monument."}, {"label": "Day 3", "title": "Cotopaxi", "desc": "A hike to the mountain refuge for glacier views on Ecuador's iconic volcano."}, {"label": "Days 4–5", "title": "Baños", "desc": "Waterfalls and adventure activities at the edge of the Amazon basin."}, {"label": "Days 6–11", "title": "Galápagos Islands", "desc": "A multi-day island-hopping cruise among some of the world's most fearless wildlife."}]}, {"id": "peru", "name": "Peru", "flag": "🇵🇪", "capital": "Lima", "population": "34 million", "language": "Spanish, Quechua", "currency": "Peruvian sol", "bestTime": "May–September", "blurb": "Peru's Sacred Valley builds toward Machu Picchu gradually, with enough Inca sites along the way to make the payoff feel earned.", "attractions": [{"name": "Machu Picchu", "wiki": "Machu_Picchu", "desc": "The Inca citadel above the Urubamba River, built in the 15th century and abandoned during the Spanish conquest before remaining largely unknown to the outside world until 1911. Its precise stonework, fitted without mortar, has survived centuries of earthquakes in a region prone to them. Reached either by train and a short climb, or by the multi-day Inca Trail trek through the surrounding mountains."}, {"name": "Sacred Valley", "wiki": "Sacred_Valley", "desc": "Inca agricultural terraces and markets at Pisac and Ollantaytambo line this fertile valley, which served as an important agricultural and religious region for the Inca Empire. Ollantaytambo's fortress remains one of the few sites where the Inca successfully repelled a Spanish attack. It's also a practical stop for acclimatizing to altitude before continuing toward Machu Picchu."}, {"name": "Miraflores, Lima", "wiki": "Miraflores_District,_Lima", "desc": "Clifftop parks along the Pacific coast anchor this upscale Lima neighborhood, home to some of the city's best ceviche restaurants and a lively paragliding scene above the cliffs. The nearby Larco Museum houses an extensive collection of pre-Columbian art and pottery. It offers a comfortable, walkable base for exploring the capital."}, {"name": "Rainbow Mountain", "wiki": "Vinicunca", "desc": "A striped mineral mountain whose vivid bands of red, gold, and turquoise result from different mineral deposits exposed over time, only becoming widely known to travelers within the past decade as snow cover receded. Reaching it requires a demanding high-altitude day hike from Cusco, with altitude sickness a genuine consideration. The relatively recent 'discovery' of the mountain has made it one of Peru's fastest-growing attractions."}, {"name": "Nazca Lines", "wiki": "Nazca_Lines", "desc": "Massive geoglyphs etched into the desert floor of southern Peru, depicting animals, plants, and geometric shapes only fully visible from the air. Created by the Nazca culture between roughly 500 BC and 500 AD, their exact purpose remains debated among archaeologists. Small aircraft flights over the desert are the standard way to see the full designs."}, {"name": "Lake Titicaca, Puno", "wiki": "Lake_Titicaca", "desc": "The highest navigable lake in the world, its Peruvian side centered on the city of Puno, gateway to the Uros floating islands built entirely from reeds by their inhabitants. Traditional reed boats and ce
