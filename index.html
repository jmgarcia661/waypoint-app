function StatBlock({ icon: Icon, label, value, accent }) {

    <div style={{ display: "flex", gap: "0.65rem", alignItems: "flex-start" }}>

      <div>

        <div style={{ fontSize: "0.78rem", color: "#8a8272", marginTop: "1px" }}>{label}</div>
      </div>
    </div>
  );
}
