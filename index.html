<script type="text/babel" data-presets="react">
const CONTINENTS = [{"id": "africa", "name": "Africa", "tagline": "Desert light, savanna dust, ocean coast", "color": "#B0552E", "countries": [{"id": "botswana", "name": "Botswana", "flag": "🇧🇼", "capital": "Gaborone", "population": "2.7 million", "language": "English, Setswana", "currency": "Botswana pula", "bestTime": "May–September", "blurb": "Botswana built its tourism around low-impact, high-value safaris, with the Okavango Delta's flooded channels offering a completely different kind of wildlife viewing than the dry savanna elsewhere.", "attractions": [{"name": "Okavango Delta", "wiki": "Okavango_Delta", "desc": "An inland river delta that floods seasonally, creating a maze of channels, lagoons, and islands rich with wildlife. Game viewing here often happens by mokoro, a traditional dugout canoe, moving silently past elephants, hippos, and abundant birdlife. It's one of the few places where safari and wetland exploration combine directly."}, {"name": "Chobe National Park", "wiki": "Chobe_National_Park", "desc": "Home to one of Africa's largest elephant populations, with herds gathering along the Chobe River especially in the dry season. River cruises offer close, calm wildlife viewing as animals come down to drink, often alongside game drives on land. It's frequently combined with a stop at nearby Victoria Falls."}, {"name": "Moremi Game Reserve", "wiki": "Moremi_Game_Reserve", "desc": "Sitting within the Okavango Delta, this reserve mixes floodplain and dry woodland, giving it a strong reputation for predator sightings alongside classic delta scenery. Wild dog sightings are a particular draw for repeat safari-goers. Access is mostly via light aircraft to remote bush camps."}, {"name": "Makgadikgadi Pans", "wiki": "Makgadikgadi_Pan", "desc": "One of the largest salt pan systems in the world, so flat and empty it can feel like standing on another planet. In the dry season, quad bike trips cross the cracked white surface; in the wet season, the pans briefly host large numbers of migrating zebra and flamingos. Meerkat encounters are a well-known highlight nearby."}, {"name": "Central Kalahari Game Reserve", "wiki": "Central_Kalahari_Game_Reserve", "desc": "A vast, remote reserve of open grassland and scrub, home to San communities and wildlife adapted to genuinely arid conditions, including black-maned Kalahari lions. It sees far fewer visitors than the Delta, making it a draw for travelers seeking true wilderness. Distances between camps are considerable, so most visits involve fly-in transfers."}, {"name": "Victoria Falls border crossing", "wiki": "Victoria_Falls", "desc": "While the falls themselves sit on the Zambia-Zimbabwe border, Botswana's Chobe region is close enough that many itineraries combine both in a single trip. The thundering curtain of water on the Zambezi River is one of the most powerful waterfalls on Earth, viewable from either country's side."}], "itineraryDays": 8, "itinerary": [{"label": "Days 1–3", "title": "Okavango Delta", "desc": "Fly into a bush camp for mokoro trips and game walks through the floodplain."}, {"label": "Days 4–5", "title": "Moremi Game Reserve", "desc": "Game drives through mixed floodplain and woodland known for predator sightings."}, {"label": "Days 6–7", "title": "Chobe National Park", "desc": "River cruises and game drives among some of Africa's largest elephant herds."}, {"label": "Day 8", "title": "Victoria Falls", "desc": "A short border crossing to see the falls before departure."}]}, {"id": "cabo-verde", "name": "Cabo Verde", "flag": "🇨🇻", "capital": "Praia", "population": "590,000", "language": "Portuguese, Cape Verdean Creole", "currency": "Cape Verdean escudo", "bestTime": "November–June", "blurb": "Cabo Verde's ten volcanic islands off West Africa range from wind-battered dune beaches to green mountain villages, tied together by a slow-paced Creole culture and morna music.", "attractions": [{"name": "Santa Maria beach, Sal", "wiki": "Sal,_Cape_Verde", "desc": "A long stretch of white sand and steady trade winds that made Sal one of the world's best-known kitesurfing destinations. The town behind it stays low-key, with a working pier and a relaxed strip of cafes. It's the easiest island to reach and the most set up for a straightforward beach holiday."}, {"name": "Fogo volcano", "wiki": "Pico_do_Fogo", "desc": "An active volcano rising to nearly 2,829 meters, with a village, Chã das Caldeiras, sitting inside its outer crater and growing grapes in volcanic soil for a distinctive local wine. Guided hikes climb to the rim, with the option to continue to the true summit. The 2014 eruption reshaped part of the crater floor within living memory."}, {"name": "Santo Antão's hiking trails", "wiki": "Santo_Antão,_Cape_Verde", "desc": "A dramatically green, mountainous island cut by deep ribeiras (valleys) and terraced with sugarcane and coffee. Old cobbled paths, once the only routes between villages, now serve as some of West Africa's best hiking trails, winding along cliff edges and through cloud forest. It's a sharp contrast to the desert islands nearby."}, {"name": "Cidade Velha", "wiki": "Cidade_Velha", "desc": "The first European colonial settlement in the tropics, founded by the Portuguese in the 15th century on Santiago island. Its ruined fortress, colonial church, and old pillory square tell the darker history of the transatlantic slave trade that passed through here. It's a UNESCO World Heritage Site and an easy day trip from Praia."}, {"name": "São Vicente's Mindelo", "wiki": "Mindelo", "desc": "A colorful port town considered the cultural capital of Cabo Verde, birthplace of singer Cesária Évora and the spiritual home of morna music. Its lively Carnival, waterfront cafes, and pastel colonial buildings give it a distinct character from the quieter islands. Live music spills out of small bars most evenings."}, {"name": "Buracona blue eye, Sal", "wiki": "Sal,_Cape_Verde", "desc": "A natural rock pool near Sal's northern tip where sunlight filtering through an underwater cave creates a glowing blue effect, best seen around midday. Nearby, the Pedra de Lume salt crater offers a swim in mineral-dense, buoyant water inside an old volcanic caldera. Both make for an easy, scenic half-day loop."}], "itineraryDays": 9, "itinerary": [{"label": "Days 1–3", "title": "Sal", "desc": "Beach time at Santa Maria, plus the Buracona blue eye and Pedra de Lume."}, {"label": "Days 4–6", "title": "Santo Antão", "desc": "Ferry via São Vicente to hike the island's green ribeiras and coastal trails."}, {"label": "Day 6 (evening)", "title": "Mindelo", "desc": "An evening in São Vicente's lively port town before flying on."}, {"label": "Days 7–9", "title": "Fogo & Santiago", "desc": "Hike the volcano, then visit Cidade Velha near Praia before departure."}]}, {"id": "egypt", "name": "Egypt", "flag": "🇪🇬", "capital": "Cairo", "population": "112 million", "language": "Arabic", "currency": "Egyptian pound", "bestTime": "October–April", "blurb": "Most of Egypt's essential sights sit along one river, which makes a Nile itinerary the natural spine for a first visit.", "attractions": [{"name": "Pyramids of Giza", "wiki": "Great_Pyramid_of_Giza", "desc": "The last standing wonder of the ancient world, its precisely aligned limestone blocks still prompting debate over the exact construction methods used over 4,500 years ago. The Great Sphinx sits just beside it, its origins and original appearance still partly mysterious. Camel rides and sound-and-light shows are popular add-ons, though the monuments themselves need no embellishment."}, {"name": "Egyptian Museum, Cairo", "wiki": "Egyptian_Museum", "desc": "Home to Tutankhamun's treasures, including his iconic gold burial mask, alongside a dense collection spanning three millennia of ancient Egyptian civilization. The sheer volume of artifacts, many displayed with minimal modern presentation, gives it a distinctly old-fashioned but genuinely thrilling character. A new, more spacious museum near the pyramids is gradually taking over much of the collection."}, {"name": "Karnak & the Valley of the Kings, Luxor", "wiki": "Karnak", "desc": "Karnak's temple complex, built and expanded over 2,000 years, remains the largest religious building ever constructed, its forest of massive columns dwarfing visitors below. Across the river, the Valley of the Kings holds the rock-cut tombs of pharaohs including Tutankhamun, their painted interiors remarkably vivid despite their age. Luxor is sometimes called the world's largest open-air museum for good reason."}, {"name": "Nile felucca sail, Aswan", "wiki": "Felucca", "desc": "A slow sail past riverside villages and palm groves on a traditional wooden boat, offering a quieter, more contemplative pace than the larger cruise ships. Aswan's position near the Nubian border gives it a distinct culture and architecture from northern Egypt. Sunset sails around Elephantine Island are a particularly popular choice."}, {"name": "Abu Simbel", "wiki": "Abu_Simbel_temples", "desc": "Two massive rock-cut temples built by Ramses II, their facade of four colossal seated statues among the most recognizable images of ancient Egypt. The entire complex was relocated in the 1960s to save it from flooding after the construction of the Aswan High Dam, a major feat of modern engineering in its own right. Twice a year, sunlight aligns to illuminate the inner sanctuary, a detail believed to be intentional."}, {"name": "Islamic Cairo & Khan el-Khalili", "wiki": "Khan_el-Khalili", "desc": "A historic bazaar district dating to the 14th century, its narrow lanes packed with spice sellers, goldsmiths, and coffee houses that have hosted generations of traders and, more recently, travelers. Surrounding mosques and madrasas showcase centuries of Islamic architectural development largely undisturbed by modern Cairo's sprawl. Bargaining is expected and part of the experience."}], "itineraryDays": 8, "itinerary": [{"label": "Days 1–2", "title": "Cairo & Giza", "desc": "The pyramids, the Sphinx, and the Egyptian Museum's collection."}, {"label": "Days 3–5", "title": "Nile cruise", "desc": "Sail from Luxor to Aswan, stopping at Karnak, the Valley of the Kings, and Edfu."}, {"label": "Day 6", "title": "Abu Simbel", "desc": "An early flight or drive to see Ramses II's temple carved into the cliffside."}, {"label": "Days 7–8", "title": "Red Sea or Cairo", "desc": "Either a coastal stop in Hurghada, or a return to Cairo for departure."}]}, {"id": "kenya", "name": "Kenya", "flag": "🇰🇪", "capital": "Nairobi", "population": "55 million", "language": "Swahili, English", "currency": "Kenyan shilling", "bestTime": "June–October", "blurb": "Kenya's Rift Valley parks hold some of the most reliable wildlife viewing on the continent, from the Mara's migration to flamingo-lined lakes.", "attractions": [{"name": "Maasai Mara", "wiki": "Maasai_Mara", "desc": "Home to the wildebeest migration between July and September, when over a million animals cross crocodile-filled rivers in one of nature's most dramatic annual events. Dense predator populations, including lions, cheetahs, and leopards, make game drives here productive year-round, not just during migration season. Maasai-guided village visits add cultural context alongside the wildlife."}, {"name": "Amboseli National Park", "wiki": "Amboseli_National_Park", "desc": "Famous for large elephant herds photographed against the towering backdrop of Mount Kilimanjaro just across the border in Tanzania. The park's swampy wetlands, fed by underground rivers from the mountain, sustain wildlife even through the driest months. Clear morning light before clouds gather around the peak offers the best photography conditions."}, {"name": "Lake Nakuru", "wiki": "Lake_Nakuru_National_Park", "desc": "A soda lake once famous for enormous flocks of flamingos, whose numbers now fluctuate with changing water chemistry, alongside a well-protected rhino sanctuary within the park boundaries. Acacia woodland surrounding the lake supports leopards and a healthy giraffe population. Its relatively compact size makes for efficient game drives compared to larger parks."}, {"name": "Diani Beach", "wiki": "Diani_Beach", "desc": "White sand and a protected coral reef on the Indian Ocean coast, a natural and relaxing add-on after the intensity of a safari itinerary. Kitesurfing conditions here are considered among the best in East Africa. A nearby forest reserve protects rare Angolan colobus monkeys, offering a wildlife encounter distinct from the inland parks."}, {"name": "Hell's Gate National Park", "wiki": "Hell%27s_Gate_National_Park", "desc": "One of the few Kenyan parks where visitors can walk, cycle, or rock climb among wildlife without a vehicle, its dramatic gorge and towering cliffs partly inspiring scenes in Disney's The Lion King. Geothermal activity, including steam vents and hot springs, adds an unusual volcanic backdrop. It's a favorite for a more active, hands-on safari experience."}, {"name": "Nairobi National Park", "wiki": "Nairobi_National_Park", "desc": "An unusual park sitting directly against the edge of a capital city, its lions and rhinos visible with the Nairobi skyline as an incongruous backdrop. It offers a convenient way to see wildlife on a tight schedule or as an introduction before heading further afield. The adjoining Giraffe Centre and elephant orphanage are popular add-ons."}], "itineraryDays": 7, "itinerary": [{"label": "Days 1–3", "title": "Maasai Mara", "desc": "Morning and evening game drives, with a full day near the Mara River during migration season."}, {"label": "Days 4–5", "title": "Amboseli", "desc": "Transfer south for elephant sightings with Kilimanjaro views."}, {"label": "Day 6", "title": "Lake Nakuru", "desc": "A stop for flamingos and a chance at rhino before heading back north."}, {"label": "Day 7", "title": "Nairobi", "desc": "Visit the Giraffe Centre or Sheldrick elephant orphanage before departure."}]}, {"id": "mauritius", "name": "Mauritius", "flag": "🇲🇺", "capital": "Port Louis", "population": "1.3 million", "language": "English, French, Mauritian Creole", "currency": "Mauritian rupee", "bestTime": "May–December", "blurb": "Mauritius pairs postcard beaches with a genuinely mixed culture, its Indian, African, Chinese, and French influences showing up as much in the food as in the temples and churches sitting side by side.", "attractions": [{"name": "Le Morne Brabant", "wiki": "Le_Morne_Brabant", "desc": "A dramatic basalt mountain rising sharply from the island's southwest coast, listed by UNESCO for its history as a refuge for escaped slaves. The surrounding lagoon is also home to a famous optical illusion, an underwater 'waterfall' visible from the air where sand slopes drop off the shelf. It's one of the most photographed views in the country."}, {"name": "Chamarel Seven Coloured Earths", "wiki": "Chamarel", "desc": "A small geological site where volcanic soil has settled into distinct bands of red, brown, and purple that never mix, even after rain. It sits near a striking waterfall of the same name and a well-known rum distillery. The combination makes for an easy half-day trip inland from the coast."}, {"name": "Black River Gorges National Park", "wiki": "Black_River_Gorges_National_Park", "desc": "The island's largest area of native forest, laced with hiking trails through steep gorges and past several waterfalls. It's one of the few places to see Mauritius's endemic birds, several of which were brought back from the edge of extinction. Trails range from easy viewpoints to full-day hikes."}, {"name": "Île aux Cerfs", "wiki": "Île_aux_Cerfs", "desc": "A small island off the east coast reached only by boat, ringed by turquoise water and white sand beaches. It's set up for a full day of swimming, water sports, and a round of golf on its course. Boat trips there often stop at a waterfall on the way."}, {"name": "Port Louis Central Market", "wiki": "Port_Louis", "desc": "The capital's covered market is the best place to see the island's cultural mix up close, from spice stalls to Creole street food. Nearby, the Caudan Waterfront adds a more polished harborside shopping and dining area. It's a useful stop for a sense of daily life beyond the resorts."}, {"name": "Grand Bassin", "wiki": "Ganga_Talao", "desc": "A crater lake considered one of the holiest Hindu sites outside India, ringed by temples and a towering statue of Shiva visible from the road below. It draws large pilgrimage crowds during the Maha Shivaratri festival but is quiet and contemplative most other days. The setting, in the island's forested highlands, adds to its atmosphere."}], "itineraryDays": 7, "itinerary": [{"label": "Days 1–2", "title": "South coast & Le Morne", "desc": "Settle in near Le Morne, with time for the lagoon and coastal views."}, {"label": "Day 3", "title": "Chamarel & Black River Gorges", "desc": "The coloured earths, a waterfall, and a hike through native forest."}, {"label": "Day 4", "title": "Grand Bassin", "desc": "A cultural detour inland to the sacred crater lake."}, {"label": "Days 5–6", "title": "East coast & Île aux Cerfs", "desc": "Beach time and a boat trip out to the small offshore island."}, {"label": "Day 7", "title": "Port Louis", "desc": "The capital's market and waterfront before departure."}]}, {"id": "morocco", "name": "Morocco", "flag": "🇲🇦", "capital": "Rabat", "population": "37 million", "language": "Arabic, French", "currency": "Moroccan dirham", "bestTime": "March–May, Sept–Nov", "blurb": "Morocco stacks a lot into a short drive: walled medinas built for getting lost in, the High Atlas rising behind them, and Sahara dunes a day further south.", "attractions": [{"name": "Jemaa el-Fnaa, Marrakech", "wiki": "Jemaa_el-Fnaa", "desc": "Marrakech's main square shifts character completely between day and night, filled with orange-juice stalls and snake charmers by afternoon before transforming into a dense open-air food market after dark. Storytellers, musicians, and henna artists compete for space among the smoke of dozens of grills. It's been a gathering place for locals and travelers for nearly a thousand years."}, {"name": "Chefchaouen", "wiki": "Chefchaouen", "desc": "A hill town in the Rif Mountains painted almost entirely in shades of blue, a tradition with disputed origins ranging from Jewish refugee communities to simple insect-repelling practicality. Its steep, narrow lanes make for aimless, photogenic wandering rather than a checklist of sights. The surrounding mountains offer day hikes for those staying more than a night."}, {"name": "Erg Chebbi dunes, Merzouga", "wiki": "Erg_Chebbi", "desc": "Towering Sahara dunes reached by camel trek, with desert camps offering a night under some of the clearest skies in the country. Sunrise and sunset both transform the dune colors dramatically, from soft pink to deep orange. Sandboarding down the steepest faces is a popular addition for those staying overnight."}, {"name": "Fes el-Bali", "wiki": "Fes_el_Bali", "desc": "The old medina's leather tanneries and souks form one of the world's largest car-free urban areas, its narrow lanes barely wide enough for the donkeys still used to move goods. The Chouara Tannery, with its ancient stone vats of dye, remains one of the most striking and pungent sights in the city. Getting lost here is less a risk than an expectation."}, {"name": "Aït Benhaddou", "wiki": "Aït_Benhaddou", "desc": "A fortified ksar of earthen clay buildings rising from the desert on the old caravan route between the Sahara and Marrakech, its dramatic silhouette used as a filming location for Gladiator and Game of Thrones. A handful of families still live within its walls, though most residents have moved to the newer village across the river. Climbing to the top offers wide views over the valley."}, {"name": "Majorelle Garden, Marrakech", "wiki": "Jardin_Majorelle", "desc": "A small but densely planted botanical garden built by French painter Jacques Majorelle, later restored by fashion designer Yves Saint Laurent, its cobalt blue buildings offset by cacti and bamboo. It offers a cool, quiet retreat from Marrakech's busier streets. A small museum on-site covers Saint Laurent's connection to Morocco."}], "itineraryDays": 8, "itinerary": [{"label": "Days 1–2", "title": "Marrakech", "desc": "Settle into the medina, visit the Bahia Palace, and get lost in the souks around Jemaa el-Fnaa."}, {"label": "Day 3", "title": "High Atlas day trip", "desc": "Drive into the mountains to Berber villages and the Ourika Valley."}, {"label": "Days 4–5", "title": "Into the Sahara", "desc": "Cross the Atlas via Ouarzazate and Todra Gorge to a camp at Erg Chebbi for sunrise on the dunes."}, {"label": "Days 6–7", "title": "Fes", "desc": "Explore the tanneries, madrasas, and the maze of the old medina."}, {"label": "Day 8", "title": "Chefchaouen or Casablanca", "desc": "A short detour to the blue city, or head straight to Casablanca for departure."}]}, {"id": "namibia", "name": "Namibia", "flag": "🇳🇦", "capital": "Windhoek", "population": "2.6 million", "language": "English", "currency": "Namibian dollar", "bestTime": "May–October", "blurb": "Namibia is a self-drive country almost by design: vast, empty roads connect towering red dunes, a skeleton-strewn coastline, and some of Africa's darkest night skies.", "attractions": [{"name": "Sossusvlei dunes", "wiki": "Sossusvlei", "desc": "Some of the tallest sand dunes on Earth rise in shades of deep red and orange within the Namib-Naukluft park. Climbing Dune 45 or Big Daddy for sunrise is a rite of passage, with the stark white clay pan of Deadvlei nearby adding a surreal contrast of dead trees against orange sand. Photographers plan entire trips around the light here."}, {"name": "Etosha National Park", "wiki": "Etosha_National_Park", "desc": "A vast salt pan anchors this park, with waterholes drawing elephants, lions, rhinos, and giraffes into close, predictable viewing during the dry season. Self-drive safaris are straightforward thanks to good roads and well-placed camps with floodlit waterholes for night viewing. It's considered one of Africa's most accessible parks for independent travelers."}, {"name": "Skeleton Coast", "wiki": "Skeleton_Coast", "desc": "A remote, fog-bound stretch of Atlantic coastline named for the shipwrecks and whale bones that once littered its shore. Cold currents meeting hot desert air create an eerie, sparsely populated landscape of dunes meeting surf. Access is limited and often requires a fly-in safari or guided permit."}, {"name": "Fish River Canyon", "wiki": "Fish_River_Canyon", "desc": "One of the largest canyons in the world, carved over millions of years into the southern Namibian plateau. A multi-day hike along its floor is a serious undertaking, but the main viewpoint alone rewards a shorter visit with dramatic layered rock views. It's often paired with a stop at nearby hot springs."}, {"name": "Damaraland", "wiki": "Damaraland", "desc": "A rugged, sparsely populated region known for desert-adapted elephants that have learned to survive on minimal water, along with ancient rock engravings at Twyfelfontein. The open terrain and dramatic rock formations make it a favorite for slower, off-the-grid exploration. Community-run camps offer a way to see the region responsibly."}, {"name": "Swakopmund", "wiki": "Swakopmund", "desc": "A coastal town with a distinctly German architectural feel, sitting where the Namib Desert meets the cold Atlantic. It functions as an adventure hub, offering sandboarding, quad biking, and dolphin cruises alongside a relaxed, walkable town center. It's a natural stop between the dunes and Damaraland."}], "itineraryDays": 10, "itinerary": [{"label": "Days 1–2", "title": "Windhoek to Sossusvlei", "desc": "Drive south into the Namib for sunrise at the dunes and Deadvlei."}, {"label": "Days 3–4", "title": "Swakopmund", "desc": "Coastal adventure activities and a change of scenery on the Atlantic."}, {"label": "Days 5–6", "title": "Damaraland", "desc": "Desert-adapted elephants and ancient rock art in open, rugged terrain."}, {"label": "Days 7–9", "title": "Etosha", "desc": "Self-drive game viewing around the pan's floodlit waterholes."}, {"label": "Day 10", "title": "Windhoek", "desc": "Return to the capital for departure."}]}, {"id": "south-africa", "name": "South Africa", "flag": "🇿🇦", "capital": "Pretoria", "population": "60 million", "language": "11 official languages", "currency": "South African rand", "bestTime": "May–Sept for safari", "blurb": "From Table Mountain to Kruger's bushveld, South Africa covers coastline, wine country, and safari in a single, well-paved trip.", "attractions": [{"name": "Table Mountain, Cape Town", "wiki": "Table_Mountain", "desc": "A flat-topped mountain overlooking Cape Town, reachable by a rotating cable car or a strenuous multi-hour hike up Platteklip Gorge. Its summit plateau offers sweeping views over the city, the Atlantic, and Robben Island in the bay below. Cloud cover, known locally as the 'tablecloth', can close the cableway with little notice, so flexibility helps."}, {"name": "Kruger National Park", "wiki": "Kruger_National_Park", "desc": "One of Africa's largest and most established reserves, with a strong chance of seeing all of the Big Five within a few days of game drives. Both self-drive and guided lodge-based safaris are well developed here, offering flexibility for different budgets and travel styles. Night drives reveal a different set of nocturnal species than daytime viewing."}, {"name": "Stellenbosch & the Winelands", "wiki": "Stellenbosch", "desc": "Cape Dutch estates and tastings less than an hour from Cape Town, set among some of the oldest vineyards in the Southern Hemisphere. Stellenbosch's oak-lined streets and university town atmosphere make it pleasant to explore on foot between tastings. Franschhoek nearby adds a French Huguenot history and a strong culinary reputation."}, {"name": "Robben Island", "wiki": "Robben_Island", "desc": "A former prison island in Table Bay where Nelson Mandela was held for 18 of his 27 years in prison, now preserved as a museum and UNESCO World Heritage Site. Tours are often led by former political prisoners, adding a firsthand account to the history. The ferry crossing itself offers unusual views back toward Cape Town and Table Mountain."}, {"name": "Cape of Good Hope", "wiki": "Cape_of_Good_Hope", "desc": "A rugged, wind-battered peninsula at the southwestern tip of Africa, long mythologized as a maritime turning point though not technically the continent's southernmost point. Chacma baboons and ostriches roam freely near the parking areas, so caution with food is advised. A steep climb or funicular ride leads to the old lighthouse for sweeping ocean views."}, {"name": "Boulders Beach penguins", "wiki": "Boulders_Beach", "desc": "A protected beach near Simon's Town home to a colony of African penguins that established itself here in the late 1980s and has grown steadily since. Boardwalks allow close, safe viewing without disturbing the nesting birds. It's an easy, family-friendly stop on the way to or from the Cape Peninsula."}], "itineraryDays": 9, "itinerary": [{"label": "Days 1–4", "title": "Cape Town & the Winelands", "desc": "Table Mountain, the Cape of Good Hope, and a day in Stellenbosch or Franschhoek."}, {"label": "Day 5", "title": "Garden Route", "desc": "Drive or fly toward the coast, stopping in Hermanus for whale watching in season."}, {"label": "Days 6–8", "title": "Kruger safari", "desc": "Game drives from a lodge on the western edge of the park."}, {"label": "Day 9", "title": "Johannesburg", "desc": "Departure, with time for the Apartheid Museum if your flight allows."}]}, {"id": "tanzania", "name": "Tanzania", "flag": "🇹🇿", "capital": "Dodoma", "population": "67 million", "language": "Swahili, English", "currency": "Tanzanian shilling", "bestTime": "June–October", "blurb": "Tanzania pairs two of Africa's biggest draws in one country: the Serengeti's endless plains and Kilimanjaro's snow-capped summit, with Zanzibar's beaches as an easy add-on.", "attractions": [{"name": "Serengeti National Park", "wiki": "Serengeti_National_Park", "desc": "The Serengeti's open grasslands host the largest overland mammal migration on Earth, with over a million wildebeest and zebra moving in a constant circuit between Tanzania and Kenya. Game drives here rank among the most reliable anywhere for spotting lions, cheetahs, and leopards. The scale of the landscape, flat and horizon-wide, is part of the experience itself."}, {"name": "Mount Kilimanjaro", "wiki": "Mount_Kilimanjaro", "desc": "Africa's tallest peak rises alone from the surrounding plains, its snowy summit visible from great distances despite sitting almost on the equator. Several multi-day routes climb through five distinct ecological zones before reaching Uhuru Peak. No technical climbing skill is required, but altitude makes the final push genuinely demanding."}, {"name": "Ngorongoro Crater", "wiki": "Ngorongoro_Conservation_Area", "desc": "A collapsed volcanic caldera forms a natural enclosure packed with wildlife, including one of the region's few remaining black rhino populations. The crater floor stays green even in dry season, drawing animals down from the highlands. Descending the crater walls by vehicle feels like entering a self-contained ecosystem."}, {"name": "Zanzibar's Stone Town", "wiki": "Stone_Town", "desc": "This old trading port on Zanzibar island mixes Arab, Persian, Indian, and European architecture along narrow, shaded lanes. Carved wooden doors and spice markets recall its centuries as a hub of the Indian Ocean trade. It pairs naturally with the white sand beaches found elsewhere on the island."}, {"name": "Tarangire National Park", "wiki": "Tarangire_National_Park", "desc": "Known for its baobab-studded landscape and large elephant herds that gather along the Tarangire River during the dry season. It's quieter than the Serengeti but still delivers dense wildlife viewing, particularly for elephants and birdlife. Many visitors add it as a shorter stop before or after the bigger parks."}, {"name": "Lake Manyara", "wiki": "Lake_Manyara_National_Park", "desc": "A compact park set beneath the Rift Valley escarpment, known for tree-climbing lions and large flocks of flamingos along the alkaline lake shore. The dense groundwater forest gives way quickly to open lakeshore, packing varied scenery into a small area. It's often visited as a warm-up before the Serengeti."}], "itineraryDays": 9, "itinerary": [{"label": "Days 1–2", "title": "Arusha & Tarangire", "desc": "Acclimatize in Arusha before a first game drive among Tarangire's baobabs and elephant herds."}, {"label": "Day 3", "title": "Lake Manyara", "desc": "A shorter park visit known for tree-climbing lions and flamingo flocks."}, {"label": "Days 4–5", "title": "Ngorongoro Crater", "desc": "Descend into the crater for dense wildlife viewing across a self-contained ecosystem."}, {"label": "Days 6–7", "title": "Serengeti", "desc": "Extended game drives across the plains, timed to the migration if possible."}, {"label": "Days 8–9", "title": "Zanzibar", "desc": "Fly out to the coast for Stone Town and beach time to close the trip."}]}, {"id": "zambia", "name": "Zambia", "flag": "🇿🇲", "capital": "Lusaka", "population": "20.6 million", "language": "English", "currency": "Zambian kwacha", "bestTime": "May–October", "blurb": "Zambia offers a quieter, walking-focused safari style, with Victoria Falls' Zambian side and the wildlife-dense South Luangwa Valley as its two anchor destinations.", "attractions": [{"name": "Victoria Falls, Zambia side", "wiki": "Victoria_Falls", "desc": "The Zambian bank offers closer, wetter views of the falls, including the thrilling Knife-Edge Bridge walkway that puts visitors right beside the plunging water. In the dry season, the seasonal Devil's Pool allows swimming at the very edge of the falls. It pairs naturally with the wider views available from the Zimbabwean side."}, {"name": "South Luangwa National Park", "wiki": "South_Luangwa_National_Park", "desc": "Widely credited as the birthplace of the walking safari, this park offers close, guide-led encounters with leopards, elephants, and hippos along the Luangwa River. Its density of wildlife rivals much larger, more famous parks, but with far fewer vehicles. Night drives here are also well regarded for spotting nocturnal species."}, {"name": "Lower Zambezi National Park", "wiki": "Lower_Zambezi_National_Park", "desc": "A riverside park facing Zimbabwe's Mana Pools across the Zambezi, known for canoe safaris that glide silently past elephants and hippos at the water's edge. Its combination of river-based and land-based game viewing sets it apart from more standard drive-only parks. It's less developed than South Luangwa, appealing to travelers wanting a quieter alternative."}, {"name": "Kafue National Park", "wiki": "Kafue_National_Park", "desc": "One of the largest national parks in Africa, though still relatively undeveloped for tourism, offering a real sense of wilderness. Its size supports diverse habitats, from open plains to dense woodland, with strong populations of lion, leopard, and antelope species found nowhere else in the region. Access requires more planning than the more established parks."}, {"name": "Livingstone town", "wiki": "Livingstone,_Zambia", "desc": "The town nearest Victoria Falls, named after the explorer David Livingstone, functions as the country's adventure tourism hub. Bungee jumping, white-water rafting, and microlight flights over the falls are all organized from here. The Livingstone Museum offers useful context on the region's colonial and pre-colonial history."}, {"name": "Lake Kariba, Zambian shore", "wiki": "Lake_Kariba", "desc": "Zambia's side of this vast man-made lake offers houseboat trips and lakeside lodges with wildlife viewing along the shoreline. It's a slower-paced counterpoint to the more intense safari parks, with fishing and sunset cruises as the main activities. The lake also borders Zimbabwe, and cross-border trips are common."}], "itineraryDays": 8, "itinerary": [{"label": "Days 1–2", "title": "Livingstone & Victoria Falls", "desc": "Close-up views of the falls plus optional adventure activities in town."}, {"label": "Days 3–5", "title": "South Luangwa", "desc": "Walking safaris and night drives through one of Africa's most wildlife-dense parks."}, {"label": "Days 6–7", "title": "Lower Zambezi", "desc": "Canoe safaris along the river, gliding past elephants and hippos."}, {"label": "Day 8", "title": "Lusaka", "desc": "A short stop in the capital before departure."}]}, {"id": "zimbabwe", "name": "Zimbabwe", "flag": "🇿🇼", "capital": "Harare", "population": "16.7 million", "language": "English, Shona, Ndebele", "currency": "US dollar (widely used)", "bestTime": "May–October", "blurb": "Zimbabwe holds the best full view of Victoria Falls and pairs it with some of the region's least-visited but most rewarding wildlife parks.", "attractions": [{"name": "Victoria Falls", "wiki": "Victoria_Falls", "desc": "Known locally as Mosi-oa-Tunya, 'the smoke that thunders', this is one of the largest waterfalls in the world by combined width and height. The Zimbabwean side offers the widest, most direct views of the main falls, especially in high water season when spray can be seen for kilometers. Bridge walks and adventure activities like bungee jumping add to the appeal."}, {"name": "Hwange National Park", "wiki": "Hwange_National_Park", "desc": "Zimbabwe's largest park holds one of Africa's biggest elephant populations, along with strong lion and wild dog numbers. Waterhole-based game viewing is particularly good in the dry season, when animals concentrate around a limited number of pumped water points. It sees far fewer visitors than comparable parks elsewhere in the region."}, {"name": "Mana Pools National Park", "wiki": "Mana_Pools_National_Park", "desc": "A UNESCO-listed floodplain along the Zambezi River, known for allowing walking safaris in the presence of large game, a rarity in African parks. Elephants, buffalo, and predators gather along the river's pools during the dry season. Its remoteness and strict visitor limits keep it feeling genuinely wild."}, {"name": "Great Zimbabwe ruins", "wiki": "Great_Zimbabwe", "desc": "The stone remains of a medieval city that once anchored a major trading empire, built entirely without mortar from carefully cut granite blocks. It's the largest ancient stone structure in sub-Saharan Africa and gave the country its name. The site includes a hilltop complex and a lower enclosure with massive curved walls."}, {"name": "Lake Kariba", "wiki": "Lake_Kariba", "desc": "One of the largest man-made lakes in the world, formed by damming the Zambezi River, now ringed by wildlife-rich shoreline and houseboats. Sunset cruises here are known for close elephant and buffalo sightings as animals come down to drink. It's a relaxed contrast to the more intense game drives elsewhere."}, {"name": "Matobo Hills", "wiki": "Matobo_Hills", "desc": "A landscape of huge balancing granite boulders scattered across rolling hills, sacred to local Ndebele and Shona communities and home to ancient rock art. It also holds one of the country's best rhino tracking experiences, done on foot with a guide. Cecil Rhodes chose to be buried here, at a site called World's View."}], "itineraryDays": 8, "itinerary": [{"label": "Days 1–2", "title": "Victoria Falls", "desc": "The falls themselves, plus optional adventure activities like the bridge walk or a sunset cruise."}, {"label": "Days 3–5", "title": "Hwange National Park", "desc": "Waterhole-based game drives through Zimbabwe's largest wildlife reserve."}, {"label": "Days 6–7", "title": "Matobo Hills", "desc": "Rhino tracking on foot and rock art among giant granite boulders."}, {"label": "Day 8", "title": "Great Zimbabwe", "desc": "A stop at the ancient stone ruins before departure from Harare."}]}]}, {"id": "asia", "name": "Asia", "tagline": "Temples, coastlines, and cities that never fully sleep", "color": "#C9A24B", "countries": [{"id": "cambodia", "name": "Cambodia", "flag": "🇰🇭", "capital": "Phnom Penh", "population": "17 million", "language": "Khmer", "currency": "Cambodian riel", "bestTime": "November–March", "blurb": "Cambodia's temples at Angkor are the reason most people come, but Phnom Penh's more recent history adds a sobering, important second half to any trip.", "attractions": [{"name": "Angkor Wat", "wiki": "Angkor_Wat", "desc": "The largest religious monument in the world, built in the 12th century as a Hindu temple before later becoming Buddhist. Its five central towers, representing the peaks of Mount Meru, are among the most recognizable silhouettes in Southeast Asia, especially at sunrise. A single visit barely scratches the surface of its carved galleries and reflecting pools."}, {"name": "Angkor Thom & the Bayon", "wiki": "Bayon", "desc": "The last great capital of the Khmer Empire, its central Bayon temple famous for over 200 massive serene stone faces gazing out in every direction. The South Gate approach, lined with rows of carved figures, sets the tone before reaching the temple itself. It sits within walking or biking distance of Angkor Wat."}, {"name": "Ta Prohm", "wiki": "Ta_Prohm", "desc": "Left largely as it was found, this temple has been partly reclaimed by the jungle, with massive silk-cotton and strangler fig tree roots wrapping over its stone walls and towers. It gained wider fame as a filming location for Tomb Raider. The combination of ruin and living forest makes it one of the most photographed sites at Angkor."}, {"name": "Tonlé Sap Lake", "wiki": "Tonlé_Sap", "desc": "Southeast Asia's largest freshwater lake, which dramatically expands and contracts with the seasons, supporting floating villages that rise and fall with the water level. Boat trips from Siem Reap pass stilted houses, floating markets, and fishing communities adapted to this unusual rhythm. It offers a different, more everyday view of Cambodian life than the temples."}, {"name": "Tuol Sleng Genocide Museum", "wiki": "Tuol_Sleng_Genocide_Museum", "desc": "A former high school converted into a prison and interrogation center during the Khmer Rouge regime, now preserved as a memorial and museum. Rooms of photographs of victims and preserved cells offer a direct, unflinching account of a period that killed roughly a quarter of the population. It's a difficult but widely considered essential visit."}, {"name": "Royal Palace, Phnom Penh", "wiki": "Royal_Palace,_Phnom_Penh", "desc": "The official residence of the King of Cambodia, its golden spires and manicured grounds sit beside the Silver Pagoda, named for its floor of solid silver tiles. It offers a lighter counterpoint to the capital's more sobering historical sites. Modest dress is required to enter the grounds."}], "itineraryDays": 8, "itinerary": [{"label": "Days 1–4", "title": "Siem Reap & Angkor", "desc": "Sunrise at Angkor Wat, the Bayon's faces, Ta Prohm's tree roots, and a Tonlé Sap boat trip."}, {"label": "Days 5–7", "title": "Phnom Penh", "desc": "The Royal Palace, riverside promenade, and the Tuol Sleng Genocide Museum."}, {"label": "Day 8", "title": "Departure", "desc": "Fly out of Phnom Penh."}]}, {"id": "china", "name": "China", "flag": "🇨🇳", "capital": "Beijing", "population": "1.41 billion", "language": "Mandarin Chinese", "currency": "Renminbi (yuan)", "bestTime": "March–May, September–November", "blurb": "China's scale means most first trips focus on a single region; Beijing and Xi'an together cover the imperial capital, the Great Wall, and the Terracotta Army in one efficient loop.", "attractions": [{"name": "The Great Wall of China", "wiki": "Great_Wall_of_China", "desc": "This defensive wall stretches thousands of kilometers across northern China, built and rebuilt over centuries by successive dynasties. The Mutianyu and Jinshanling sections near Beijing offer dramatic mountain scenery with far fewer crowds than the more famous Badaling stretch. Walking even a short restored section gives a real sense of its scale."}, {"name": "The Forbidden City", "wiki": "Forbidden_City", "desc": "The imperial palace complex at the heart of Beijing housed Chinese emperors for nearly 500 years and remains the best-preserved cluster of ancient wooden architecture in the world. Nearly a thousand buildings and courtyards sit inside its walls, arranged with strict symbolic symmetry. A full visit easily takes half a day."}, {"name": "Terracotta Army, Xi'an", "wiki": "Terracotta_Army", "desc": "Thousands of life-sized clay soldiers, each with individually sculpted faces, were buried to guard the tomb of China's first emperor over 2,200 years ago. Discovered by farmers in 1974, the excavation site is now covered by museum hangars that let visitors look down on the ranks as archaeologists still work. It's one of the most significant archaeological finds of the 20th century."}, {"name": "The Bund, Shanghai", "wiki": "The_Bund", "desc": "A riverside promenade lined with colonial-era European buildings on one side and Shanghai's futuristic skyline, including the Oriental Pearl Tower, directly across the water. The contrast between old and new is most striking at night, when both banks light up. It's the natural starting point for exploring the city."}, {"name": "Li River & Guilin's karst hills", "wiki": "Li_River", "desc": "Limestone karst peaks rise dramatically along the Li River between Guilin and Yangshuo, a landscape that has appeared on Chinese ink paintings for centuries. A slow river cruise or bamboo raft trip is the classic way to see it, with cycling around Yangshuo's countryside as a popular add-on. It's considered one of the most scenic river journeys in the country."}, {"name": "Zhangjiajie National Forest Park", "wiki": "Zhangjiajie_National_Forest_Park", "desc": "Thousands of narrow sandstone pillars rise out of dense forest, an otherworldly landscape that inspired the floating mountains in the film Avatar. A glass-bottomed skywalk and a spectacular glass bridge span some of the deepest gorges. It's more remote than China's other major sites, requiring a flight to reach comfortably."}], "itineraryDays": 12, "itinerary": [{"label": "Days 1–4", "title": "Beijing", "desc": "The Forbidden City, Tiananmen Square, and a day trip to the Great Wall at Mutianyu."}, {"label": "Days 5–6", "title": "Xi'an", "desc": "The Terracotta Army and the ancient city walls."}, {"label": "Days 7–9", "title": "Guilin & Yangshuo", "desc": "A river cruise through the karst hills and cycling through the countryside."}, {"label": "Days 10–12", "title": "Shanghai", "desc": "The Bund, the former French Concession, and departure."}]}, {"id": "india", "name": "India", "flag": "🇮🇳", "capital": "New Delhi", "population": "1.44 billion", "language": "Hindi, English, and 20+ regional languages", "currency": "Indian rupee", "bestTime": "October–March", "blurb": "India's Golden Triangle covers a lot of ground in a short loop, and a further trip south or east shows how much the country changes region to region.", "attractions": [{"name": "Taj Mahal, Agra", "wiki": "Taj_Mahal", "desc": "A white marble mausoleum built by Mughal emperor Shah Jahan for his wife Mumtaz Mahal, its perfectly symmetrical form shifting in color from pink at dawn to golden at sunset. Intricate inlaid semi-precious stones cover nearly every surface, a technique called pietra dura. It remains one of the most recognized buildings in the world and is best visited at sunrise to avoid both heat and crowds."}, {"name": "Amber Fort, Jaipur", "wiki": "Amer_Fort", "desc": "A hilltop fort overlooking Maota Lake, its Sheesh Mahal mirror palace designed so a single candle could illuminate the entire room through thousands of reflective glass fragments. Elephant or jeep rides once carried visitors up the fort's ramp, though jeep transport is now more common. It forms the centerpiece of Jaipur's Pink City circuit."}, {"name": "Varanasi's ghats", "wiki": "Ghats_in_Varanasi", "desc": "Riverside stone steps along the Ganges where cremation rites, morning bathing, and evening prayer ceremonies happen side by side, offering an unfiltered view into one of Hinduism's holiest cities. A dawn boat ride along the river reveals the ghats waking up, while the evening Ganga Aarti ceremony fills the main ghat with fire, chanting, and music. It's considered one of the oldest continuously inhabited cities in the world."}, {"name": "Kerala backwaters", "wiki": "Kerala_backwaters", "desc": "A slow houseboat trip through palm-lined canals, lagoons, and lakes in South India, offering a markedly different pace and landscape from the north. Traditional kettuvallam houseboats, once used to transport rice, now serve as floating accommodations with onboard meals. Village life along the banks continues much as it has for generations, visible from the water."}, {"name": "Jaisalmer Fort", "wiki": "Jaisalmer_Fort", "desc": "A living fort in the Thar Desert, still home to around a quarter of the old city's population within its sandstone walls, unusual among India's major forts. Its honey-colored stone glows especially warm at sunset, giving Jaisalmer its nickname, the Golden City. Camel safaris into the surrounding dunes are a common addition for visitors."}, {"name": "Hawa Mahal, Jaipur", "wiki": "Hawa_Mahal", "desc": "A five-story palace facade of pink sandstone, its 953 small windows designed to let royal women observe street life below without being seen themselves, in keeping with purdah customs of the time. Built in 1799, it remains one of Jaipur's most photographed buildings despite having little depth behind its ornate front. Morning light gives the sandstone its most vivid color."}], "itineraryDays": 12, "itinerary": [{"label": "Days 1–3", "title": "Delhi", "desc": "Old and New Delhi, from Humayun's Tomb to Chandni Chowk's food lanes."}, {"label": "Days 4–5", "title": "Agra", "desc": "The Taj Mahal at sunrise and Agra Fort."}, {"label": "Days 6–7", "title": "Jaipur", "desc": "Amber Fort, the City Palace, and the Pink City's bazaars."}, {"label": "Days 8–9", "title": "Varanasi", "desc": "Dawn boat ride along the ghats and an evening aarti ceremony."}, {"label": "Days 10–12", "title": "Kerala backwaters", "desc": "A houseboat stay near Alleppey to close the trip at a slower pace."}]}, {"id": "indonesia", "name": "Indonesia", "flag": "🇮🇩", "capital": "Jakarta", "population": "280 million", "language": "Indonesian", "currency": "Indonesian rupiah", "bestTime": "April–October", "blurb": "Indonesia's thousands of islands mean most trips pick one region; Bali's temples and rice terraces make it the natural starting point, with volcanoes and coral reefs a short flight away.", "attractions": [{"name": "Tanah Lot & Uluwatu temples, Bali", "wiki": "Tanah_Lot", "desc": "Tanah Lot sits on a rock formation just offshore, accessible on foot only at low tide, and is one of Bali's most photographed sunset spots. Uluwatu, perched on a clifftop further south, adds dramatic ocean views and an evening Kecak fire dance performance. Both are relatively easy to combine with a day of temple-hopping."}, {"name": "Tegallalang Rice Terraces", "wiki": "Tegallalang", "desc": "Steep, stepped rice paddies near Ubud built using a centuries-old subak irrigation system still managed communally today. Walking paths wind between the terraces, offering views that shift with the light throughout the day. It's a short drive from Ubud's art markets and yoga studios."}, {"name": "Mount Bromo", "wiki": "Mount_Bromo", "desc": "An active volcano in East Java, its smoking crater rising from a vast sea of volcanic sand inside an older, larger caldera. Most visitors arrive before dawn to a nearby viewpoint for sunrise over the surrounding peaks, then descend on foot or horseback to the crater rim. The otherworldly landscape feels far removed from Bali's beaches."}, {"name": "Komodo National Park", "wiki": "Komodo_National_Park", "desc": "Home to the Komodo dragon, the world's largest living lizard, found in the wild only on a handful of islands in this park. Multi-day boat trips combine dragon-tracking with snorkeling over some of Indonesia's healthiest coral reefs and stops at pink sand beaches. It's a serious undertaking to reach but widely considered worth it."}, {"name": "Borobudur", "wiki": "Borobudur", "desc": "The world's largest Buddhist temple, built in the 9th century on the island of Java as a massive stepped pyramid decorated with thousands of relief panels. Climbing to the top, past rows of bell-shaped stupas each containing a Buddha statue, is meant to mirror the path to enlightenment. Sunrise visits are especially popular, with mist often settling over the surrounding volcanoes."}, {"name": "Gili Islands", "wiki": "Gili_Islands", "desc": "Three small, car-free islands off Lombok known for turtle snorkeling, white sand, and a relaxed pace built around bicycles and horse-drawn carts. Gili Trawangan is the liveliest of the three, while Gili Meno and Gili Air stay quieter. They're a common add-on after Bali for travelers wanting fewer crowds."}], "itineraryDays": 11, "itinerary": [{"label": "Days 1–4", "title": "Bali", "desc": "Ubud's rice terraces, Tanah Lot and Uluwatu temples, and the Gili Islands as a side trip."}, {"label": "Days 5–6", "title": "Mount Bromo", "desc": "Fly to Java for a sunrise volcano trek and crater visit."}, {"label": "Day 7", "title": "Borobudur & Yogyakarta", "desc": "The great Buddhist temple and the nearby royal city."}, {"label": "Days 8–11", "title": "Komodo National Park", "desc": "A multi-day boat trip combining dragon-tracking with snorkeling and beach stops."}]}, {"id": "japan", "name": "Japan", "flag": "🇯🇵", "capital": "Tokyo", "population": "124 million", "language": "Japanese", "currency": "Japanese yen", "bestTime": "March–May, October–November", "blurb": "Japan runs on trains that make a wide loop feel effortless, from Tokyo's density to Kyoto's temples and Osaka's food streets.", "attractions": [{"name": "Senso-ji, Asakusa", "wiki": "Sensō-ji", "desc": "Tokyo's oldest temple, approached through Nakamise-dori, a market street selling traditional snacks and souvenirs beneath a giant red lantern gate. Founded in the 7th century, it survived wartime bombing largely through postwar reconstruction and remains an active place of worship. Evening visits, once the crowds thin, offer a quieter view of the illuminated pagoda."}, {"name": "Fushimi Inari, Kyoto", "wiki": "Fushimi_Inari-taisha", "desc": "Thousands of vermilion torii gates climb the mountainside behind the shrine, donated over centuries by individuals and businesses seeking good fortune. A full hike to the summit takes two to three hours, though most visitors walk only the first, most densely gated section. The shrine is dedicated to Inari, the Shinto deity of rice and prosperity."}, {"name": "Mount Fuji & Hakone", "wiki": "Mount_Fuji", "desc": "Japan's tallest and most iconic peak, its near-perfect symmetrical cone visible on clear days from Hakone's lake and hot spring resorts. The Hakone Ropeway offers views over volcanic valleys and, weather permitting, Fuji itself without needing to climb. Traditional ryokan inns in the area pair mountain views with onsen hot spring bathing."}, {"name": "Dotonbori, Osaka", "wiki": "Dōtonbori", "desc": "A canal-side strip of oversized neon signs, including the famous running Glico Man, and some of the city's densest concentration of street food stalls. Osaka's reputation as Japan's food capital is on full display here, from takoyaki octopus balls to okonomiyaki savory pancakes. It's especially vivid after dark when the signs and crowds are at their peak."}, {"name": "Himeji Castle", "wiki": "Himeji_Castle", "desc": "Japan's best-preserved original feudal castle, its brilliant white plastered exterior earning it the nickname 'White Heron Castle'. Unlike many Japanese castles rebuilt after wartime destruction, Himeji's main keep survives largely intact from the 17th century. Its labyrinthine defensive layout, designed to confuse attackers, remains apparent to visitors walking through today."}, {"name": "Arashiyama Bamboo Grove, Kyoto", "wiki": "Arashiyama", "desc": "A dense grove of towering bamboo stalks creating a naturally filtered green light along a well-worn walking path. It sits within a wider district that includes a monkey park, riverside restaurants, and several notable temples. Early morning visits, before tour groups arrive, offer the closest thing to solitude in what is otherwise a popular stop."}], "itineraryDays": 10, "itinerary": [{"label": "Days 1–3", "title": "Tokyo", "desc": "Asakusa, Shibuya, and a day trip out to Kamakura or Nikko."}, {"label": "Day 4", "title": "Hakone", "desc": "Hot springs and views of Mount Fuji on the way toward Kyoto."}, {"label": "Days 5–7", "title": "Kyoto & Nara", "desc": "Temples, bamboo groves, and the deer park in Nara as a day trip."}, {"label": "Days 8–9", "title": "Osaka", "desc": "Dotonbori's food scene and a possible detour to Himeji Castle."}, {"label": "Day 10", "title": "Departure", "desc": "Return to Tokyo or fly out of Osaka's Kansai airport."}]}, {"id": "kuwait", "name": "Kuwait", "flag": "🇰🇼", "capital": "Kuwait City", "population": "4.3 million", "language": "Arabic", "currency": "Kuwaiti dinar", "bestTime": "November–March", "blurb": "Kuwait City is a compact, walkable stop built around its waterfront towers, old souq, and a strong museum scene reflecting its role in early Gulf trade and, more recently, its resilience after 1990.", "attractions": [{"name": "Kuwait Towers", "wiki": "Kuwait_Towers", "desc": "Three distinctive water towers along the Gulf coast, the tallest topped by a rotating observation deck and restaurant offering panoramic views of the city and sea. Completed in 1979, they've become the country's most recognizable symbol, appearing on currency and countless postcards. They're best visited in late afternoon as the light softens over the water."}, {"name": "Grand Mosque, Kuwait City", "wiki": "Grand_Mosque_(Kuwait)", "desc": "The largest mosque in the country, capable of holding tens of thousands of worshippers, with a prayer hall lit by a series of domed skylights. Guided tours are available for non-Muslim visitors outside prayer times, offering context on Islamic architecture and practice. Its scale and restrained, elegant design set it apart from more ornate mosques elsewhere in the Gulf."}, {"name": "Souq Al-Mubarakiya", "wiki": "Souk_Al-Mubarakiya", "desc": "One of the oldest markets in Kuwait, predating the discovery of oil, still trading spices, dates, textiles, and fresh produce much as it has for generations. Traditional restaurants tucked into its lanes serve some of the city's most authentic Kuwaiti food. It offers a direct contrast to the modern towers just blocks away."}, {"name": "Tareq Rajab Museum", "wiki": "Tareq_Rajab_Museum", "desc": "A private museum holding an extensive collection of Islamic art, including ceramics, jewelry, and calligraphy gathered over decades. Its manuscripts and metalwork collection is considered one of the finest in the region. The museum's more intimate, curated scale makes it an easy stop compared to larger national institutions."}, {"name": "Al Shaheed Park", "wiki": "Al_Shaheed_Park", "desc": "A large green space built along the old city wall line, combining gardens, walking paths, and a museum dedicated to Kuwait's history and the 1990 Gulf War. It offers a rare stretch of shaded, landscaped public space in the city center. Evening visits are popular once the desert heat has eased."}, {"name": "Failaka Island", "wiki": "Failaka_Island", "desc": "An island in Kuwait Bay with a layered history stretching back to ancient Mesopotamian trade routes, later scarred by its role as a front line during the 1990 Iraqi invasion. Abandoned villages and war-damaged buildings sit alongside archaeological remains from earlier civilizations. It's reached by ferry and makes for an unusual, reflective day trip from the capital."}], "itineraryDays": 4, "itinerary": [{"label": "Day 1", "title": "Kuwait Towers & the Corniche", "desc": "The waterfront towers and a walk along the Gulf-facing promenade."}, {"label": "Day 2", "title": "Old city & museums", "desc": "The Grand Mosque, Souq Al-Mubarakiya, and the Tareq Rajab Museum."}, {"label": "Day 3", "title": "Al Shaheed Park", "desc": "Gardens and the war history museum along the old city wall line."}, {"label": "Day 4", "title": "Failaka Island", "desc": "A ferry trip to see the island's layered ancient and modern history."}]}, {"id": "laos", "name": "Laos", "flag": "🇱🇦", "capital": "Vientiane", "population": "7.7 million", "language": "Lao", "currency": "Lao kip", "bestTime": "November–February", "blurb": "Laos moves at a noticeably slower pace than its neighbors, with a Mekong-side capital, misty mountain towns, and a French colonial legacy still visible in its cafes and architecture.", "attractions": [{"name": "Luang Prabang's old town", "wiki": "Luang_Prabang", "desc": "A UNESCO-listed town at the confluence of the Mekong and Nam Khan rivers, its streets lined with gilded temples and French colonial buildings. Each morning before dawn, rows of saffron-robed monks walk the streets collecting alms, a ritual visitors can watch respectfully from a distance. The town's night market and riverside cafes make evenings just as appealing."}, {"name": "Kuang Si Falls", "wiki": "Kuang_Si_Falls", "desc": "A multi-tiered waterfall outside Luang Prabang, its turquoise pools formed by limestone deposits and ideal for swimming between cascades. A steep trail climbs beside the falls to the main drop at the top. A bear rescue center at the entrance adds an easy stop before or after the hike."}, {"name": "Pak Ou Caves", "wiki": "Pak_Ou_Caves", "desc": "Two caves set into a limestone cliff above the Mekong, filled with thousands of Buddha statues left by pilgrims over centuries. The journey there by slow boat along the river is as much a part of the experience as the caves themselves. It's typically combined with a stop at a village known for producing lao-lao rice whisky."}, {"name": "Plain of Jars", "wiki": "Plain_of_Jars", "desc": "Thousands of massive stone jars, some over 2,000 years old, scattered across a plateau in northern Laos, their original purpose still debated by archaeologists. The area also carries a heavier history as one of the most heavily bombed regions during the Vietnam War, with ongoing unexploded ordnance clearance. Only cleared sites, marked by white and red stones, are safe to walk."}, {"name": "Vang Vieng's karst landscape", "wiki": "Vang_Vieng", "desc": "A small town surrounded by dramatic limestone karsts and the Nam Song River, once known primarily for a wilder party scene that has since calmed considerably. Hot air balloon rides at sunrise, cave exploring, and tubing down the river are now the main draws. The scenery here rivals better-known karst regions elsewhere in Southeast Asia."}, {"name": "That Luang, Vientiane", "wiki": "Pha_That_Luang", "desc": "A gold-covered Buddhist stupa considered the most important national monument in Laos, believed to enshrine a relic of the Buddha. Its stepped design carries deep religious symbolism, and it appears on the national emblem. The surrounding plaza hosts a major festival each November."}], "itineraryDays": 9, "itinerary": [{"label": "Days 1–3", "title": "Luang Prabang", "desc": "Alms-giving ceremony, Kuang Si Falls, and a slow boat to the Pak Ou Caves."}, {"label": "Day 4", "title": "Plain of Jars", "desc": "A short flight to see the ancient jar sites on cleared, marked paths."}, {"label": "Days 5–6", "title": "Vang Vieng", "desc": "Karst scenery, cave exploring, and a hot air balloon sunrise."}, {"label": "Days 7–9", "title": "Vientiane", "desc": "That Luang, the riverside promenade, and departure from the capital."}]}, {"id": "malaysia", "name": "Malaysia", "flag": "🇲🇾", "capital": "Kuala Lumpur", "population": "34 million", "language": "Malay", "currency": "Malaysian ringgit", "bestTime": "December–February", "blurb": "Malaysia splits naturally between Kuala Lumpur's modern skyline, the colonial streets and food of Penang, and the rainforest and reefs of Borneo further afield.", "attractions": [{"name": "Petronas Towers", "wiki": "Petronas_Towers", "desc": "Once the tallest buildings in the world, these twin towers remain Kuala Lumpur's defining landmark, connected by a skybridge on the 41st and 42nd floors. An observation deck near the top offers wide city views, best booked in advance given limited daily tickets. The surrounding KLCC park and mall make it easy to spend a full afternoon in the area."}, {"name": "Batu Caves", "wiki": "Batu_Caves", "desc": "A limestone hill riddled with cave temples dedicated to the Hindu god Murugan, reached by climbing 272 brightly painted steps guarded by a towering golden statue at the base. The main cave functions as an active place of worship, especially during the Thaipusam festival. It's a short trip from central Kuala Lumpur."}, {"name": "George Town, Penang", "wiki": "George_Town,_Penang", "desc": "A UNESCO-listed old port city known for its mix of Chinese, Malay, Indian, and colonial British architecture within a compact, walkable core. Street art, working clan jetties, and some of the country's best hawker food make it a favorite stop for a slower few days. Its food scene alone draws repeat visitors."}, {"name": "Cameron Highlands", "wiki": "Cameron_Highlands", "desc": "A cool mountain plateau covered in rolling tea plantations, strawberry farms, and patches of mossy forest, a sharp contrast to the tropical heat elsewhere in the country. Guided jungle walks pass through the Mossy Forest's stunted, lichen-draped trees. Tea estate tours and tastings are the main draw for most visitors."}, {"name": "Kinabalu National Park, Borneo", "wiki": "Kinabalu_National_Park", "desc": "Home to Mount Kinabalu, Southeast Asia's tallest peak outside the Himalayas, climbable over two days by most reasonably fit hikers with a permit and guide. The surrounding park also protects extraordinary biodiversity, including carnivorous pitcher plants found nowhere else. It's usually paired with a trip to see orangutans elsewhere in Sabah."}, {"name": "Semenggoh Wildlife Centre", "wiki": "Semenggoh_Wildlife_Centre", "desc": "A rehabilitation center in Sarawak, Borneo, where semi-wild orangutans that were once orphaned or injured return during scheduled feeding times. Sightings aren't guaranteed since the orangutans forage freely in surrounding forest, which adds to the appeal of seeing them in a genuinely wild-adjacent setting. It's one of the more accessible ways to see orangutans in Malaysian Borneo."}], "itineraryDays": 10, "itinerary": [{"label": "Days 1–3", "title": "Kuala Lumpur", "desc": "The Petronas Towers, Batu Caves, and the city's varied food scene."}, {"label": "Day 4", "title": "Cameron Highlands", "desc": "Tea plantations and a cool-climate break from the tropical lowlands."}, {"label": "Days 5–6", "title": "Penang", "desc": "George Town's old streets, street art, and hawker food."}, {"label": "Days 7–10", "title": "Borneo (Sabah/Sarawak)", "desc": "Orangutan sightings and, for the more ambitious, a climb of Mount Kinabalu."}]}, {"id": "oman", "name": "Oman", "flag": "🇴🇲", "capital": "Muscat", "population": "4.6 million", "language": "Arabic", "currency": "Omani rial", "bestTime": "October–April", "blurb": "Oman offers a calmer, more traditional alternative to its Gulf neighbors, with mountain wadis, a real desert, and a coastline still relatively undeveloped for tourism.", "attractions": [{"name": "Sultan Qaboos Grand Mosque, Muscat", "wiki": "Sultan_Qaboos_Grand_Mosque", "desc": "One of the few mosques in the Gulf region open to non-Muslim visitors, notable for a prayer hall carpet that was, at the time of its installation, the largest single piece in the world. Its main dome and minarets combine Islamic architectural styles from across the region. Modest dress, including a headscarf for women, is required."}, {"name": "Wahiba Sands", "wiki": "Wahiba_Sands", "desc": "A sea of orange dunes stretching toward the coast, home to Bedouin communities who still herd camels and goats across the desert. Overnight camps offer dune driving, camel treks, and clear night skies far from city light. It's a manageable day trip from Muscat or an overnight stop en route south."}, {"name": "Wadi Shab", "wiki": "Wadi_Shab", "desc": "A canyon of turquoise pools fed by mountain springs, reached by a walk and a short boat crossing before hiking between rock walls to a hidden cave with a waterfall. Swimming through narrow sections of the canyon is part of the appeal. It's one of the most popular wadis for a reason, so early arrival helps avoid crowds."}, {"name": "Jebel Akhdar", "wiki": "Jabal_Akhdar_(Oman)", "desc": "The 'Green Mountain', a high plateau in the Hajar range known for terraced rose and pomegranate farms clinging to the cliffs. Its elevation makes it noticeably cooler than the coast, a welcome break in summer months. Hiking trails wind along old village terraces with sweeping canyon views."}, {"name": "Nizwa Fort & Souq", "wiki": "Nizwa_Fort", "desc": "A 17th-century circular fort with a commanding tower, once a key defensive point for the interior region. Its Friday goat market and adjoining souq selling silver, dates, and pottery give a strong sense of traditional Omani trade life. It's a common stop en route to Jebel Akhdar."}, {"name": "Musandam Peninsula", "wiki": "Musandam_Governorate", "desc": "A dramatic exclave separated from the rest of Oman by UAE territory, where steep mountains plunge directly into the fjord-like waters of the Strait of Hormuz. Dhow cruises through the channels here are often compared to Norwegian fjords, complete with dolphin sightings. It requires a separate trip from the main Omani circuit."}], "itineraryDays": 8, "itinerary": [{"label": "Days 1–2", "title": "Muscat", "desc": "The Grand Mosque, old town corniche, and the Mutrah souq."}, {"label": "Day 3", "title": "Wadi Shab & the coast", "desc": "A canyon hike and swim en route toward the desert."}, {"label": "Days 4–5", "title": "Wahiba Sands", "desc": "An overnight desert camp with dune driving and camel treks."}, {"label": "Days 6–7", "title": "Nizwa & Jebel Akhdar", "desc": "The fort and souq, then up into the cool mountain terraces."}, {"label": "Day 8", "title": "Return to Muscat", "desc": "Drive back to the capital for departure."}]}, {"id": "qatar", "name": "Qatar", "flag": "🇶🇦", "capital": "Doha", "population": "2.9 million", "language": "Arabic", "currency": "Qatari riyal", "bestTime": "November–March", "blurb": "Doha works well as a short stopover or a focused city trip, pairing striking modern architecture with a restored old souq and an easy desert day trip.", "attractions": [{"name": "Museum of Islamic Art", "wiki": "Museum_of_Islamic_Art,_Doha", "desc": "Designed by architect I. M. Pei, this museum sits on its own reclaimed island along Doha's waterfront, its geometric limestone form deliberately evoking traditional Islamic architecture. Inside, the collection spans over a thousand years of Islamic art from three continents. The surrounding park is a popular spot for evening walks with skyline views."}, {"name": "Souq Waqif", "wiki": "Souq_Waqif", "desc": "A restored traditional market of narrow lanes selling spices, textiles, and falcons, alongside restaurants serving Qatari and regional Gulf cuisine. In the evening it becomes one of the liveliest parts of the city, with outdoor seating filling the alleys. It sits within easy walking distance of the Corniche waterfront."}, {"name": "The Pearl-Qatar", "wiki": "The_Pearl-Qatar", "desc": "An artificial island development of marinas, yacht-lined promenades, and Mediterranean-style architecture, built as a showcase of Qatar's rapid modernization. It offers a different, more polished contrast to the older Souq Waqif across town. Waterfront dining here is a popular evening activity."}, {"name": "Katara Cultural Village", "wiki": "Katara_Cultural_Village", "desc": "A purpose-built cultural district combining an amphitheater, art galleries, and a public beach along Doha's coast. It regularly hosts festivals and exhibitions showcasing both Qatari and international culture. The traditional architectural style throughout gives it a distinct identity from the glass towers nearby."}, {"name": "Inland Sea (Khor Al Adaid)", "wiki": "Khor_Al_Adaid", "desc": "A rare natural inlet where the sea cuts directly into the desert, reachable only by a dune-bashing 4x4 drive through Qatar's southern sand sea. The stark meeting of turquoise water and towering orange dunes makes it one of the country's most striking landscapes. Most visits combine it with a desert safari and overnight camp."}, {"name": "National Museum of Qatar", "wiki": "National_Museum_of_Qatar", "desc": "Designed to resemble a desert rose crystal formation, this museum traces Qatar's history from its Bedouin and pearl-diving past to its modern transformation. Interactive galleries and immersive films fill its interlocking discs. The building itself, wrapping around the historic Amiri Palace, is as much a draw as the exhibits."}], "itineraryDays": 4, "itinerary": [{"label": "Day 1", "title": "Doha waterfront", "desc": "The Museum of Islamic Art and a Corniche walk into Souq Waqif for dinner."}, {"label": "Day 2", "title": "National Museum & Katara", "desc": "The desert rose museum, then Katara Cultural Village along the coast."}, {"label": "Day 3", "title": "Inland Sea desert safari", "desc": "A dune-bashing 4x4 trip to the Inland Sea, with an overnight desert camp."}, {"label": "Day 4", "title": "The Pearl-Qatar", "desc": "A relaxed final day around the marina before departure."}]}, {"id": "singapore", "name": "Singapore", "flag": "🇸🇬", "capital": "Singapore", "population": "5.9 million", "language": "English, Malay, Mandarin, Tamil", "currency": "Singapore dollar", "bestTime": "February–April", "blurb": "Singapore packs an efficient, walkable mix of colonial architecture, ethnic neighborhoods, and futuristic gardens into a city small enough to properly cover in a few days.", "attractions": [{"name": "Gardens by the Bay", "wiki": "Gardens_by_the_Bay", "desc": "A futuristic park dominated by Supertrees, towering vertical gardens that light up after dark in a choreographed show visible for free from the surrounding walkways. Two climate-controlled domes recreate cooler, Mediterranean and cloud-forest environments, home to plants that couldn't otherwise survive the tropical heat. It sits directly beside Marina Bay Sands, making both an easy combined visit."}, {"name": "Marina Bay Sands SkyPark", "wiki": "Marina_Bay_Sands", "desc": "Three towers topped by a single, ship-shaped platform holding an infinity pool and observation deck with sweeping views over the city and harbor. Even without a hotel stay, the observation deck is open to the public for a fee. The building's silhouette has become as recognizable a symbol of Singapore as the Merlion."}, {"name": "Chinatown & Sri Mariamman Temple", "wiki": "Chinatown,_Singapore", "desc": "A dense historic district of shophouses, incense-filled temples, and street food stalls, anchored by the colorful Sri Mariamman Temple, Singapore's oldest Hindu temple. The nearby Buddha Tooth Relic Temple adds a very different architectural style just streets away. Evening food markets here are a good introduction to Singaporean hawker culture."}, {"name": "Little India", "wiki": "Little_India,_Singapore", "desc": "A vibrant district of spice shops, garland stalls, and the ornate Sri Veeramakaliamman Temple, offering a sensory contrast to Singapore's more polished districts. It's especially lively during Hindu festivals like Deepavali, when the streets are strung with lights. Tekka Centre nearby is a well-regarded spot for South Indian food."}, {"name": "Singapore Zoo & Night Safari", "wiki": "Singapore_Zoo", "desc": "Consistently rated among the world's best zoos for its open, naturalistic enclosures that minimize visible barriers between visitors and animals. The adjoining Night Safari, the world's first nocturnal wildlife park, lets visitors walk or ride past active nocturnal animals after dark. Both are set within the same forested reserve outside the city center."}, {"name": "Sentosa Island", "wiki": "Sentosa", "desc": "A resort island connected to the mainland by cable car, monorail, or a short causeway, home to beaches, Universal Studios Singapore, and a large aquarium. It functions as Singapore's main leisure and theme park hub, distinct from the more culturally focused city center. A cable car ride over the harbor is worthwhile even without visiting the attractions below."}], "itineraryDays": 5, "itinerary": [{"label": "Day 1", "title": "Marina Bay", "desc": "Gardens by the Bay, the Supertree light show, and the Marina Bay Sands SkyPark."}, {"label": "Day 2", "title": "Chinatown & Little India", "desc": "Temples, shophouses, and hawker food across two of the city's most distinct districts."}, {"label": "Day 3", "title": "Singapore Zoo & Night Safari", "desc": "A full day and evening among naturalistic enclosures and nocturnal wildlife."}, {"label": "Days 4–5", "title": "Sentosa Island", "desc": "Beaches and theme parks to close the trip on a lighter note."}]}, {"id": "thailand", "name": "Thailand", "flag": "🇹🇭", "capital": "Bangkok", "population": "72 million", "language": "Thai", "currency": "Thai baht", "bestTime": "November–February", "blurb": "Thailand splits cleanly into three trips in one: Bangkok's energy, the north's temples and mountains, and the south's islands.", "attractions": [{"name": "Grand Palace, Bangkok", "wiki": "Grand_Palace", "desc": "The former royal residence, its ornate spires and gilded surfaces still used for state ceremonies despite the king no longer living there. Wat Phra Kaew within the complex houses the revered Emerald Buddha, actually carved from jade, dressed in seasonal robes changed by the king three times a year. Modest dress covering shoulders and knees is strictly enforced."}, {"name": "Old City temples, Chiang Mai", "wiki": "Chiang_Mai", "desc": "Wat Phra Singh and Wat Chedi Luang sit within the moated old town, their weathered brick chedis and gold-leafed Buddha images reflecting centuries as the capital of the former Lanna kingdom. A generally slower, more relaxed pace than Bangkok makes it a favorite base for longer stays. The surrounding mountains add cooler air and hiking options rarely found in the south."}, {"name": "Phi Phi Islands", "wiki": "Phi_Phi_Islands", "desc": "Limestone cliffs rising dramatically from turquoise water, best reached by longtail boat from Krabi or Phuket for day trips or overnight stays. Maya Bay, made famous by the film The Beach, now enforces visitor limits and closed hours to allow coral recovery. Snorkeling and diving here rank among the most scenic in Thailand."}, {"name": "Ayutthaya", "wiki": "Ayutthaya_Historical_Park", "desc": "Ruins of the former Siamese capital, destroyed by Burmese invasion in the 18th century, its brick chedis and Buddha statues, including one famously entwined in tree roots, scattered across a well-preserved historical park. It served as one of the most important trading cities in Southeast Asia before its fall. It's an easy day trip from Bangkok by train or boat."}, {"name": "Railay Beach", "wiki": "Railay_Beach", "desc": "A peninsula accessible only by boat due to surrounding limestone cliffs, making it feel like an island despite being connected to the mainland. It's become a major destination for rock climb
