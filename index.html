nturies-old customs continue much as they have for generations on these unusual man-made islands. The lake's deep blue color and thin, high-altitude air give the whole area a distinct atmosphere."}], "itineraryDays": 9, "itinerary": [{"label": "Days 1–2", "title": "Lima", "desc": "Miraflores and Barranco, with a focus on the city's food scene."}, {"label": "Days 3–5", "title": "Sacred Valley", "desc": "Pisac, Ollantaytambo, and acclimatizing to the altitude."}, {"label": "Days 6–7", "title": "Machu Picchu", "desc": "Train to Aguas Calientes and an early entry to the citadel."}, {"label": "Days 8–9", "title": "Cusco & Rainbow Mountain", "desc": "City sights and the high-altitude hike before departure."}]}]}, {"id": "oceania", "name": "Oceania", "tagline": "Reefs, red desert, and islands spread wide across the Pacific", "color": "#7A4E5C", "countries": [{"id": "australia", "name": "Australia", "flag": "🇦🇺", "capital": "Canberra", "population": "26 million", "language": "English", "currency": "Australian dollar", "bestTime": "September–November, March–May", "blurb": "Australia's distances mean most trips fly between regions, pairing a city, the Red Centre, and the reef in one loop.", "attractions": [{"name": "Sydney Opera House & Harbour", "wiki": "Sydney_Opera_House", "desc": "The building's distinctive sail-like shells, completed in 1973 after a construction saga spanning over a decade, have become the single most recognizable symbol of Australia. Best seen from a ferry crossing the harbour, with the Harbour Bridge climb nearby offering an optional, more adventurous way to see the same skyline from above. Performances inside range from opera to contemporary concerts across several distinct venues within the complex."}, {"name": "Great Barrier Reef", "wiki": "Great_Barrier_Reef", "desc": "The world's largest coral reef system, stretching over 2,300 kilometers and visible even from space, supports an extraordinary diversity of marine life despite ongoing threats from warming ocean temperatures. Snorkeling and diving trips run from Cairns and Port Douglas, with liveaboard boats offering access to less-visited outer reef sections. Even a single day trip typically reveals sea turtles, reef sharks, and vividly colored coral formations."}, {"name": "Uluru", "wiki": "Uluru", "desc": "A massive sandstone monolith sacred to the local Anangu people, who ask visitors not to climb it out of respect for its spiritual significance, a request now formally enforced. The rock's color shifts dramatically at sunrise and sunset, from deep red to glowing orange. A base walk circling the entire formation reveals ancient rock art and water holes significant to Anangu culture and history."}, {"name": "Great Ocean Road", "wiki": "Great_Ocean_Road", "desc": "A coastal drive from Melbourne passing the Twelve Apostles, dramatic limestone stacks rising from the Southern Ocean, their number having dwindled over time due to ongoing erosion. The full drive can be done in a long day but rewards a slower two- to three-day pace with stops at surf towns and rainforest walks along the way. Wildlife spotting, including koalas in the wild, is common in sections of the route."}, {"name": "Whitsunday Islands", "wiki": "Whitsunday_Islands", "desc": "A group of 74 islands off the Queensland coast, home to Whitehaven Beach, whose exceptionally pure silica sand stays cool even in the tropical heat. Sailing trips between the islands offer access to secluded anchorages and excellent snorkeling within the wider Great Barrier Reef Marine Park. It's a popular add-on for travelers already heading to Cairns or the reef."}, {"name": "Bondi Beach, Sydney", "wiki": "Bondi_Beach", "desc": "One of the most famous urban beaches in the world, its consistent surf and the scenic Bondi to Coogee coastal walk making it a favorite for both locals and visitors. An ocean pool carved into the rocks at the beach's southern end offers calmer swimming than the open surf. The surrounding cafe and market scene keeps the area lively well beyond the beach itself."}], "itineraryDays": 12, "itinerary": [{"label": "Days 1–3", "title": "Sydney", "desc": "The Opera House, Harbour Bridge, and Bondi to Coogee coastal walk."}, {"label": "Days 4–5", "title": "Great Ocean Road", "desc": "Fly to Melbourne and drive the coast to the Twelve Apostles."}, {"label": "Days 6–8", "title": "Uluru", "desc": "Sunset and sunrise viewings, plus a walk around the base."}, {"label": "Days 9–12", "title": "Cairns & the reef", "desc": "Snorkeling trips out to the Great Barrier Reef, with a rainforest day in the Daintree."}]}, {"id": "fiji", "name": "Fiji", "flag": "🇫🇯", "capital": "Suva", "population": "940,000", "language": "English, Fijian, Fiji Hindi", "currency": "Fijian dollar", "bestTime": "May–October", "blurb": "Fiji works well as a slower trip: a few island stops for snorkeling, with villages and waterfalls just off the resort strip.", "attractions": [{"name": "Mamanuca Islands", "wiki": "Mamanuca_Islands", "desc": "A cluster of small islands off Nadi known for snorkeling and easy resort day trips, several having served as filming locations for the reality show Survivor and the film Cast Away. Clear, calm lagoon waters make them well suited to first-time snorkelers and families. Ferries and boat transfers from Nadi make island-hopping between several in a single day entirely feasible."}, {"name": "Coral Coast", "wiki": "Coral_Coast", "desc": "Village visits and cultural tours line Viti Levu's southern shore, offering a more grounded, community-based counterpoint to the outer island resorts. Traditional Fijian villages here often welcome respectful visitors for kava ceremonies and demonstrations of local customs. The coastline itself alternates between sandy beaches and rockier volcanic stretches."}, {"name": "Sigatoka Sand Dunes", "wiki": "Sigatoka_Sand_Dunes_National_Park", "desc": "Wind-shaped dunes at the mouth of the Sigatoka River, some rising over 60 meters, have also revealed archaeological pottery finds dating back nearly 2,600 years. Walking trails cross both the dune system and adjacent forest, offering views over the river mouth and ocean. It's Fiji's first national park and a notable geological contrast to the country's more typical tropical scenery."}, {"name": "Taveuni waterfalls", "wiki": "Taveuni", "desc": "Known as the 'Garden Island' for its lush rainforest and volcanic soil, Taveuni's Bouma National Heritage Park protects a series of waterfalls, including one with a natural pool suitable for swimming beneath the falls. The island also sits directly on the 180th meridian, allowing visitors to stand in two calendar days at once at a small monument. Its surrounding reefs are considered some of the best diving in Fiji."}, {"name": "Kava ceremony experiences", "wiki": "Kava_culture", "desc": "A traditional ceremonial drink made from the ground root of the kava plant, central to Fijian social and diplomatic customs for centuries. Visitors invited to participate typically clap once before receiving the bowl and drink it in a single go, followed by a communal clap in response. It offers a genuine, low-key way to engage with local culture beyond typical resort activities."}, {"name": "Beqa Lagoon shark diving", "wiki": "Beqa_Lagoon", "desc": "One of the world's most renowned shark diving sites, where several species including bull sharks and occasionally tiger sharks gather at close range under controlled, guided conditions. The dive site has become a significant driver of local marine conservation efforts, funded partly through dive tourism revenue. It's considered a serious dive for experienced divers rather than a casual snorkeling activity."}], "itineraryDays": 7, "itinerary": [{"label": "Days 1–3", "title": "Mamanuca Islands", "desc": "Snorkeling and beach time based on one of the smaller islands off Nadi."}, {"label": "Days 4–5", "title": "Coral Coast", "desc": "Village visits and a stop at the Sigatoka sand dunes."}, {"label": "Days 6–7", "title": "Taveuni", "desc": "A flight to the Garden Island for diving and waterfall hikes."}]}, {"id": "new-zealand", "name": "New Zealand", "flag": "🇳🇿", "capital": "Wellington", "population": "5.2 million", "language": "English, Māori", "currency": "New Zealand dollar", "bestTime": "December–February", "blurb": "New Zealand's two islands split naturally: the North Island's geothermal and film-set landscapes, the South Island's mountains and fjords.", "attractions": [{"name": "Milford Sound", "wiki": "Milford_Sound", "desc": "A fjord in Fiordland reached by one of New Zealand's most scenic drives, its sheer cliffs and cascading waterfalls, including the towering Stirling Falls, best seen by boat cruise. Rain, common in the area, actually enhances the experience by triggering temporary waterfalls down the cliff faces. Rudyard Kipling once called it the eighth wonder of the world, a description that has stuck in local tourism ever since."}, {"name": "Hobbiton", "wiki": "Hobbiton_Movie_Set", "desc": "The Lord of the Rings and Hobbit film set, built on a working sheep farm in the Waikato region, was kept intact after filming and gradually rebuilt in more permanent materials for ongoing tours. Guided walks pass by hobbit holes, the Green Dragon Inn, where a drink is included with most tours, and the party tree from the films. Its rural, rolling green setting matches the on-screen Shire remarkably closely."}, {"name": "Queenstown", "wiki": "Queenstown,_New_Zealand", "desc": "The country's adventure sports hub, where commercial bungee jumping was pioneered in the 1980s and remains a signature activity alongside jet boating and skydiving. Lake Wakatipu's dramatic mountain backdrop makes even a simple lakeside walk feel scenic. Nearby Milford and Doubtful Sounds are commonly visited as day trips from town."}, {"name": "Rotorua", "wiki": "Rotorua", "desc": "Geothermal geysers, bubbling mud pools, and a distinct sulfur smell define this North Island town, sitting atop an active volcanic zone. Māori cultural performances and traditional hangi feasts, food cooked in an earth oven, offer insight into New Zealand's indigenous culture. Wai-O-Tapu's colorful geothermal pools rank among the most photographed geothermal features in the country."}, {"name": "Tongariro Alpine Crossing", "wiki": "Tongariro_Alpine_Crossing", "desc": "Often ranked among the best one-day hikes in the world, this crossing traverses volcanic craters, emerald-colored lakes, and the peak used as Mount Doom in the Lord of the Rings films. The roughly 19-kilometer route requires a full day and reasonable fitness, with weather on the exposed sections changing quickly. Shuttle services typically handle the one-way logistics between start and end points."}, {"name": "Franz Josef & Fox Glaciers", "wiki": "Franz_Josef_Glacier", "desc": "Two glaciers on the South Island's West Coast, unusual for descending nearly to sea level through temperate rainforest, a rare combination found in few places on Earth. Helicopter tours allow landing directly on the ice for guided walks, since the glaciers have retreated too far for easy access on foot. Their proximity to both the coast and the Southern Alps makes for dramatic, varied scenery in a small area."}], "itineraryDays": 10, "itinerary": [{"label": "Days 1–3", "title": "Auckland, Hobbiton & Rotorua", "desc": "The film set, followed by geothermal parks and a cultural evening in Rotorua."}, {"label": "Days 4–5", "title": "Wellington", "desc": "The capital's museums and cable car before flying south."}, {"label": "Days 6–8", "title": "Queenstown", "desc": "Lake cruises and adventure activities based in the South Island's adrenaline hub."}, {"label": "Days 9–10", "title": "Milford Sound", "desc": "A scenic drive through Fiordland for a fjord cruise to close the trip."}]}, {"id": "vanuatu", "name": "Vanuatu", "flag": "🇻🇺", "capital": "Port Vila", "population": "330,000", "language": "Bislama, English, French", "currency": "Vanuatu vatu", "bestTime": "April–October", "blurb": "Vanuatu's main draw is Tanna's active volcano, an easy add-on to a beach stay near Port Vila or Espiritu Santo.", "attractions": [{"name": "Mount Yasur, Tanna", "wiki": "Mount_Yasur", "desc": "One of the most accessible active volcanoes in the world, its viewing platforms sitting close enough to the crater rim to feel the ground shake and hear the roar of eruptions directly. It has been almost continuously active for at least 800 years, making it a reliable, if unpredictable, natural spectacle. Evening visits offer the most dramatic view, as glowing lava becomes visible against the darkening sky."}, {"name": "Champagne Beach, Espiritu Santo", "wiki": "Champagne_Beach,_Vanuatu", "desc": "A wide crescent of powder-white sand and clear turquoise water often ranked among the best beaches in the South Pacific. Its name comes from the fizzing bubbles that rise through the sand in certain spots at low tide. It remains relatively undeveloped, with just a few small local stalls rather than large resort infrastructure."}, {"name": "The Blue Holes", "wiki": "Espiritu_Santo", "desc": "Freshwater swimming holes scattered around Espiritu Santo, their vivid turquoise color a result of exceptionally clear, mineral-filtered water. Riverbank rope swings at several of the holes add a playful element to what is otherwise a peaceful swimming spot. They offer a refreshing freshwater contrast to the island's saltwater beaches and diving sites."}, {"name": "Port Vila markets", "wiki": "Port_Vila", "desc": "A produce and handicraft market that anchors the capital's waterfront, selling fresh tropical fruit, kava, and woven goods from vendors representing Vanuatu's many islands and language groups. The town itself, wrapped around a natural harbour, offers a relaxed introduction to the country before heading to more remote islands. It remains the main transport hub for onward travel throughout the archipelago."}, {"name": "SS President Coolidge wreck diving", "wiki": "SS_President_Coolidge", "desc": "One of the world's largest and most accessible shipwreck dives, a former luxury liner turned troop transport that sank just off Espiritu Santo in 1942 after striking mines. Divers can explore multiple decks, including cargo holds still containing jeeps, guns, and personal effects from World War II. Its accessibility from shore, combined with the wreck's scale, has made it a bucket-list site for wreck diving enthusiasts."}, {"name": "Pentecost Island land diving", "wiki": "Naghol", "desc": "The origin of modern bungee jumping, this traditional ritual involves young men leaping from tall wooden towers with only vines tied to their ankles, performed each year as part of a yam harvest ceremony. It's considered a rite of passage and remains deeply tied to local custom rather than staged purely for visitors. Access requires travel to Pentecost Island specifically during the April to June ceremonial season."}], "itineraryDays": 6, "itinerary": [{"label": "Days 1–2", "title": "Port Vila", "desc": "Markets, waterfront cafes, and a day trip to nearby Efate beaches."}, {"label": "Days 3–4", "title": "Tanna", "desc": "A flight to see Mount Yasur's eruptions up close, ideally at dusk."}, {"label": "Days 5–6", "title": "Espiritu Santo", "desc": "Champagne Beach and the Blue Holes to close the trip."}]}]}];

/* ---------- Wikipedia thumbnail (fetched at runtime, cached in-memory) ---------- */
const wikiImageCache = {};
function AttractionImage({ title, alt }) {
  const [state, setState] = useState(wikiImageCache[title] ? "done" : "loading");
  const [src, setSrc] = useState(wikiImageCache[title] || null);

  useEffect(() => {
    let cancelled = false;
    if (wikiImageCache[title] !== undefined) {
      setSrc(wikiImageCache[title]);
      setState(wikiImageCache[title] ? "done" : "empty");
      return;
    }
    fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title))
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        if (cancelled) return;
        const url = data && data.thumbnail && data.thumbnail.source ? data.thumbnail.source : null;
        wikiImageCache[title] = url;
        setSrc(url);
        setState(url ? "done" : "empty");
      })
      .catch(() => {
        if (cancelled) return;
        wikiImageCache[title] = null;
        setState("empty");
      });
    return () => { cancelled = true; };
  }, [title]);

  if (state === "loading") {
    return <div className="wp-attraction-img wp-attraction-img-loading" />;
  }
  if (state === "empty" || !src) {
    return (
      <div className="wp-attraction-img wp-attraction-img-empty">
        <ImageOff size={18} style={{ color: "#c9bfa6" }} />
      </div>
    );
  }
  return <img className="wp-attraction-img" src={src} alt={alt} loading="lazy" />;
}

        .wp-about-note { font-size: 0.82rem; color: var(--ink-soft); font-style: italic; }

        .wp-newsletter-card { background: #fff; border: 1px solid var(--hairline); border-radius: 4px; padding: 1.2rem; max-width: 480px; }

        .wp-coming-soon { text-align: center; padding: 2.5rem 1rem 1rem; }
        .wp-coming-soon-visual { width: 170px; margin: 0 auto; }
        .wp-soon-svg { width: 100%; height: auto; display: block; }
      `}</style>

      <div className="wp-shell">
        <nav className="wp-nav">
          <button className="wp-nav-brand" onClick={goToContinents}>
            <div className="wp-brand-mark" style={{ width: 24, height: 24 }}><Compass size={13} style={{ color: "#F3EDE0" }} /></div>
            Waypoint
          </button>
          <div className="wp-nav-links">
            <button className={"wp-nav-link" + ((view === "continents" || view === "countries" || view === "detail") ? " wp-nav-link-active" : "")} onClick={goToContinents}>Home</button>
            <button className={"wp-nav-link" + (view === "articles" ? " wp-nav-link-active" : "")} onClick={() => setView("articles")}>Articles</button>
            <button className={"wp-nav-link" + (view === "products" ? " wp-nav-link-active" : "")} onClick={() => setView("products")}>Products</button>
            <button className={"wp-nav-link" + (view === "newsletter" ? " wp-nav-link-active" : "")} onClick={() => setView("newsletter")}>Newsletter</button>
            <button className={"wp-nav-link" + (view === "about" ? " wp-nav-link-active" : "")} onClick={() => setView("about")}>About me</button>
          </div>
        </nav>

        {view === "continents" && (
          <div className="wp-hero">
            <div className="wp-hero-text">
              <div className="wp-brand">
                <div className="wp-brand-mark"><Compass size={16} style={{ color: "#F3EDE0" }} /></div>
                <h1 className="wp-title">Waypoint</h1>
              </div>
              <p className="wp-tagline">Explore the world one continent at a time — pick a place, and find what to see and how many days to give it.</p>
            </div>
            <div className="wp-hero-visual"><HeroIllustration /></div>
          </div>
        )}

        {view !== "continents" && (
          <div className="wp-header" style={{ marginBottom: "1.6rem" }}>
            <div className="wp-brand">
              <div className="wp-brand-mark"><Compass size={16} style={{ color: "#F3EDE0" }} /></div>
              <h1 className="wp-title" style={{ fontSize: "1.4rem" }}>Waypoint</h1>
            </div>
          </div>
        )}

        {view === "continents" && (
          <div className="wp-continent-grid">
            {CONTINENTS.map((c) => (
              <button key={c.id} className="wp-continent-tile" style={{ "--tile-color": c.color }} onClick={() => goToCountries(c.id)}>
                <div className="wp-continent-name">{c.name}</div>
                <div className="wp-continent-tagline">{c.tagline}</div>
                <div className="wp-continent-count">{c.countries.length} countries</div>
              </button>
            ))}
          </div>
        )}

        {view === "countries" && continent && (
          <div>
            <button className="wp-back" onClick={goToContinents}><ArrowLeft size={15} /> All continents</button>
            <h2 className="wp-section-title" style={{ marginBottom: "1.1rem" }}>{continent.name}</h2>
            {continent.countries.map((cty) => (
              <button key={cty.id} className="wp-country-row" style={{ "--row-color": continent.color }} onClick={() => goToDetail(cty)}>
                <div>
                  <div className="wp-country-name"><span>{cty.flag}</span>{cty.name}</div>
                  <div className="wp-country-capital">Capital: {cty.capital}</div>
                </div>
                <ChevronRight size={18} style={{ color: "#8a8272", flexShrink: 0 }} />
              </button>
            ))}
          </div>
        )}

        {view === "detail" && continent && country && (
          <div>
            <button className="wp-back" onClick={() => setView("countries")}><ArrowLeft size={15} /> {continent.name}</button>

            <div className="wp-detail-hero">
              <h2 className="wp-detail-name"><span>{country.flag}</span>{country.name}</h2>
              <div className="wp-detail-sub">{country.capital} · {continent.name}</div>
            </div>

            <div className="wp-stat-grid">
              <StatBlock icon={Users} label="Population" value={country.population} accent={continent.color} />
              <StatBlock icon={Languages} label="Language" value={country.language} accent={continent.color} />
              <StatBlock icon={Coins} label="Currency" value={country.currency} accent={continent.color} />
              <StatBlock icon={CalendarClock} label="Best time to visit" value={country.bestTime} accent={continent.color} />
            </div>

            <p className="wp-blurb">{country.blurb}</p>

            <h3 className="wp-section-title">Top attractions</h3>
            <div style={{ marginBottom: "1.9rem" }}>
              {country.attractions.map((a, i) => (
                <div className="wp-attraction" key={i}>
                  <AttractionImage title={a.wiki} alt={a.name} />
                  <div className="wp-attraction-body">
                    <div className="wp-attraction-name">{a.name}</div>
                    <div className="wp-attraction-desc">{a.desc}</div>
                  </div>
                </div>
              ))}
            </div>

            <div className="wp-itinerary-wrap">
              <div className="wp-itinerary-head">
                <h3 className="wp-section-title" style={{ marginBottom: 0 }}>Suggested itinerary</h3>
                <span className="wp-itinerary-total">{country.itineraryDays} days</span>
              </div>
              {country.itinerary.map((step, i) => (
                <div className="wp-day" style={{ "--accent-color": continent.color }} key={i}>
                  <div className="wp-day-label">{step.label}</div>
                  <div>
                    <div className="wp-day-title">{step.title}</div>
                    <div className="wp-day-desc">{step.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {view === "articles" && (
          <div className="wp-coming-soon">
            <div className="wp-coming-soon-visual"><ComingSoonIllustration /></div>
            <h2 className="wp-section-title" style={{ marginTop: "1rem" }}>Articles</h2>
            <p className="wp-blurb" style={{ margin: "0 auto", textAlign: "center" }}>Long-form guides, itineraries, and travel notes are on their way — check back soon.</p>
          </div>
        )}

        {view === "products" && (
          <div className="wp-coming-soon">
            <div className="wp-coming-soon-visual"><ProductsComingSoonIllustration /></div>
            <h2 className="wp-section-title" style={{ marginTop: "1rem" }}>Products</h2>
            <p className="wp-blurb" style={{ margin: "0 auto", textAlign: "center" }}>Downloadable guides, packing lists, and planning tools are on their way — check back soon.</p>
          </div>
        )}

        {view === "about" && (
          <div className="wp-about">
            <h2 className="wp-section-title">About me</h2>
            <div className="wp-about-top">
              <div className="wp-about-photo" aria-hidden="true"><Compass size={28} style={{ color: "#8a8272" }} /></div>
              <div>
                <p className="wp-about-bio">Hi, I'm the person behind Waypoint. I built this as a simple, ad-free way to explore the world one country at a time — the kind of resource I always wished existed when planning my own trips. Every entry here is something I've researched carefully, from where to go to how many days to give it.</p>
                <p className="wp-about-bio">When I'm not adding new destinations to the site, I'm usually planning the next trip myself. If you want to follow along or get travel notes straight to your inbox, the newsletter is the best way to stay in touch.</p>
              </div>
            </div>
            <p className="wp-about-note">— Replace this text with your own bio, a real photo, and links to your social channels.</p>
          </div>
        )}

        {view === "newsletter" && (
          <div className="wp-newsletter">
            <h2 className="wp-section-title">Newsletter</h2>
            <p className="wp-blurb">Get a new destination in your inbox every week — real itinerary ideas and travel notes, no spam.</p>
            <div className="wp-newsletter-card">
              {/* Replace the src below with your own embed URL from Beehiiv: Grow -> Subscribe Forms -> Embed */}
              <iframe
                src="https://embeds.beehiiv.com/YOUR_PUBLICATION_ID"
                data-test-id="beehiiv-embed"
                width="100%"
                height="320"
                frameBorder="0"
                scrolling="no"
                style={{ borderRadius: "4px", border: "1px solid #DCD3BE", background: "transparent" }}
              ></iframe>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Waypoint />);

</script>
</body>
</html>
