ers, with hundreds of bolted routes directly above the beach. Several distinct beaches here range from lively to nearly deserted, all within a short walk."}, {"name": "Wat Arun, Bangkok", "wiki": "Wat_Arun", "desc": "The Temple of Dawn sits directly on the Chao Phraya River, its central spire decorated with thousands of pieces of colorful Chinese porcelain that catch the light distinctively at sunset. Steep steps allow a partial climb for river views. A short ferry crossing from the older side of the river makes it an easy addition to a day exploring the Grand Palace area."}], "itineraryDays": 9, "itinerary": [{"label": "Days 1–3", "title": "Bangkok & Ayutthaya", "desc": "The Grand Palace, riverside temples, and a day trip to the ruined former capital."}, {"label": "Days 4–5", "title": "Chiang Mai", "desc": "Old city temples and an ethical elephant sanctuary in the surrounding hills."}, {"label": "Days 6–9", "title": "Krabi & Phi Phi", "desc": "Island-hopping by longtail boat, with time to dive or just swim."}]}, {"id": "uae", "name": "United Arab Emirates", "flag": "🇦🇪", "capital": "Abu Dhabi", "population": "9.9 million", "language": "Arabic", "currency": "UAE dirham", "bestTime": "November–March", "blurb": "Dubai and Abu Dhabi cover very different sides of the same country: one built around record-breaking modern spectacle, the other around cultural institutions and a calmer pace.", "attractions": [{"name": "Burj Khalifa, Dubai", "wiki": "Burj_Khalifa", "desc": "The tallest building in the world, its observation decks on the 124th, 125th, and 148th floors offering views that stretch to the desert on clear days. The surrounding Dubai Mall and choreographed fountain show add a full evening's worth of activity at its base. Booking sunset or evening slots in advance is strongly recommended."}, {"name": "Sheikh Zayed Grand Mosque, Abu Dhabi", "wiki": "Sheikh_Zayed_Mosque", "desc": "One of the largest mosques in the world, its white marble domes and minarets, gold-detailed chandeliers, and the world's largest single hand-knotted carpet make it a genuine architectural landmark. It's open to visitors of all faiths, with modest dress provided if needed. Visiting near sunset, when the marble catches the light, is especially striking."}, {"name": "Dubai's Old Town & Al Fahidi", "wiki": "Al_Fahidi_Historical_Neighbourhood", "desc": "A restored historic quarter of wind-tower architecture along Dubai Creek, offering a rare glimpse of the city before its modern transformation. Abra boat crossings, gold and spice souks, and small museums fill the surrounding lanes. It's a useful counterpoint to the city's newer, taller districts."}, {"name": "Louvre Abu Dhabi", "wiki": "Louvre_Abu_Dhabi", "desc": "A museum built under an agreement with the French Louvre, its most striking feature a vast dome of interlaced geometric patterns that casts a 'rain of light' effect onto the galleries below. The collection deliberately places art and artifacts from different civilizations side by side to highlight shared human themes. Its waterfront setting on Saadiyat Island adds to the atmosphere."}, {"name": "Dubai Desert Conservation Reserve", "wiki": "Dubai_Desert_Conservation_Reserve", "desc": "A protected area of red dunes just outside the city, offering dune drives, camel treks, and falconry displays alongside desert wildlife like the Arabian oryx. Overnight camps here mix Bedouin-style dining with stargazing far from city light. It's a common and easy half-day or overnight escape from Dubai's density."}, {"name": "Jumeirah Beach & Burj Al Arab", "wiki": "Burj_Al_Arab", "desc": "Dubai's sail-shaped hotel, one of the most recognizable buildings in the world, sits just offshore from the public beaches along Jumeirah. While the hotel itself is largely reserved for guests, its silhouette along the coastline is a defining part of any Dubai beach day. Sunset views from the public beach are free and reliably good."}], "itineraryDays": 8, "itinerary": [{"label": "Days 1–4", "title": "Dubai", "desc": "Burj Khalifa, Al Fahidi's old town, Jumeirah Beach, and a desert safari."}, {"label": "Days 5–7", "title": "Abu Dhabi", "desc": "The Sheikh Zayed Grand Mosque and the Louvre Abu Dhabi."}, {"label": "Day 8", "title": "Departure", "desc": "Fly out of Abu Dhabi or Dubai."}]}, {"id": "vietnam", "name": "Vietnam", "flag": "🇻🇳", "capital": "Hanoi", "population": "99 million", "language": "Vietnamese", "currency": "Vietnamese dong", "bestTime": "February–April", "blurb": "A north-to-south route down Vietnam moves from limestone bays to lantern-lit old towns to the Mekong Delta's canals.", "attractions": [{"name": "Ha Long Bay", "wiki": "Ha_Long_Bay", "desc": "An overnight boat cruise among thousands of limestone karsts rising from the emerald water, many riddled with caves large enough to explore by kayak. The bay's formations, shaped over 500 million years, have inspired countless local legends involving descending dragons. Cruises typically include kayaking, cave visits, and a night anchored among the karsts."}, {"name": "Hoi An Ancient Town", "wiki": "Hội_An", "desc": "A lantern-lit old town best visited on foot, its Japanese covered bridge and merchant houses reflecting centuries as an international trading port. On the 14th day of each lunar month, the town switches off electric lighting entirely in favor of lanterns for a citywide festival. It's also renowned for same-day tailored clothing, a local specialty for visitors."}, {"name": "Cu Chi Tunnels", "wiki": "Củ_Chi_tunnels", "desc": "A vast underground tunnel network near Ho Chi Minh City used by Viet Cong fighters during the Vietnam War, complete with living quarters, hospitals, and kitchens designed to vent smoke undetected. Sections have been widened for tourists to crawl through, giving a visceral sense of the cramped conditions. Guides, often with personal or family connections to the war, add firsthand context."}, {"name": "Sapa rice terraces", "wiki": "Sa_Pa", "desc": "Terraced hillsides in the northern highlands, farmed for generations by ethnic minority communities including the Hmong and Dao. Trekking routes wind between villages and rice paddies, with homestays offering a closer look at local life. The town is reachable by overnight train followed by a scenic mountain drive."}, {"name": "Mekong Delta", "wiki": "Mekong_Delta", "desc": "A vast network of rivers, canals, and floating markets in southern Vietnam, where boats piled high with produce trade directly with each other on the water at dawn. Cycling and boat tours pass through fruit orchards and villages built along the waterways. It offers a markedly different, water-based rhythm of life from the rest of the country."}, {"name": "Imperial City, Hue", "wiki": "Imperial_City,_Huế", "desc": "The walled former capital of the Nguyen Dynasty, its citadel modeled partly on Beijing's Forbidden City, though considerably damaged during the Vietnam War. Restoration work continues on many of its palaces, temples, and gates. The nearby royal tombs, set in landscaped grounds outside the city, are considered some of the country's finest examples of traditional Vietnamese architecture."}], "itineraryDays": 10, "itinerary": [{"label": "Days 1–3", "title": "Hanoi & Ha Long Bay", "desc": "The old quarter, then an overnight boat cruise through the bay."}, {"label": "Day 4", "title": "Sapa", "desc": "A trek through rice terraces and hill-tribe villages."}, {"label": "Days 5–6", "title": "Hoi An & Hue", "desc": "The lantern town's tailors and food, plus Hue's imperial citadel."}, {"label": "Days 7–9", "title": "Ho Chi Minh City & Mekong Delta", "desc": "City sights, the Cu Chi Tunnels, and a boat trip through the delta."}, {"label": "Day 10", "title": "Departure", "desc": "Fly out of Ho Chi Minh City."}]}]}, {"id": "europe", "name": "Europe", "tagline": "Old cities, close borders, easy trains", "color": "#2F5D62", "countries": [{"id": "austria", "name": "Austria", "flag": "🇦🇹", "capital": "Vienna", "population": "9.1 million", "language": "German", "currency": "Euro", "bestTime": "May–September, December for Christmas markets", "blurb": "Austria pairs Vienna's imperial grandeur with alpine towns and lakes just a short train ride away, all tied together by a strong classical music tradition still very much alive.", "attractions": [{"name": "Schönbrunn Palace, Vienna", "wiki": "Schönbrunn_Palace", "desc": "The former summer residence of the Habsburg emperors, its 1,441 rooms set within extensive formal gardens featuring a hilltop gloriette with sweeping city views. Highlights include the Great Gallery, used for state receptions, and the world's oldest zoo, founded in the palace grounds in 1752. A full visit easily fills half a day."}, {"name": "Hallstatt", "wiki": "Hallstatt", "desc": "A lakeside village so picturesque it has been reproduced as a full-scale replica in China, with pastel houses stacked against a steep mountainside above the Hallstättersee lake. Beneath the town, one of the world's oldest salt mines is open for tours, complete with a slide used by miners for centuries. Its popularity means visiting early or late in the day helps avoid the crowds."}, {"name": "Vienna State Opera", "wiki": "Vienna_State_Opera", "desc": "One of the most important opera houses in the world, hosting a different production most nights of its packed season. Standing-room tickets are famously cheap and offer a way to experience world-class performances on a budget. Guided daytime tours cover the building's ornate interior even without attending a show."}, {"name": "Hofburg Palace, Vienna", "wiki": "Hofburg", "desc": "The former principal imperial palace, now housing the Austrian president's office alongside museums covering the Habsburg treasury, the Spanish Riding School's Lipizzaner horses, and Sisi's personal apartments. Its scale reflects six centuries of continuous expansion by successive rulers. It sits at the heart of Vienna's compact historic center."}, {"name": "Salzburg's Old Town", "wiki": "Salzburg", "desc": "Mozart's birthplace and the setting for much of The Sound of Music, its baroque old town sits below the hilltop Hohensalzburg Fortress. Narrow lanes lead past the composer's childhood home and numerous churches, with the fortress offering panoramic Alpine views. It's an easy day trip or overnight stop between Vienna and the mountains."}, {"name": "Wachau Valley", "wiki": "Wachau", "desc": "A UNESCO-listed stretch of the Danube lined with vineyard terraces, medieval castle ruins, and small wine towns like Dürnstein and Melk. A river cruise or bike path along the valley floor is the classic way to see it, with Melk Abbey's baroque library as a highlight. Apricot orchards add a distinct local specialty to the wine."}], "itineraryDays": 9, "itinerary": [{"label": "Days 1–3", "title": "Vienna", "desc": "Schönbrunn Palace, the Hofburg, and an evening at the State Opera."}, {"label": "Day 4", "title": "Wachau Valley", "desc": "A day trip along the Danube's vineyard terraces and Melk Abbey."}, {"label": "Days 5–6", "title": "Salzburg", "desc": "Mozart's old town and the hilltop Hohensalzburg Fortress."}, {"label": "Days 7–9", "title": "Hallstatt & the Salzkammergut", "desc": "The lakeside village, its ancient salt mine, and the surrounding alpine lake district."}]}, {"id": "belgium", "name": "Belgium", "flag": "🇧🇪", "capital": "Brussels", "population": "11.7 million", "language": "Dutch, French, German", "currency": "Euro", "bestTime": "April–September", "blurb": "Belgium's small size hides an outsized concentration of medieval old towns, world-class beer, and chocolate, with Bruges and Ghent often considered even more atmospheric than the capital.", "attractions": [{"name": "Grand Place, Brussels", "wiki": "Grand_Place", "desc": "A UNESCO-listed central square ringed by ornate guildhalls, the Gothic Town Hall, and the King's House, all illuminated after dark in a way that makes it one of the most striking squares in Europe. It hosts a biennial flower carpet event, when the entire square is covered in fresh blooms. Chocolate and waffle shops line the surrounding streets."}, {"name": "Bruges' canals and old town", "wiki": "Bruges", "desc": "Often called the 'Venice of the North', Bruges' medieval canal network and largely preserved old town make it one of the best-kept examples of a Flemish city from the period. Canal boat tours pass beneath old stone bridges and beside gabled merchant houses. Climbing the Belfry tower rewards visitors with wide views over the red-tiled rooftops below."}, {"name": "Atomium, Brussels", "wiki": "Atomium", "desc": "A striking structure built for the 1958 World's Fair, its nine steel spheres representing an iron crystal magnified 165 billion times, connected by escalators and stairs. An observation deck at the top offers wide views over Brussels. It remains one of the city's most recognizable modern landmarks alongside its older architecture."}, {"name": "Ghent's medieval center", "wiki": "Ghent", "desc": "A university city with a dense, well-preserved medieval core, its Gravensteen castle, Graslei waterfront guildhalls, and towering St. Bavo's Cathedral all within easy walking distance of each other. It's often considered less touristy than Bruges while offering similarly striking architecture. The cathedral's Ghent Altarpiece is regarded as one of the most important works of early Flemish painting."}, {"name": "Belgian beer culture", "wiki": "Beer_in_Belgium", "desc": "Belgium's brewing tradition, recognized by UNESCO, spans everything from Trappist ales brewed by monks to fruit lambics fermented with wild yeast. Brussels and Bruges both have dedicated beer museums and bars stocking hundreds of varieties, often served in glassware specific to each brand. A guided tasting is a common and enjoyable way to make sense of the sheer variety."}, {"name": "Flanders Fields", "wiki": "Flanders_Fields", "desc": "The site of some of the First World War's most devastating battles, now marked by cemeteries, memorials, and museums around the town of Ypres. The In Flanders Fields Museum and the nightly Last Post ceremony at the Menin Gate offer a solemn counterpoint to Belgium's lighter attractions elsewhere. It remains an important pilgrimage site for visitors from Commonwealth nations."}], "itineraryDays": 7, "itinerary": [{"label": "Days 1–2", "title": "Brussels", "desc": "The Grand Place, the Atomium, and a beer tasting to get oriented."}, {"label": "Days 3–4", "title": "Bruges", "desc": "Canal boat tours and the Belfry tower over the old town."}, {"label": "Day 5", "title": "Ghent", "desc": "The medieval center and the Ghent Altarpiece in St. Bavo's Cathedral."}, {"label": "Days 6–7", "title": "Flanders Fields", "desc": "A more reflective day around Ypres before returning to Brussels for departure."}]}, {"id": "bosnia", "name": "Bosnia and Herzegovina", "flag": "🇧🇦", "capital": "Sarajevo", "population": "3.2 million", "language": "Bosnian, Croatian, Serbian", "currency": "Convertible mark", "bestTime": "May–September", "blurb": "Bosnia and Herzegovina's layered history, Ottoman, Austro-Hungarian, and the more recent 1990s war, shows up directly in Sarajevo's streets and Mostar's rebuilt bridge.", "attractions": [{"name": "Stari Most, Mostar", "wiki": "Stari_Most", "desc": "An arched Ottoman-era bridge over the Neretva River, destroyed during the 1990s war and rebuilt using original construction techniques and reopened in 2004. Local divers still jump from its highest point into the cold river below, a tradition dating back centuries. The old town's cobbled streets and river views make it one of the most photographed spots in the Balkans."}, {"name": "Baščaršija, Sarajevo", "wiki": "Baščaršija", "desc": "Sarajevo's old Ottoman bazaar quarter, its narrow lanes filled with copper workshops, mosques, and cafes serving traditional Bosnian coffee. It sits at a point in the city sometimes described as where East meets West, with Ottoman and Austro-Hungarian architecture visible within a short walk of each other. Evening is a particularly lively time to explore."}, {"name": "Sarajevo War Tunnel", "wiki": "Sarajevo_Tunnel", "desc": "A hand-dug tunnel beneath the airport runway that served as Sarajevo's only lifeline during the nearly four-year siege of the city in the 1990s. A preserved section is now a small museum, offering a direct, sobering account of how the besieged city survived. It's widely considered an essential stop for understanding recent Bosnian history."}, {"name": "Kravice Waterfalls", "wiki": "Kravice_waterfalls", "desc": "A wide, tiered waterfall on the Trebižat River near Mostar, its curtain of cascades dropping into a large natural pool popular for swimming in summer. The setting, ringed by forest, feels remote despite being an easy day trip from the coast or Mostar. It's often compared favorably to more famous waterfalls elsewhere in the Balkans."}, {"name": "Latin Bridge, Sarajevo", "wiki": "Latin_Bridge", "desc": "A modest Ottoman-era bridge over the Miljacka River, notable as the site of the 1914 assassination of Archduke Franz Ferdinand, the event that triggered the First World War. A small museum on the corner covers the assassination and its context in detail. It's an easy stop within Sarajevo's compact historic center."}, {"name": "Blagaj Tekke", "wiki": "Blagaj_Tekke", "desc": "A 16th-century Dervish monastery built directly into a cliff face at the source of the Buna River, one of the strongest natural springs in Europe. The combination of turquoise spring water, a dramatic rock overhang, and the monastery's traditional architecture makes it a striking, peaceful stop. It's a short drive from Mostar."}], "itineraryDays": 6, "itinerary": [{"label": "Days 1–3", "title": "Sarajevo", "desc": "Baščaršija's old bazaar, the Latin Bridge, and the War Tunnel Museum."}, {"label": "Days 4–5", "title": "Mostar", "desc": "Stari Most and its old town, plus a side trip to Blagaj Tekke."}, {"label": "Day 6", "title": "Kravice Waterfalls", "desc": "A swim at the waterfalls before returning to the coast or capital for departure."}]}, {"id": "croatia", "name": "Croatia", "flag": "🇭🇷", "capital": "Zagreb", "population": "3.9 million", "language": "Croatian", "currency": "Euro", "bestTime": "May–June, September", "blurb": "Croatia's Adriatic coast strings together walled medieval towns, island-hopping ferries, and waterfalls, with Dubrovnik's fortifications as the natural centerpiece.", "attractions": [{"name": "Dubrovnik's Old Town walls", "wiki": "Walls_of_Dubrovnik", "desc": "Nearly two kilometers of medieval fortifications encircle Dubrovnik's old town, walkable in full for sweeping views over the terracotta rooftops and the Adriatic beyond. The city gained wider fame as a filming location for King's Landing in Game of Thrones. Visiting early morning or off-season helps avoid the cruise ship crowds that can otherwise fill the narrow streets."}, {"name": "Plitvice Lakes National Park", "wiki": "Plitvice_Lakes_National_Park", "desc": "A series of sixteen terraced lakes connected by waterfalls, their water an intense turquoise from dissolved minerals, all linked by wooden boardwalks that wind directly over and beside the water. It's Croatia's oldest and largest national park and a UNESCO World Heritage Site. The site is popular enough that arriving early makes a real difference to the experience."}, {"name": "Split's Diocletian's Palace", "wiki": "Diocletian%27s_Palace", "desc": "A Roman emperor's retirement palace that gradually became the living heart of the city of Split, with shops, homes, and cafes now occupying its ancient walls and courtyards. The basement halls, once used for storage, are remarkably well preserved and open to visitors. It's one of the most complete Roman structures still in daily use anywhere in the world."}, {"name": "Hvar Island", "wiki": "Hvar", "desc": "A lavender-scented island known for its lively harbor town, a hilltop fortress overlooking the Pakleni Islands, and some of the sunniest weather in Europe. It's a popular stop on Adriatic sailing routes, with a livelier nightlife scene than most other Croatian islands. Quieter villages further inland offer a slower pace away from the main harbor."}, {"name": "Krka National Park", "wiki": "Krka_National_Park", "desc": "Centered on a series of waterfalls along the Krka River, with the Skradinski Buk cascade historically open for swimming beneath the falls, though rules on this have changed in recent years. Boardwalk trails wind through the surrounding forest, and boat trips connect to the medieval Visovac monastery island. It's often visited as a quieter alternative to the more crowded Plitvice Lakes."}, {"name": "Rovinj, Istria", "wiki": "Rovinj", "desc": "A former fishing town on the Istrian peninsula, its pastel houses stacked toward a hilltop church in a layout often compared to an Italian coastal village. Cobbled lanes lead down to a harbor still used by local fishing boats. The wider Istria region is also known for truffles and olive oil, worth exploring beyond the town itself."}], "itineraryDays": 9, "itinerary": [{"label": "Days 1–3", "title": "Dubrovnik", "desc": "The old town walls, day trips, and time on nearby beaches or islands."}, {"label": "Day 4", "title": "Split", "desc": "Diocletian's Palace and the city's lively waterfront promenade."}, {"label": "Day 5", "title": "Krka National Park", "desc": "A day trip to the waterfalls, quieter than Plitvice but similarly striking."}, {"label": "Days 6–7", "title": "Hvar", "desc": "Ferry to the island for its harbor town, fortress, and lavender countryside."}, {"label": "Days 8–9", "title": "Zagreb or Plitvice", "desc": "Either the capital's museums or a detour inland to the terraced lakes before departure."}]}, {"id": "czech-republic", "name": "Czech Republic", "flag": "🇨🇿", "capital": "Prague", "population": "10.9 million", "language": "Czech", "currency": "Czech koruna", "bestTime": "April–May, September–October", "blurb": "Prague's largely intact medieval and baroque center makes it one of the best-preserved capitals in Europe, easily paired with smaller historic towns and spa resorts further afield.", "attractions": [{"name": "Prague Castle", "wiki": "Prague_Castle", "desc": "According to Guinness World Records, the largest ancient castle complex in the world, its grounds including the towering Gothic St. Vitus Cathedral and the colorful Golden Lane of tiny former craftsmen's houses. It has served as the seat of Czech rulers for over a thousand years and remains the official residence of the president today. A full visit can easily take most of a day."}, {"name": "Charles Bridge", "wiki": "Charles_Bridge", "desc": "A 14th-century stone bridge lined with thirty baroque statues, connecting Prague's Old Town to the castle district across the Vltava River. It's pedestrian-only and lively with street artists and musicians throughout the day, though sunrise offers a rare quiet crossing. The bridge towers at either end can be climbed for views along its length."}, {"name": "Astronomical Clock, Old Town Square", "wiki": "Prague_astronomical_clock", "desc": "The oldest astronomical clock still operating anywhere in the world, installed in 1410 and mounted on the Old Town Hall tower. Every hour, a small mechanical show of moving apostle figures draws crowds below, followed by a crowing rooster and chiming bells. The tower itself can be climbed for panoramic views over the Old Town's red rooftops."}, {"name": "Český Krumlov", "wiki": "Český_Krumlov", "desc": "A small medieval town built around a dramatic bend in the Vltava River, its castle and pastel old town largely unchanged since the Renaissance. It's compact enough to explore fully in a day, though its atmosphere makes an overnight stay worthwhile. Kayaking or rafting the river loop around the town is a popular addition."}, {"name": "Karlovy Vary", "wiki": "Karlovy_Vary", "desc": "A spa town built around naturally hot mineral springs, its colonnades and pastel townhouses drawing visitors since the 14th century, including composers and royalty over the centuries. Drinking the mineral water from small spouted cups, sold at souvenir stalls throughout town, is a local tradition. It also hosts a well-regarded international film festival each summer."}, {"name": "Kutná Hora & the Bone Church", "wiki": "Sedlec_Ossuary", "desc": "A small town once wealthy from silver mining, its most unusual attraction a small chapel decorated entirely with the bones of an estimated 40,000 to 70,000 people, arranged into chandeliers, garlands, and a coat of arms. The nearby Cathedral of St. Barbara adds a more conventional but equally striking Gothic counterpoint. It's an easy day trip from Prague."}], "itineraryDays": 8, "itinerary": [{"label": "Days 1–3", "title": "Prague", "desc": "Prague Castle, Charles Bridge, and the Old Town's astronomical clock."}, {"label": "Day 4", "title": "Kutná Hora", "desc": "A day trip to the Bone Church and St. Barbara's Cathedral."}, {"label": "Days 5–6", "title": "Český Krumlov", "desc": "The riverside medieval town, with time for kayaking the loop."}, {"label": "Days 7–8", "title": "Karlovy Vary", "desc": "The spa town's colonnades and mineral springs before returning to Prague."}]}, {"id": "denmark", "name": "Denmark", "flag": "🇩🇰", "capital": "Copenhagen", "population": "5.9 million", "language": "Danish", "currency": "Danish krone", "bestTime": "May–September", "blurb": "Copenhagen's easy bike culture, waterfront design, and nearby castles make Denmark one of the most relaxed and walkable Scandinavian city trips.", "attractions": [{"name": "Nyhavn, Copenhagen", "wiki": "Nyhavn", "desc": "A 17th-century harbor lined with brightly colored townhouses, now filled with outdoor cafes and moored wooden boats. It's Copenhagen's most photographed spot and a popular starting point for canal tours around the city's waterways. Hans Christian Andersen once lived at several addresses along this same stretch."}, {"name": "Tivoli Gardens", "wiki": "Tivoli_Gardens", "desc": "One of the oldest amusement parks in the world, opened in 1843, its landscaped gardens, historic wooden roller coaster, and nightly illuminations helped inspire Walt Disney's vision for Disneyland. It sits right in the city center, within walking distance of the main train station. Seasonal festivals, including an elaborate Christmas market, keep it lively year-round."}, {"name": "Kronborg Castle, Helsingør", "wiki": "Kronborg", "desc": "A Renaissance castle on the narrowest point of the Øresund strait, better known to literature fans as the setting for Shakespeare's Hamlet. Its fortified walls once controlled a toll on all ships passing between Denmark and Sweden. The town of Helsingør around it makes for an easy half-day trip from Copenhagen."}, {"name": "The Little Mermaid statue", "wiki": "The_Little_Mermaid_(statue)", "desc": "A small bronze statue perched on a rock along Copenhagen's harbor, inspired by Hans Christian Andersen's fairy tale and unveiled in 1913. Its modest size often surprises first-time visitors expecting something grander, but it remains one of the city's most visited landmarks. The surrounding Langelinie promenade makes for a pleasant waterfront walk."}, {"name": "Rosenborg Castle", "wiki": "Rosenborg_Castle", "desc": "A Renaissance castle built by King Christian IV, now housing the Danish crown jewels and royal regalia in a heavily guarded treasury. Its surrounding King's Garden is one of the oldest and most visited parks in Copenhagen. The castle's turrets and moat give it a distinctly fairy-tale appearance in the middle of the city."}, {"name": "Aarhus's Den Gamle By", "wiki": "Den_Gamle_By", "desc": "An open-air museum in Denmark's second city, recreating a historic Danish town using over 75 original relocated buildings spanning several centuries. Costumed staff and period-accurate shops give a lived-in sense of daily life through different eras. It's a worthwhile stop on a longer trip beyond Copenhagen."}], "itineraryDays": 6, "itinerary": [{"label": "Days 1–2", "title": "Copenhagen city center", "desc": "Nyhavn, Tivoli Gardens, and the Little Mermaid statue along the harbor."}, {"label": "Day 3", "title": "Rosenborg & the palaces", "desc": "The crown jewels and a walk through the King's Garden."}, {"label": "Day 4", "title": "Kronborg Castle", "desc": "A day trip north to Hamlet's castle and the town of Helsingør."}, {"label": "Days 5–6", "title": "Aarhus", "desc": "A train to Denmark's second city for its open-air history museum."}]}, {"id": "france", "name": "France", "flag": "🇫🇷", "capital": "Paris", "population": "68 million", "language": "French", "currency": "Euro", "bestTime": "April–June, September–October", "blurb": "France rewards a route that leaves Paris for at least a few days, since the Loire's châteaux, Provence's lavender, and the Riviera's coastline are as central to the country's identity as the capital itself.", "attractions": [{"name": "Eiffel Tower, Paris", "wiki": "Eiffel_Tower", "desc": "Built for the 1889 World's Fair and originally intended as a temporary structure, this iron lattice tower became the enduring symbol of Paris. Three observation levels offer increasingly wide views over the city, with the top reachable by a combination of stairs and elevator. It sparkles for five minutes every hour after dark, a detail added decades after its original construction."}, {"name": "Louvre Museum, Paris", "wiki": "Louvre", "desc": "The world's most-visited museum, its glass pyramid entrance leading to a collection spanning ancient Egyptian artifacts, Greek sculpture, and the Mona Lisa, viewed daily by dense crowds despite its modest size. The building itself was originally a medieval fortress before becoming a royal palace. A single visit can only realistically cover a fraction of its roughly 35,000 displayed works."}, {"name": "Palace of Versailles", "wiki": "Palace_of_Versailles", "desc": "Louis XIV's vast royal palace outside Paris, its Hall of Mirrors and formal gardens designed explicitly to project the absolute power of the French monarchy. The gardens alone cover hundreds of hectares, with fountains that still perform choreographed shows on select days. It's an easy half-day train trip from central Paris."}, {"name": "Mont Saint-Michel", "wiki": "Mont-Saint-Michel", "desc": "A medieval abbey perched on a rocky tidal island off Normandy's coast, its silhouette rising dramatically above the surrounding bay at high tide. A causeway now allows access regardless of tide level, though the changing water remains one of the most extreme in Europe. The abbey's Gothic architecture and steep, narrow village streets reward a slow exploration."}, {"name": "Loire Valley châteaux", "wiki": "Château_de_Chambord", "desc": "A region dotted with hundreds of Renaissance châteaux, with Chambord's distinctive double-helix staircase and elaborate rooftop terraces standing as the most architecturally ambitious. Chenonceau, built directly over the River Cher, offers a very different, more graceful counterpoint. Cycling or driving between several châteaux is the classic way to experience the valley."}, {"name": "Provence's lavender fields", "wiki": "Valensole", "desc": "The plateau around Valensole turns a striking purple each July as lavender fields bloom in neat, endless rows, a scene that has become an unofficial symbol of the French countryside. Nearby hilltop villages like Gordes and Roussillon add ochre cliffs and stone architecture to the landscape. Timing a visit to peak bloom requires checking conditions, since the season shifts slightly year to year."}], "itineraryDays": 12, "itinerary": [{"label": "Days 1–4", "title": "Paris", "desc": "The Eiffel Tower, the Louvre, and a day trip to Versailles."}, {"label": "Days 5–6", "title": "Mont Saint-Michel & Normandy", "desc": "The tidal abbey, with time for the D-Day beaches if the route allows."}, {"label": "Days 7–8", "title": "Loire Valley", "desc": "A drive between Chambord, Chenonceau, and other Renaissance châteaux."}, {"label": "Days 9–12", "title": "Provence", "desc": "Lavender fields near Valensole and the hilltop villages of the Luberon."}]}, {"id": "georgia", "name": "Georgia", "flag": "🇬🇪", "capital": "Tbilisi", "population": "3.7 million", "language": "Georgian", "currency": "Georgian lari", "bestTime": "May–June, September–October", "blurb": "Georgia sits at the crossroads of Europe and Asia, its capital Tbilisi mixing sulfur bathhouses and hillside churches with a wine-growing tradition claimed to be the oldest in the world.", "attractions": [{"name": "Old Tbilisi", "wiki": "Old_Tbilisi", "desc": "A district of balconied wooden houses, sulfur bathhouses, and narrow cobbled lanes climbing toward the hilltop Narikala Fortress. A cable car connects the old town directly to the fortress for sweeping views over the city and the Kura River below. The area's natural hot springs have drawn bathers for centuries and remain in use today."}, {"name": "Kazbegi & Gergeti Trinity Church", "wiki": "Gergeti_Trinity_Church", "desc": "A 14th-century church perched dramatically on a hilltop below the snow-capped Mount Kazbek, reached by a scenic drive along the Georgian Military Highway followed by a hike or 4x4 ride up. On clear days, the mountain backdrop makes it one of the most photographed churches in the Caucasus. The surrounding Kazbegi region offers extensive hiking beyond the church itself."}, {"name": "Kakheti wine region", "wiki": "Kakheti", "desc": "Georgia's main wine-producing region, where winemaking using large buried clay vessels called qvevri has continued for an estimated 8,000 years, recognized by UNESCO as an intangible cultural heritage. Family-run wineries throughout the region offer tastings alongside traditional supra feasts. The walled town of Sighnaghi adds hilltop views over the Alazani Valley's vineyards."}, {"name": "Uplistsikhe cave town", "wiki": "Uplistsikhe", "desc": "An ancient rock-hewn settlement carved into a cliffside, inhabited from around the early Iron Age through the medieval period and once an important stop on Silk Road trade routes. Visitors can climb through excavated chambers, including a large hall believed to have served ceremonial functions. It offers a quieter, less crowded alternative to Cappadocia's more famous rock-cut settlements."}, {"name": "Svaneti's medieval towers", "wiki": "Svaneti", "desc": "A remote highland region in the Caucasus, its villages dotted with medieval defensive stone towers built by local families for protection during clan conflicts. The village of Mestia, now more accessible by paved road, serves as the main base for hiking trails with views of some of Georgia's highest peaks. Its isolation has helped preserve distinct local traditions found nowhere else in the country."}, {"name": "Tbilisi's sulfur bathhouses", "wiki": "Abanotubani", "desc": "A district of brick-domed bathhouses fed by natural underground hot springs, a tradition that gave Tbilisi its name, meaning roughly 'warm place'. Private rooms and communal halls both offer hot mineral soaking, often followed by a vigorous scrub treatment. It remains a genuinely local experience rather than one built solely for tourists."}], "itineraryDays": 9, "itinerary": [{"label": "Days 1–2", "title": "Tbilisi", "desc": "Old town, the sulfur bathhouses, and the Narikala Fortress cable car."}, {"label": "Days 3–4", "title": "Kazbegi", "desc": "The Georgian Military Highway and a hike up to Gergeti Trinity Church."}, {"label": "Days 5–6", "title": "Kakheti", "desc": "Wine tastings and a stop at the ancient qvevri wineries and Sighnaghi."}, {"label": "Days 7–9", "title": "Svaneti", "desc": "A longer drive into the highlands for Mestia's medieval defensive towers."}]}, {"id": "germany", "name": "Germany", "flag": "🇩🇪", "capital": "Berlin", "population": "84 million", "language": "German", "currency": "Euro", "bestTime": "May–September, December for Christmas markets", "blurb": "Germany's mix of Cold War history in Berlin, fairy-tale castles in Bavaria, and its excellent rail network make it a country that rewards moving between very different regions.", "attractions": [{"name": "Brandenburg Gate, Berlin", "wiki": "Brandenburg_Gate", "desc": "An 18th-century neoclassical gate that came to symbolize a divided Germany during the Cold War, standing just behind the line of the former Berlin Wall. It's now a focal point for national celebrations and remains the city's most recognizable landmark. Nearby, sections of the wall and the Holocaust Memorial add further historical weight to the area."}, {"name": "Neuschwanstein Castle", "wiki": "Neuschwanstein_Castle", "desc": "A 19th-century fairy-tale castle built by the reclusive King Ludwig II of Bavaria, its turrets and mountain backdrop reportedly inspiring Disney's Sleeping Beauty Castle. Set against the Alps in southern Bavaria, it's reached by a walk or horse-drawn carriage up from the valley below. The nearby Marienbrücke bridge offers the classic postcard view of the castle itself."}, {"name": "Cologne Cathedral", "wiki": "Cologne_Cathedral", "desc": "A Gothic cathedral that took over 600 years to complete, its twin spires dominating the Cologne skyline and once making it the tallest building in the world upon completion in 1880. It survived Allied bombing in World War II largely intact while much of the surrounding city was destroyed. Climbing the south tower's 533 steps rewards visitors with wide views over the Rhine."}, {"name": "Berlin Wall Memorial", "wiki": "Berlin_Wall_Memorial", "desc": "A preserved stretch of the wall that divided East and West Berlin for 28 years, complemented by an outdoor exhibition and a documentation center explaining the personal and political impact of the division. Watchtowers and a reconstructed death strip give a visceral sense of the wall's scale. It's a sobering but essential stop for understanding modern German history."}, {"name": "Rothenburg ob der Tauber", "wiki": "Rothenburg_ob_der_Tauber", "desc": "A remarkably well-preserved medieval walled town along the Romantic Road, its half-timbered houses and towers largely spared from wartime destruction. A full walk of the town walls offers views over the red-roofed old town below. It's especially atmospheric during its Christmas market season."}, {"name": "Black Forest", "wiki": "Black_Forest", "desc": "A densely forested mountain region in southwest Germany, its dark fir-covered hills giving the region its name and its cuckoo clocks their reputation. Small spa towns like Baden-Baden sit alongside hiking trails and waterfalls throughout the region. It's also the origin of Black Forest cake, a local specialty worth trying at its source."}], "itineraryDays": 11, "itinerary": [{"label": "Days 1–3", "title": "Berlin", "desc": "The Brandenburg Gate, Berlin Wall Memorial, and the city's museum island."}, {"label": "Days 4–5", "title": "Cologne", "desc": "The cathedral and a walk along the Rhine."}, {"label": "Days 6–7", "title": "Black Forest", "desc": "Hiking trails and spa towns in southwest Germany's dense forest region."}, {"label": "Days 8–9", "title": "Rothenburg ob der Tauber", "desc": "A stop along the Romantic Road's best-preserved medieval town."}, {"label": "Days 10–11", "title": "Neuschwanstein & Bavaria", "desc": "The fairy-tale castle and Munich before departure."}]}, {"id": "greece", "name": "Greece", "flag": "🇬🇷", "capital": "Athens", "population": "10.4 million", "language": "Greek", "currency": "Euro", "bestTime": "May–June, September", "blurb": "A Greek itinerary usually pairs Athens' ancient core with a ferry hop to the islands, where the pace slows considerably.", "attractions": [{"name": "The Acropolis, Athens", "wiki": "Acropolis_of_Athens", "desc": "The Parthenon and its surrounding site sit atop a rocky outcrop overlooking Athens, built in the 5th century BC as a tribute to the goddess Athena. Centuries of use as a fortress, church, and mosque have left visible layers of history across the site. Visiting at opening time helps avoid both the summer heat and the largest crowds."}, {"name": "Santorini's caldera", "wiki": "Santorini", "desc": "Whitewashed towns along the cliff edge of a collapsed volcanic caldera, their blue-domed churches among the most photographed scenes in Greece. The island's dramatic geology, shaped by a massive eruption around 1600 BC, is on full display from the cliffside walking path between Fira and Oia. Sunset in Oia draws large crowds nightly, though quieter viewpoints exist nearby."}, {"name": "Mykonos", "wiki": "Mykonos", "desc": "Windmills and narrow whitewashed lanes give the main town, Chora, a distinctly Cycladic character, while the island's beach clubs have made it one of the liveliest nightlife destinations in the Aegean. Little Venice, a row of colorful buildings built right at the water's edge, is a popular spot for sunset drinks. Quieter beaches exist away from the main party scene for those seeking a calmer stay."}, {"name": "Meteora", "wiki": "Meteora", "desc": "Monasteries built atop dramatic sandstone rock pillars in central Greece, originally reached only by removable ladders or nets to protect monks from invasion. Several of the six remaining active monasteries are open to visitors, with modest dress required. The rock formations themselves, shaped by erosion over millions of years, are striking even without the monasteries."}, {"name": "Delphi", "wiki": "Delphi", "desc": "Considered by ancient Greeks to be the center of the world, this sanctuary once housed the Oracle of Delphi, whose cryptic prophecies were sought by rulers across the ancient Mediterranean. The site's dramatic setting on the slopes of Mount Parnassus adds to its mystique. A well-preserved amphitheater and stadium sit above the main temple ruins."}, {"name": "Ancient Agora & Plaka, Athens", "wiki": "Ancient_Agora_of_Athens", "desc": "The Agora once served as ancient Athens' central marketplace and civic gathering space, where philosophers including Socrates debated in public. The well-preserved Temple of Hephaestus stands at one edge of the site. The adjoining Plaka neighborhood offers a livelier, more modern counterpoint of tavernas and shops beneath the Acropolis."}], "itineraryDays": 9, "itinerary": [{"label": "Days 1–2", "title": "Athens", "desc": "The Acropolis, the Ancient Agora, and the museum below the hill."}, {"label": "Days 3–5", "title": "Santorini", "desc": "Fira and Oia, a boat trip to the volcano, and sunset watching."}, {"label": "Days 6–7", "title": "Mykonos", "desc": "Old town lanes and beach time before heading back to the mainland."}, {"label": "Days 8–9", "title": "Meteora or Delphi", "desc": "A land-based detour on the way back to Athens for departure."}]}, {"id": "iceland", "name": "Iceland", "flag": "🇮🇸", "capital": "Reykjavik", "population": "380,000", "language": "Icelandic", "currency": "Icelandic krona", "bestTime": "June–August, or Sept–March for the northern lights", "blurb": "Iceland's Ring Road puts waterfalls, glaciers, and volcanic landscapes within a manageable drive of Reykjavik.", "attractions": [{"name": "The Golden Circle", "wiki": "Golden_Circle_(Iceland)", "desc": "A popular driving loop covering Þingvellir National Park, where the North American and Eurasian tectonic plates visibly pull apart, alongside the Geysir hot spring area and the thundering two-tiered Gullfoss waterfall. It's Iceland's most accessible introduction to the country's dramatic geology, doable as a day trip from Reykjavik. Þingvellir also holds historical significance as the site of Iceland's original parliament, founded in 930 AD."}, {"name": "Blue Lagoon", "wiki": "Blue_Lagoon_(geothermal_spa)", "desc": "A geothermal spa near Keflavik, its milky blue water rich in silica and minerals, heated by nearby volcanic activity and kept at a consistently warm temperature year-round. Originally formed as runoff from a nearby power plant, it has since become one of Iceland's most visited attractions. Its proximity to the airport makes it an easy stop before a flight."}, {"name": "South Coast waterfalls", "wiki": "Seljalandsfoss", "desc": "Seljalandsfoss allows visitors to walk behind its curtain of falling water, while nearby Skógafoss offers a more powerful, direct drop framed by dramatic mist. The nearby black sand beach at Reynisfjara adds striking basalt column formations and dangerous but photogenic waves. This stretch of coast concentrates several of Iceland's most iconic sights within a relatively short drive."}, {"name": "Jökulsárlón glacier lagoon", "wiki": "Jökulsárlón", "desc": "Icebergs calve from the retreating Breiðamerkurjökull glacier and drift slowly toward the sea, some washing up on the nearby Diamond Beach in stark contrast against the black sand. Boat tours navigate between the floating ice for a closer view, sometimes spotting seals resting on the smaller bergs. The lagoon has grown considerably over recent decades as the glacier continues to retreat."}, {"name": "Skaftafell & Vatnajökull", "wiki": "Vatnajökull_National_Park", "desc": "Home to Europe's largest glacier by volume, this national park offers guided glacier hikes and ice cave tours during the colder months when the ice is stable enough for safe exploration. Hiking trails through the surrounding highlands pass waterfalls and volcanic terrain shaped by the glacier's slow movement. It anchors much of southeastern Iceland's dramatic scenery."}, {"name": "Snæfellsnes Peninsula", "wiki": "Snæfellsnes", "desc": "Often called 'Iceland in miniature' for packing craters, glaciers, black sand beaches, and fishing villages into a single peninsula. Snæfellsjökull, the glacier-capped volcano at its tip, was famously the entry point to the underworld in Jules Verne's Journey to the Center of the Earth. It's a shorter loop than the full Ring Road, making it manageable in just a day or two."}], "itineraryDays": 7, "itinerary": [{"label": "Days 1–2", "title": "Reykjavik & Golden Circle", "desc": "The capital's harbor and design shops, then a loop through the Golden Circle."}, {"label": "Days 3–4", "title": "South Coast", "desc": "Waterfalls, the black sand beach, and on to Jökulsárlón's glacier lagoon."}, {"label": "Day 5", "title": "Blue Lagoon", "desc": "Return west with a stop at the geothermal spa."}, {"label": "Days 6–7", "title": "Snæfellsnes Peninsula", "desc": "A shorter loop covering craters, cliffs, and a glacier-capped volcano."}]}, {"id": "ireland", "name": "Ireland", "flag": "🇮🇪", "capital": "Dublin", "population": "5.1 million", "language": "English, Irish", "currency": "Euro", "bestTime": "May–September", "blurb": "Ireland's compact size makes a full loop possible in under two weeks, from Dublin's literary pubs to the dramatic cliffs and rugged coastline of the west.", "attractions": [{"name": "Cliffs of Moher", "wiki": "Cliffs_of_Moher", "desc": "Rising up to 214 meters straight out of the Atlantic, these cliffs stretch for roughly eight kilometers along County Clare's coast. O'Brien's Tower at the highest point offers sweeping views back along the cliff line and out to the Aran Islands on clear days. They're one of the most visited natural sites in Ireland, so an early or late visit helps avoid the busiest hours."}, {"name": "Ring of Kerry", "wiki": "Ring_of_Kerry", "desc": "A scenic driving route circling the Iveragh Peninsula, passing beaches, mountains, and small fishing villages over roughly 180 kilometers. The route can easily fill a full day, with detours possible to Skellig Michael's monastic island, a filming location for recent Star Wars films. Traffic runs in one direction seasonally to accommodate the many tour buses."}, {"name": "Guinness Storehouse, Dublin", "wiki": "Guinness_Storehouse", "desc": "A seven-story visitor experience built around Dublin's most famous export, tracing the beer's history from an original 9,000-year lease signed in 1759. The top-floor Gravity Bar offers 360-degree views over the city alongside a pint included with admission. It remains one of Ireland's most visited paid attractions."}, {"name": "Giant's Causeway (Northern Ireland border trip)", "wiki": "Giant%27s_Causeway", "desc": "Though technically across the border in Northern Ireland, this basalt column coastline is often included on longer Irish itineraries starting from Dublin or Belfast. Around 40,000 interlocking hexagonal columns line the shore, wrapped in local legend involving a giant. The wider Causeway Coastal Route adds dramatic cliff scenery on the drive there."}, {"name": "Kilmainham Gaol, Dublin", "wiki": "Kilmainham_Gaol", "desc": "A former prison that held many of the leaders of Ireland's fight for independence, including those executed after the 1916 Easter Rising. Guided tours cover the building's grim conditions alongside its central role in Irish nationalist history. It's considered one of the most significant sites for understanding modern Irish identity."}, {"name": "Dingle Peninsula", "wiki": "Dingle_Peninsula", "desc": "A rugged, Irish-speaking peninsula in County Kerry, its Slea Head Drive winding past beehive huts, beaches, and dramatic ocean cliffs. The town of Dingle itself is known for traditional music sessions in small pubs most nights. It offers a quieter alternative to the more heavily trafficked Ring of Kerry nearby."}], "itineraryDays": 9, "itinerary": [{"label": "Days 1–2", "title": "Dublin", "desc": "The Guinness Storehouse, Kilmainham Gaol, and the city's literary pub scene."}, {"label": "Days 3–4", "title": "Dingle Peninsula", "desc": "The Slea Head Drive and traditional music in Dingle town."}, {"label": "Days 5–6", "title": "Ring of Kerry", "desc": "A full-day scenic drive around the Iveragh Peninsula."}, {"label": "Days 7–9", "title": "Cliffs of Moher & Galway", "desc": "The dramatic Atlantic cliffs and a stop in the lively city of Galway."}]}, {"id": "italy", "name": "Italy", "flag": "🇮🇹", "capital": "Rome", "population": "59 million", "language": "Italian", "currency": "Euro", "bestTime": "April–June, September–October", "blurb": "Italy rewards a route that moves slowly: ancient Rome, Renaissance Florence, Venice's canals, and the Amalfi coastline.", "attractions": [{"name": "Colosseum & Roman Forum", "wiki": "Colosseum", "desc": "The largest amphitheater ever built, once holding up to 80,000 spectators for gladiatorial contests and public spectacles nearly 2,000 years ago. The adjoining Roman Forum, once the political and commercial heart of the ancient city, is now a sprawling field of columns, arches, and temple ruins. Early morning visits help beat both the heat and the dense crowds."}, {"name": "Uffizi Gallery, Florence", "wiki": "Uffizi_Gallery", "desc": "One of the world's great Renaissance art collections, housing Botticelli's Birth of Venus and works by Michelangelo, Raphael, and Leonardo da Vinci within a former administrative building. Its long, U-shaped corridor overlooking the Arno adds architectural interest beyond the paintings themselves. Advance booking is essential given the museum's popularity and limited capacity."}, {"name": "Venice's canals", "wiki": "Venice", "desc": "Best explored on foot away from the crowded San Marco area, or by vaporetto down the Grand Canal past centuries-old palazzos. The city's unique construction on wooden piles driven into a lagoon has sustained it for over a thousand years, though rising water levels remain an ongoing concern. Getting deliberately lost in the quieter sestieri, away from the main routes, reveals a calmer side of the city."}, {"name": "Amalfi Coast", "wiki": "Amalfi_Coast", "desc": "Cliffside towns like Positano and Ravello connect along a dramatic, winding coastal road carved into the mountainside above the Tyrrhenian Sea. Lemon groves terrace the steep hills, supplying the region's famous limoncello liqueur. Boat trips between towns often prove faster and less stressful than the narrow, traffic-heavy coastal drive."}, {"name": "Pompeii", "wiki": "Pompeii", "desc": "A Roman city preserved almost intact under volcanic ash after Mount Vesuvius erupted in 79 AD, its streets, houses, and even bread loaves left frozen at the moment of disaster. Plaster casts of victims, made by pouring material into voids left in the ash, offer a haunting human dimension to the ruins. It's an easy day trip from Naples or the Amalfi Coast."}, {"name": "Vatican Museums & Sistine Chapel", "wiki": "Vatican_Museums", "desc": "Technically in its own sovereign city-state but reached directly from Rome, this vast museum complex culminates in Michelangelo's frescoed Sistine Chapel ceiling. The route passes classical sculpture, tapestries, and Raphael's frescoed rooms before reaching the famous chapel. Booking tickets well ahead significantly reduces the otherwise considerable wait times."}], "itineraryDays": 10, "itinerary": [{"label": "Days 1–3", "title": "Rome", "desc": "The Colosseum, the Vatican, and neighborhoods like Trastevere."}, {"label": "Days 4–5", "title": "Florence & Tuscany", "desc": "The Uffizi and Duomo, with a day trip into the Tuscan countryside."}, {"label": "Days 6–7", "title": "Venice", "desc": "The Grand Canal, Murano, and getting lost in the quieter sestieri."}, {"label": "Days 8–10", "title": "Amalfi Coast", "desc": "Base in Positano or Sorrento, with a day trip to Capri."}]}, {"id": "liechtenstein", "name": "Liechtenstein", "flag": "🇱🇮", "capital": "Vaduz", "population": "40,000", "language": "German", "currency": "Swiss franc", "bestTime": "June–September", "blurb": "Wedged between Switzerland and Austria, Liechtenstein is small enough to see the highlights in a day, built around a princely castle, alpine hiking trails, and a capital that feels more like a large village.", "attractions": [{"name": "Vaduz Castle", "wiki": "Vaduz_Castle", "desc": "The private residence of Liechtenstein's ruling prince, perched on a hill directly above the capital and closed to public entry but visible clearly from the town below or up close via a walking trail. Its medieval origins have been expanded over centuries into the prince's current home. A viewpoint near the castle offers wide views over the Rhine Valley."}, {"name": "Vaduz's city center", "wiki": "Vaduz", "desc": "A compact capital that functions more like a small town, its pedestrian center holding the national art museum, postage stamp museum, and government buildings within a short walk of each other. Liechtenstein's stamps have long been a notable source of national revenue and pride, reflected in a dedicated museum. It's easy to see the entire center in a couple of hours."}, {"name": "Malbun ski resort", "wiki": "Malbun", "desc": "Liechtenstein's only ski resort, a small alpine village offering skiing in winter and hiking trails in summer, set within a valley of the Rätikon mountain range. It stays notably quieter and less developed than larger resorts in neighboring Switzerland or Austria. Chairlifts operating in summer provide easy access to high-altitude trails."}, {"name": "Liechtenstein Trail", "wiki": "Liechtenstein_Trail", "desc": "A long-distance hiking route covering roughly 75 kilometers, designed to pass through all eleven municipalities of the country and completable over several days. It offers a structured way to see the full range of Liechtenstein's landscape, from the Rhine Valley floor to alpine terrain. Most sections can also be walked individually as shorter day hikes."}, {"name": "Gutenberg Castle, Balzers", "wiki": "Gutenberg_Castle_(Liechtenstein)", "desc": "A well-preserved medieval castle in the southern town of Balzers, its grounds now used partly as public gardens and event space rather than a private residence. Its hilltop position offers views across the border into Switzerland. It's a quieter alternative to the more famous Vaduz Castle, with fewer restrictions on close access."}, {"name": "Rhine Valley cycling path", "wiki": "Rhine", "desc": "A flat, well-marked cycling route running the length of the country along the Rhine River, connecting Liechtenstein's towns with easy river views and mountain backdrops on both sides. It's a relaxed way to see more of the country beyond Vaduz without a car. The path also connects onward into both Switzerland and Austria for a longer ride."}], "itineraryDays": 2, "itinerary": [{"label": "Day 1", "title": "Vaduz", "desc": "The castle viewpoint, national museum, and a walk through the compact capital."}, {"label": "Day 2", "title": "Malbun & the Rhine Valley", "desc": "Alpine hiking in Malbun or a flat cycling ride along the Rhine before departure."}]}, {"id": "luxembourg", "name": "Luxembourg", "flag": "🇱🇺", "capital": "Luxembourg City", "population": "660,000", "language": "Luxembourgish, French, German", "currency": "Euro", "bestTime": "May–September", "blurb": "One of Europe's smallest countries, Luxembourg makes up for its size with a dramatically fortified capital built across deep river gorges, and a wine-growing valley along its border with Germany.", "attractions": [{"name": "Luxembourg City's Old Quarters and Fortifications", "wiki": "City_of_Luxembourg", "desc": "A UNESCO-listed old town built dramatically across a river gorge, its casemates, a network of underground defensive tunnels, once able to shelter thousands of soldiers and their equipment. Walking paths along the fortified Chemin de la Corniche offer views often compared to a smaller version of Prague's riverside setting. The contrast between the deep gorge and the modern city above makes it visually distinct from most European capitals."}, {"name": "Bock Casemates", "wiki": "Bock_(Luxembourg)", "desc": "A network of rock-hewn tunnels first carved in the 17th century, expanded over centuries into a maze of galleries capable of housing thousands of soldiers, horses, and workshops. Sections open to visitors wind deep into the cliff below the old town, with openings offering unexpected views over the valley. It marks the original site of the fortress that gave the city its start."}, {"name": "Vianden Castle", "wiki": "Vianden_Castle", "desc": "A large medieval and Renaissance castle perched above the small town of Vianden, its restored halls and towers among the most impressive in the Ardennes region. A chairlift climbs the opposite valley wall for a classic photo of the castle against the town below. Victor Hugo lived nearby and wrote admiringly of the area during his exile."}, {"name": "Mullerthal Trail", "wiki": "Mullerthal", "desc": "Known as 'Little Switzerland' for its unexpectedly rugged sandstone terrain, this region offers hiking trails through narrow rock corridors, moss-covered gorges, and small waterfalls. It's a notable contrast to Luxembourg's otherwise gentle, rolling countryside. Trails range from easy loops to more demanding multi-day routes."}, {"name": "Moselle Valley wine route", "wiki": "Luxembourg_Moselle", "desc": "A gentle river valley along Luxembourg's border with Germany, its terraced vineyards producing crisp white wines, particularly Riesling and crémant sparkling wine. Small towns along the route offer tastings directly from family-run producers. A cycling or driving route follows the river closely, making for an easy, relaxed day trip."}, {"name": "Grand Ducal Palace", "wiki": "Grand_Ducal_Palace", "desc": "The official residence of the Grand Duke of Luxembourg, its Renaissance facade sitting in the heart of the old town beside the parliament building. A changing of the guard takes place at set times, though the building itself is open to the public only during a limited summer window. It remains a working seat of government most of the year."}], "itineraryDays": 4, "itinerary": [{"label": "Day 1", "title": "Luxembourg City", "desc": "The old fortifications, Bock Casemates, and the Grand Ducal Palace."}, {"label": "Day 2", "title": "Vianden", "desc": "The hilltop castle and a chairlift ride for the classic valley view."}, {"label": "Day 3", "title": "Mullerthal Trail", "desc": "A hike through 'Little Switzerland's' sandstone gorges."}, {"label": "Day 4", "title": "Moselle Valley", "desc": "A relaxed wine route along the river before departure."}]}, {"id": "monaco", "name": "Monaco", "flag": "🇲🇨", "capital": "Monaco", "population": "39,000", "language": "French", "currency": "Euro", "bestTime": "April–June, September–October", "blurb": "The world's second-smallest country packs a Grand Prix circuit, a hilltop old town, and one of the most famous casinos on Earth into barely two square kilometers on the French Riviera.", "attractions": [{"name": "Monte Carlo Casino", "wiki": "Monte_Carlo_Casino", "desc": "An ornate Belle Époque casino that has appeared in numerous films, including several James Bond installments, its opulent gaming rooms and marble facade making it as much a sightseeing stop as a gambling venue. Visitors can tour parts of the building for a fee even without playing. The surrounding Casino Square adds luxury car-spotting as an unofficial local pastime."}, {"name": "Prince's Palace", "wiki": "Prince%27s_Palace_of_Monaco", "desc": "The official residence of Monaco's ruling Grimaldi family, perched on a rocky promontory known as the Rock with sweeping views over the harbor. A changing of the guard ceremony takes place daily at 11:55am, drawing a small crowd each morning. Select state apartments are open to the public during summer months."}, {"name": "Oceanographic Museum", "wiki": "Oceanographic_Museum", "desc": "Founded by Prince Albert I in 1910, this museum sits dramatically on a cliff edge above the Mediterranean, its collection ranging from historic marine specimens to a large modern aquarium. Jacques Cousteau served as its director for three decades, shaping much of its scientific reputation. The rooftop terrace offers one of the best sea views in Monaco."}, {"name": "Monaco Grand Prix circuit", "wiki": "Circuit_de_Monaco", "desc": "The narrow public streets of Monaco transform each May into one of Formula 1's most prestigious and challenging circuits, winding past the harbor, through a tunnel, and around tight hairpin turns. Outside race weekend, visitors can walk or drive the same streets, spotting landmarks familiar from television broadcasts. The tight, glamorous setting has made it one of the sport's most iconic venues."}, {"name": "Jardin Exotique", "wiki": "Jardin_Exotique_de_Monaco", "desc": "A garden of succulents and cacti clinging to a steep cliffside, offering some of the best panoramic views over the principality and coastline below. Beneath the garden, a cave system with stalactites and stalagmites adds an underground counterpoint to the desert-plant displays above. It's a quieter, less crowded stop than the harbor area."}, {"name": "Port Hercules", "wiki": "Port_Hercules", "desc": "Monaco's main harbor, lined with some of the largest and most luxurious yachts in the world, especially during major events like the Grand Prix or the Yacht Show. A walk along the harborfront offers a direct sense of the principality's wealth and its long relationship with the sea. It sits within easy walking distance of both the casino and the old town."}], "itineraryDays": 2, "itinerary": [{"label": "Day 1", "title": "Monte Carlo & the harbor", "desc": "The casino, Port Hercules, and a walk through Casino Square."}, {"label": "Day 2", "title": "The Rock & Jardin Exotique", "desc": "The Prince's Palace, Oceanographic Museum, and cliffside gardens above the city."}]}, {"id": "netherlands", "name": "Netherlands", "flag": "🇳🇱", "capital": "Amsterdam", "population": "18 million", "language": "Dutch", "currency": "Euro", "bestTime": "April for tulips, May–September generally", "blurb": "Amsterdam's canal-ringed old center, combined with the country's flat, easy cycling terrain, makes the Netherlands one of the simplest countries in Europe to explore slowly and on two wheels.", "attractions": [{"name": "Amsterdam's canal ring", "wiki": "Grachtengordel", "desc": "A UNESCO-listed network of concentric canals lined with narrow, gabled 17th-century townhouses, best seen either on foot or from a canal boat gliding beneath the arched bridges. The canal houses' distinctive lean and hooks above the top windows, once used for hoisting furniture, are a small architectural quirk worth noticing. Cycling along the canal paths remains one of the most authentic ways to experience the city."}, {"name": "Rijksmuseum, Amsterdam", "wiki": "Rijksmuseum", "desc": "The Netherlands' national museum, holding an extensive collection of Dutch Golden Age painting including Rembrandt's The Night Watch and Vermeer's The Milkmaid. Its restored 19th-century building is itself a work of art, with elaborate ceiling paintings throughout the galleries. A single visit typically requires several hours to see the highlights properly."}, {"name": "Keukenhof Gardens", "wiki": "Keukenhof", "desc": "One of the largest flower gardens in the world, open only during a roughly eight-week window each spring when millions of tulips, daffodils, and hyacinths bloom in elaborate designed beds. The surrounding countryside is also lined with commercial tulip fields worth a separate detour by bike or car. Its short opening season means planning ahead is essential."}, {"name": "Anne Frank House", "wiki": "Anne_Frank_House", "desc": "The canal house where Anne Frank and her family hid for two years during the Nazi occupation, now preserved largely as it was, including the movable bookcase that concealed the entrance to their hiding place. Anne's original diary pages are displayed alongside photographs and family artifacts. Tickets sell out well in advance and must be booked online."}, {"name": "Zaanse Schans windmills", "wiki": "Zaanse_Schans", "desc": "A collection of historic Dutch windmills and green wooden houses relocated to form an open-air preservation of traditional Dutch village life. Several windmills remain functional, still grinding spices, oil, or pigments as demonstrations for visitors. It's an easy half-day trip from Amsterdam for the classic windmill image many associate with the country."}, {"name": "Kinderdijk", "wiki": "Kinderdijk", "desc": "Nineteen well-preserved 18th-century windmills line the waterways of this UNESCO World Heritage Site, built as part of an elaborate water management system to keep the low-lying land dry. Cycling or walking the paths between the windmills offers an uncluttered view rarely seen at more commercialized sites. It's a quieter alternative to Zaanse Schans, especially outside peak hours."}], "itineraryDays": 6, "itinerary": [{"label": "Days 1–3", "title": "Amsterdam", "desc": "The canal ring, Rijksmuseum, and the Anne Frank House."}, {"label": "Day 4", "title": "Keukenhof (spring only) or Zaanse Schans", "desc": "Either the seasonal tulip gardens or the windmill village, depending on timing."}, {"label": "Days 5–6", "title": "Kinderdijk & departure", "desc": "A quieter windmill site before returning to Amsterdam for departure."}]}, {"id": "north-macedonia", "name": "North Macedonia", "flag": "🇲🇰", "capital": "Skopje", "population": "1.8 million", "language": "Macedonian", "currency": "Macedonian denar", "bestTime": "May–September", "blurb": "North Macedonia remains one of the least-visited corners of the Balkans, built around a lakeside old town, Ottoman-era Skopje, and mountain monasteries.", "attractions": [{"name": "Lake Ohrid & Ohrid's old town", "wiki": "Ohrid", "desc": "One of Europe's oldest and deepest lakes, its shores lined with the ancient town of Ohrid, a UNESCO World Heritage Site known for its Byzantine churches and old stone streets. The Church of St. John at Kaneo, perched on a clifftop above the water, is among the most photographed spots in the country. Boat trips and lakeside swimming add a relaxed pace to the historical sightseeing."}, {"name": "Skopje's Old Bazaar", "wiki": "Old_Bazaar,_Skopje", "desc": "One of the largest and oldest surviving bazaars in the Balkans, its Ottoman-era mosques, caravanserais, and craft workshops sitting just across the Stone Bridge from the capital's more modern, statue-heavy center. It survived Skopje's devastating 1963 earthquake largely intact. Traditional coppersmiths and jewelers still work from small shops within its lanes."}, {"name": "Matka Canyon", "wiki": "Matka_Canyon", "desc": "A steep river canyon just outside Skopje, home to several medieval monasteries and one of the largest artificial lakes in the country. Kayaking, hiking, and cave exploring, including one of the deepest underwater caves in Europe, are all possible within a short drive of the capital. It's a popular half-day or full-day escape from the city."}, {"name": "Bitola & Heraclea Lyncestis", "wiki": "Heraclea_Lyncestis", "desc": "Bitola's elegant 19th-century consular architecture reflects its former role as an important Ottoman diplomatic city, while the nearby ruins of Heraclea Lyncestis reveal a well-preserved ancient Macedonian and later Roman settlement, complete with detailed floor mosaics. The combination of eras within a short walk of each other is a distinctive draw. It's a quieter alternative to the busier capital."}, {"name": "Mavrovo National Park", "wiki": "Mavrovo_National_Park", "desc": "The country's largest national park, home to a mix of alpine lakes, forested mountains, and a well-known ski resort in winter. A partially submerged church visible when the reservoir's water level drops has become one of the park's most striking sights. Hiking trails here range from easy lakeside walks to more demanding mountain routes."}, {"name": "Millennium Cross, Skopje", "wiki": "Millennium_Cross", "desc": "A large steel cross standing atop Vodno mountain overlooking Skopje, built to mark 2,000 years of Christianity in the region. A cable car climbs most of the way up, with the final stretch on foot, rewarding visitors with wide views over the entire city and surrounding valley. It's a straightforward half-day addition to a Skopje visit."}], "itineraryDays": 6, "itinerary": [{"label": "Days 1–2", "title": "Skopje", "desc": "The Old Bazaar, Stone Bridge, and a cable car up to the Millennium Cross."}, {"label": "Day 3", "title": "Matka Canyon", "desc": "Kayaking and monastery visits on a day trip from the capital."}, {"label": "Days 4–5", "title": "Lake Ohrid", "desc": "The old town's churches, lakeside walks, and a boat trip on the water."}, {"label": "Day 6", "title": "Bitola", "desc": "The consular old town and the nearby Heraclea Lyncestis ruins before departure."}]}, {"id": "norway", "name": "Norway", "flag": "🇳🇴", "capital": "Oslo", "population": "5.5 million", "language": "Norwegian", "currency": "Norwegian krone", "bestTime": "June–August for fjords, October–March for northern lights", "blurb": "Norway's coastline is defined by its fjords, deep glacial valleys now filled with sea water and framed by cliffs and waterfalls, best seen by a combination of ferry, train, and hiking.", "attractions": [{"name": "Geirangerfjord", "wiki": "Geirangerfjord", "desc": "A UNESCO-listed fjord ringed by steep cliffs and waterfalls, including the Seven Sisters, which tumble down the rock face directly into the water. A ferry cruise through the fjord is the classic way to see it, passing abandoned farms once perched precariously on the cliffsides. The Trollstigen mountain road nearby adds a dramatic approach by land."}, {"name": "Preikestolen (Pulpit Rock)", "wiki": "Preikestolen", "desc": "A flat-topped cliff rising 604 meters directly above Lysefjord, reached by a moderate but rewarding day hike from a nearby car park. The sheer drop below has made it one of Norway's most photographed viewpoints, though there's no railing at the edge. Good weather makes a significant difference to the experience, so flexible scheduling helps."}, {"name": "Bergen & the Bryggen wharf", "wiki": "Bryggen", "desc": "Norway's second city sits at the gateway to the western fjords, its old Hanseatic wharf of colorful wooden buildings now a UNESCO World Heritage Site. A funicular up Mount Fløyen offers wide views over the city and surrounding islands. The city's fish market and narrow lanes make it an easy place to spend a full day."}, {"name": "Lofoten Islands", "wiki": "Lofoten", "desc": "A dramatic archipelago of jagged peaks rising directly from the sea, dotted with traditional red fishing cabins called rorbuer. It's known for both summer's midnight sun and winter's chance at the northern lights, depending on when you visit. Hiking trails here climb steeply for outsized views relative to the effort."}, {"name": "Flåm Railway", "wiki": "Flåm_Line", "desc": "One of the steepest standard-gauge railways in the world, descending through mountains and past waterfalls between the high plateau at Myrdal and the fjord village of Flåm. The hour-long ride passes through 20 tunnels and offers a stop at the thundering Kjosfossen waterfall. It's often combined with a fjord cruise to make the popular 'Norway in a Nutshell' route."}, {"name": "Oslo's Vigeland Park", "wiki": "Vigeland_installation", "desc": "An open-air sculpture park containing over 200 bronze, granite, and iron works by Gustav Vigeland, depicting the human life cycle in often striking, emotional detail. It's part of the larger Frogner Park and remains free and open year-round. Oslo's Viking Ship Museum and waterfront Opera House make natural additions to a city day."}], "itineraryDays": 9, "itinerary": [{"label": "Days 1–2", "title": "Oslo", "desc": "Vigeland Park, the Viking Ship Museum, and the harborside Opera House."}, {"label": "Days 3–4", "title": "Bergen", "desc": "The Bryggen wharf, Mount Fløyen, and the city's fish market."}, {"label": "Days 5–6", "title": "Flåm & the fjords", "desc": "The Flåm Railway and a cruise through Geirangerfjord or Nærøyfjord."}, {"label": "Days 7–9", "title": "Stavanger & Preikestolen", "desc": "The Pulpit Rock hike, with time to explore Stavanger's old town."}]}, {"id": "poland", "name": "Poland", "flag": "🇵🇱", "capital": "Warsaw", "population": "37 million", "language": "Polish", "currency": "Polish złoty", "bestTime": "May–September", "blurb": "Poland's cities were largely rebuilt after devastating wartime destruction, giving Warsaw and Kraków a mix of genuinely old and carefully reconstructed architecture, alongside some of Europe's most important historical sites.", "attractions": [{"name": "Kraków's Old Town & Wawel Castle", "wiki": "Wawel_Castle", "desc": "Kraków's medieval market square, one of the largest in Europe, is ringed by the Cloth Hall and St. Mary's Basilica, whose trumpet call from the tower is interrupted each hour in memory of a 13th-century watchman. Wawel Castle, seat of Polish kings for centuries, overlooks the Vistula River nearby. Unlike Warsaw, much of Kraków's old town survived the Second World War intact."}, {"name": "Auschwitz-Birkenau Memorial", "wiki": "Auschwitz_concentration_camp", "desc": "The site of the largest Nazi concentration and extermination camp, preserved as a memorial and museum to the more than a million people, mostly Jewish, who were murdered there during the Holocaust. Guided tours walk through original barracks, gas chambers, and the infamous entrance gate reading 'Arbeit macht frei'. It's widely considered a necessary, if deeply difficult, visit for understanding 20th-century history."}, {"name": "Wieliczka Salt Mine", "wiki": "Wieliczka_Salt_Mine", "desc": "A working salt mine dating back to the 13th century, its underground chapels, statues, and even a chandelier all carved directly from rock salt by generations of miners. St. Kinga's Chapel, an entire underground church, is the most striking of its excavated chambers. The mine operated continuously until relatively recently and remains a UNESCO World Heritage Site."}, {"name": "Warsaw's Old Town", "wiki": "Warsaw_Old_Town", "desc": "Nearly entirely destroyed during World War II, Warsaw's old town was meticulously rebuilt after the war using paintings and photographs as reference, an achievement recognized by UNESCO. The colorful market square and Royal Castle give little outward sign of the destruction the area once suffered. The nearby Warsaw Uprising Museum adds essential context to the city's wartime history."}, {"name": "Białowieża Forest", "wiki": "Białowieża_Forest", "desc": "One of the last remaining fragments of the primeval forest that once covered much of lowland Europe, straddling the border between Poland and Belarus. It's home to the largest population of European bison, successfully reintroduced after near-extinction in the wild. Guided walks are required in the strictly protected core zone to preserve its old-growth character."}, {"name": "Malbork Castle", "wiki": "Malbork_Castle", "desc": "The largest castle in the world by land area, built by the Teutonic Knights in the 13th century as their order's headquarters along the Nogat River. Its scale and largely intact brick Gothic architecture make it one of Europe's most impressive medieval fortresses. It's an easy day trip from Gdańsk on the Baltic coast."}], "itineraryDays": 9, "itinerary": [{"label": "Days 1–3", "title": "Warsaw", "desc": "The rebuilt Old Town, the Warsaw Uprising Museum, and the Royal Castle."}, {"label": "Days 4–6", "title": "Kraków", "desc": "The medieval market square, Wawel Castle, and the Wieliczka Salt Mine."}, {"label": "Day 7", "title": "Auschwitz-Birkenau", "desc": "A sobering day trip to the memorial and museum near Oświęcim."}, {"label": "Days 8–9", "title": "Białowieża or Gdańsk", "desc": "Either the primeval forest's bison or a Baltic coast stop before departure."}]}, {"id": "portugal", "name": "Portugal", "flag": "🇵🇹", "capital": "Lisbon", "population": "10.3 million", "language": "Portuguese", "currency": "Euro", "bestTime": "April–June, September–October", "blurb": "Portugal is compact enough to cover Lisbon, Porto, and the Algarve coast without much time lost in transit.", "attractions": [{"name": "Belém Tower & Jerónimos Monastery", "wiki": "Belém_Tower", "desc": "Lisbon's riverside monuments from the Age of Discovery, built to commemorate the era's maritime explorations. The tower's ornate Manueline stonework, a distinctly Portuguese architectural style, incorporates maritime motifs like ropes and armillary spheres. Nearby, the monastery's cloisters hold the tomb of explorer Vasco da Gama."}, {"name": "Ribeira, Porto", "wiki": "Ribeira_(Porto)", "desc": "The old riverside district's colorful, tightly packed buildings climb steeply from the Douro River, with port wine cellars, or caves, just across the Dom Luís I Bridge in Vila Nova de Gaia. Traditional rabelo boats, once used to transport port wine barrels downriver, now serve mainly for scenic cruises. The bridge itself, designed by an associate of Gustave Eiffel, offers sweeping views over both banks."}, {"name": "Sintra's palaces", "wiki": "Sintra", "desc": "Pena Palace's brightly colored, almost fantastical exterior sits atop a forested hill, one of several eccentric royal and aristocratic estates scattered through this cooler mountain town outside Lisbon. Quinta da Regaleira adds an initiatic well descending in a spiral through symbolic gardens. The combination of romantic architecture and dense forest makes Sintra feel distinctly different from coastal Portugal."}, {"name": "Algarve coastline", "wiki": "Algarve", "desc": "Cliffs, sea caves, and beach towns like Lagos line Portugal's southern coast, with the Benagil Cave among the most photographed formations, accessible by boat or kayak. Golden sandstone cliffs contrast sharply with the deep blue Atlantic below. The region draws heavy crowds in peak summer, making shoulder-season visits considerably more relaxed."}, {"name": "Douro Valley", "wiki": "Douro_Valley", "desc": "Steep terraced vineyards line the Douro River, producing the grapes used in port wine for centuries, in
